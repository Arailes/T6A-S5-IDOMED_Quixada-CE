<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizzes Interativos - T6A S5</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            color: #ffffff;
            font-weight: 600;
        }

        p.subtitle {
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-size: 1.05rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px 20px;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .card:hover {
            transform: translateY(-5px);
            background-color: #273548;
            border-color: var(--accent-color);
            box-shadow: 0 10px 20px -3px rgba(59, 130, 246, 0.2);
        }

        .icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .card h3 {
            margin: 0 0 6px 0;
            font-size: 1.2rem;
            color: #f1f5f9;
        }

        .card span {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        footer {
            margin-top: 50px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Plataforma de Quizzes - IDOMED Quixada-CE Turma 6A - cortesia do aluno <a href="https://instagram.com/ja.feitosa.junior" target="_blank" style="color: inherit; text-decoration: underline;">202407118577</a></h1>
        <p class="subtitle">Selecione a disciplina para acessar o questionário interativo</p>
        
        <div class="grid">
            <!-- Clínica Cirúrgica I -->
            <a href="cc1/index.html" class="card">
                <div class="icon">🔪</div>
                <h3>Clínica Cirúrgica I</h3>
                <span>cc1</span>
            </a>
            
            <!-- Clínica Médica I -->
            <a href="cm1/index.html" class="card">
                <div class="icon">🩺</div>
                <h3>Clínica Médica I</h3>
                <span>cm1</span>
            </a>
            
            <!-- Farmacologia II -->
            <a href="farmaco2/index.html" class="card">
                <div class="icon">💊</div>
                <h3>Farmacologia II</h3>
                <span>farmaco2</span>
            </a>
            
            <!-- IESC V -->
            <a href="iesc5/index.html" class="card">
                <div class="icon">🏥</div>
                <h3>IESC V</h3>
                <span>iesc5</span>
            </a>
        </div>

        <footer>
            T6A-S5 • IDOMED Quixadá
        </footer>
    </div>
</body>
</html>
