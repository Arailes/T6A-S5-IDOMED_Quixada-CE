rdíaca é:","a":["A) Furosemida","C) Gluconato de cálcio","B) Insulina isoladamente","D) Bicarbonato obrigatoriamente"],"correct":1},{"q":"Sobre o gluconato de cálcio utilizado na hipercalemia, é correto afirmar:","a":["A) Remove diretamente o K⁺ do organismo","C) Aumenta a excreção renal de K⁺ obrigatoriamente","B) Estabiliza a membrana cardíaca","D) Corrige a causa da hipercalemia"],"correct":2},{"q":"A fórmula correta do débito cardíaco é:","a":["A) DC = PA × FC","C) DC = PAS − PAD","D) DC = resistência × volume","B) DC = FC × volume sistólico"],"correct":3},{"q":"O pH arterial normal está aproximadamente entre:","a":["C) 7,35–7,45","A) 6,80–7,00","B) 7,00–7,20","D) 7,60–7,80"],"correct":0},{"q":"Na interpretação ácido-base, o bicarbonato (HCO₃⁻) representa principalmente o componente:","a":["A) Respiratório","B) Metabólico","C) Neurológico","D) Hematológico"],"correct":1},{"q":"A PaCO₂ representa principalmente o componente:","a":["A) Metabólico","B) Renal","C) Respiratório","D) Eletrolítico"],"correct":2},{"q":"Paciente apresenta: pH = 7,25 | HCO₃⁻ = 16 mEq/L | PaCO₂ = 30 mmHg. O distúrbio primário é:","a":["A) Alcalose metabólica","C) Acidose respiratória","D) Alcalose respiratória","B) Acidose metabólica"],"correct":3},{"q":"Paciente apresenta: pH = 7,52 | HCO₃⁻ = 34 mEq/L | PaCO₂ = 48 mmHg. O diagnóstico mais provável é:","a":["B) Alcalose metabólica","A) Acidose metabólica","C) Acidose respiratória","D) Alcalose respiratória"],"correct":0},{"q":"Paciente apresenta: pH = 7,25 | HCO₃⁻ = 25 mEq/L | PaCO₂ = 60 mmHg. O diagnóstico é:","a":["B) Alcalose respiratória","A) Acidose respiratória","C) Acidose metabólica","D) Alcalose metabólica"],"correct":1},{"q":"Paciente apresenta: pH = 7,50 | HCO₃⁻ = 24 mEq/L | PaCO₂ = 28 mmHg. O diagnóstico é:","a":["A) Acidose metabólica","B) Alcalose metabólica","D) Alcalose respiratória","C) Acidose respiratória"],"correct":2},{"q":"Paciente com diarreia intensa apresenta: pH = 7,28 | HCO₃⁻ = 15 mEq/L | PaCO₂ = 29 mmHg. A alteração primária é:","a":["B) Alcalose metabólica","C) Acidose respiratória","D) Alcalose respiratória","A) Acidose metabólica"],"correct":3},{"q":"Paciente apresenta vômitos persistentes há quatro dias. Gasometria: pH = 7,50 | HCO₃⁻ = 36 mEq/L | PaCO₂ = 48 mmHg. A alteração predominante é:","a":["B) Alcalose metabólica","A) Acidose metabólica","C) Acidose respiratória","D) Alcalose respiratória"],"correct":0},{"q":"Paciente com DPOC apresenta: pH = 7,30 | PaCO₂ = 60 mmHg | HCO₃⁻ = 28 mEq/L. O distúrbio primário é:","a":["A) Acidose metabólica","C) Acidose respiratória","B) Alcalose metabólica","D) Alcalose respiratória"],"correct":1},{"q":"Paciente ansioso apresenta hiperventilação intensa. Gasometria: pH = 7,48 | PaCO₂ = 30 mmHg | HCO₃⁻ = 23 mEq/L. O diagnóstico é:","a":["B) Alcalose metabólica","C) Acidose respiratória","A) Alcalose respiratória","D) Acidose metabólica"],"correct":2},{"q":"Um paciente em choque apresenta hipoperfusão tecidual, lactato elevado e acidemia. O mecanismo que melhor explica a alteração ácido-base é:","a":["A) Aumento do metabolismo aeróbio","C) Retenção exclusiva de bicarbonato","D) Redução da produção de ácidos","B) Metabolismo anaeróbio com produção de lactato"],"correct":3},{"q":"Paciente apresenta acidose metabólica com: Na⁺ = 140 | Cl⁻ = 100 | HCO₃⁻ = 15. Qual é o ânion gap?","a":["C) 25","A) 15","B) 20","D) 35"],"correct":0},{"q":"Um paciente apresenta: Na⁺ = 140 | Cl⁻ = 115 | HCO₃⁻ = 15. O ânion gap é:","a":["A) 5","B) 10","C) 15","D) 25"],"correct":1},{"q":"Paciente com cetoacidose diabética apresenta pH baixo, HCO₃⁻ baixo e PaCO₂ reduzida. A redução da PaCO₂ representa:","a":["A) Distúrbio respiratório primário","C) Compensação renal","B) Compensação respiratória","D) Alcalose metabólica"],"correct":2},{"q":"Paciente chega ao pronto-socorro após vários episódios de vômitos. Apresenta fraqueza, K⁺ = 2,9 mEq/L e gasometria demonstrando alcalemia com HCO₃⁻ elevado. Qual combinação é mais provável?","a":["A) Acidose metabólica + hipercalemia","C) Acidose respiratória + hipercalemia","D) Alcalose respiratória + hipernatremia","B) Alcalose metabólica + hipocalemia"],"correct":3},{"q":"Paciente com insuficiência renal apresenta K⁺ = 6,8 mEq/L e alterações eletrocardiográficas. Qual é a prioridade?","a":["C) Administrar gluconato de cálcio para estabilização cardíaca","A) Administrar apenas solução salina","B) Aguardar novo potássio antes de tratar","D) Administrar apenas reposição de potássio"],"correct":0},{"q":"Paciente politraumatizado apresenta hipotensão, taquicardia, extremidades frias, oligúria e alteração do nível de consciência. Gasometria demonstra acidose metabólica com lactato elevado. Qual sequência fisiopatológica melhor explica o quadro?","a":["B) Hipoperfusão → aumento da oferta de O₂ → lactato ↓ → alcalose","A) Hipoperfusão → redução da oferta de O₂ → metabolismo anaeróbio → lactato ↑ → acidose","C) Hipervolemia → aumento da perfusão → lactato ↑ → alcalose","D) Hipercapnia primária → aumento do bicarbonato → acidose láctica"],"correct":1},{"q":"[Fisiologia Básica] 1. Em um adulto jovem hígido do sexo masculino, a água corporal total (ACT) representa aproximadamente qual porcentagem do peso corporal total?","a":["A) 40%","B) 50%","C) 60%","D) 80%"],"correct":2},{"q":"2. Em relação à distribuição da água corporal total entre os compartimentos do organismo, qual é a proporção correta entre o Líquido Intracelular (LIC) e o Líquido Extracelular (LEC)?","a":["A) 1/2 no LIC e 1/2 no LEC","C) 3/4 no LIC e 1/4 no LEC","D) 1/3 no LIC e 2/3 no LEC","B) 2/3 no LIC e 1/3 no LEC"],"correct":3},{"q":"3. O Líquido Extracelular (LEC) é subdividido em intersticial e intravascular (plasmático). Qual fração do LEC corresponde ao volume intravascular?","a":["A) Aproximadamente 1/4","B) Aproximadamente 1/2","C) Aproximadamente 3/4","D) Aproximadamente 1/10"],"correct":0},{"q":"4. Qual é o principal soluto e determinante osmótico efetivo do compartimento extracelular?","a":["A) Ureia","D) Sódio","B) Potássio","C) Glicose"],"correct":1},{"q":"5. A osmolaridade plasmática efetiva (ou tonicidade) desconsidera substâncias que cruzam livremente a membrana celular. Qual é a fórmula utilizada para o seu cálculo à beira do leito?","a":["A) 2 × Na⁺ + Glicose / 18 + Ureia / 6","C) Na⁺ + K⁺ + Glicose / 18","B) 2 × Na⁺ + Glicose / 18","D) 2 × (Na⁺ + K⁺) + Ureia / 6"],"correct":2},{"q":"6. As perdas insensíveis de água em um paciente adulto afebril sem ventilação mecânica ocorrem através da pele e respiração, totalizando em média:","a":["A) 100 a 200 mL/dia","B) 300 a 400 mL/dia","D) 1500 a 2000 mL/dia","C) 600 a 1000 mL/dia"],"correct":3},{"q":"7. O principal estímulo fisiológico para a liberação do hormônio antidiurético (ADH ou vasopressina) pelos osmorreceptores hipotalâmicos é:","a":["B) Aumento de apenas 1 a 2% na osmolalidade plasmática","A) Queda de 10% na pressão arterial sistólica","C) Redução do volume intravascular em mais de 15%","D) Elevação súbita da concentração sérica de potássio"],"correct":0},{"q":"8. Ao comparar o Soro Fisiológico a 0,9% com o Ringer Lactato, é correto afirmar que o Ringer Lactato apresenta:","a":["A) Maior concentração de sódio e menor concentração de cloreto","B) Menor concentração de cloreto e tampão lactato, aproximando-se da composição do plasma","C) Ausência de potássio e cálcio em sua formulação","D) Osmolaridade teórica significativamente superior à do plasma (hipertônico)"],"correct":1},{"q":"9. O mecanismo pelo qual a albumina sérica mantém o volume intravascular depende fundamentalmente da:","a":["A) Pressão hidrostática capilar","C) Ação da bomba de Na⁺/K⁺-ATPase","B) Pressão oncótica (coloidosmótica)","D) Osmolaridade efetiva do sódio"],"correct":2},{"q":"10. Um \\\"hiato osmolar\\\" (Gap Osmolar plasmático) elevado (> 10 mOsm/kg), calculado pela diferença entre a osmolaridade medida e a osmolaridade calculada, sugere:","a":["B) Hiponatremia dilucional severa","C) Alcalose metabólica grave por vômitos","D) Desidratação hipotônica simples","A) Presença de solutos exógenos osmoticamente ativos (ex.: metanol, etilenoglicol, manitol)"],"correct":3},{"q":"[Distúrbios do Sódio] 11. A hiponatremia é definida laboratorialmente por níveis séricos de sódio inferiores a:","a":["B) 135 mEq/L","A) 140 mEq/L","C) 130 mEq/L","D) 125 mEq/L"],"correct":0},{"q":"12. A pseudohiponatremia é um artefato laboratorial em que a concentração plasmática de sódio aparece falsamente reduzida devido a:","a":["A) Hiperglicemia extrema sem cetoacidose","B) Elevação intensa de lipídios ou proteínas plasmáticas ocupando a fração líquida do plasma","C) Uso excessivo de diuréticos de alça","D) Insuficiência adrenal primária"],"correct":1},{"q":"13. Na hiperglicemia aguda, a movimentação osmótica de água do LIC para o LEC dilui o sódio sérico. Qual é o fator de correção tradicional de Katz para o sódio?","a":["B) Subtrair 1,6 mEq/L de Na⁺ para cada 100 mg/dL de glicose acima de 100 mg/dL","C) Somar 3,0 mEq/L de Na⁺ para cada 50 mg/dL de glicose acima de 200 mg/dL","A) Somar 1,6 mEq/L de Na⁺ para cada 100 mg/dL de glicose acima de 100 mg/dL","D) Subtrair 2,4 mEq/L de Na⁺ para cada 100 mg/dL de glicose acima de 100 mg/dL"],"correct":2},{"q":"14. Em relação ao estado volêmico, qual etiologia corresponde a uma hiponatremia hipovolêmica com sódio urinário elevado (> 20–30 mEq/L)?","a":["A) Vômitos incoercíveis com perda gástrica pura","B) Insuficiência cardíaca congestiva descompensada","D) Cirrose hepática com ascite volumosa","C) Uso de diuréticos tiazídicos ou perda renal de sal"],"correct":3},{"q":"15. A Síndrome da Secreção Inapropriada do Hormônio Antidiurético (SIADH) caracteriza-se clinicamente por:","a":["B) Hiponatremia euvolêmica com osmolalidade urinária inadequadamente concentrada (> 100 mOsm/kg)","A) Hiponatremia hipervolêmica com edema periférico evidente","C) Hiponatremia hipovolêmica com sede intensa e taquicardia","D) Hipernatremia euvolêmica com poliúria aquosa"],"correct":0},{"q":"16. Diante de um paciente com hiponatremia severa aguda sintomática cursando com convulsões ou rebaixamento do nível de consciência, qual é a conduta farmacológica imediata recomendada?","a":["B) Hidratação venosa ampla com Soro Fisiológico a 0,9% a 200 mL/h","A) Infusão rápida de Solução Salina a 3% em bôlus para elevar o sódio de 4 a 6 mEq/L","C) Restrição hídrica exclusiva de 500 mL/dia associada a furosemida","D) Infusão de Soro Glicosado a 5% com cloreto de potássio"],"correct":1},{"q":"17. Na correção da hiponatremia crônica, qual é o limite máximo seguro de elevação do sódio sérico em 24 horas para evitar lesão neurológica irreversível?","a":["A) 4 a 6 mEq/L","C) 15 a 18 mEq/L","B) 8 a 10 mEq/L","D) 20 a 24 mEq/L"],"correct":2},{"q":"18. A complicação neurológica clássica decorrente da correção excessivamente rápida de uma hiponatremia crônica é a:","a":["A) Hemorragia intraparenquimatosa","C) Herniação cerebral transtentorial por edema agudo","D) Trombose de seio venoso dural","B) Síndrome da Desmielinização Osmótica (Mielinólise Pontina Central)"],"correct":3},{"q":"19. A hipernatremia (Na⁺ > 145 mEq/L) decorre predominantemente de:","a":["B) Déficit de água livre em relação ao conteúdo de sódio corporal","A) Excesso primário de ingestão de cloreto de sódio","C) Intoxicação hídrica por reposição hipotônica","D) Secreção excessiva de peptídeo natriurético atrial"],"correct":0},{"q":"20. A correção rápida de uma hipernatremia de instalação crônica (> 48h) com soluções hipotônicas em grande volume acarreta risco imediato de:","a":["A) Mielinólise pontina central","B) Edema cerebral com hipertensão intracraniana","C) Isquemia mesentérica não oclusiva","D) Acidose tubular renal distal"],"correct":1},{"q":"[Distúrbios do Potássio] 21. Qual é a faixa fisiológica padrão de referência para a concentração sérica de potássio no adulto?","a":["A) 2,5 a 4,0 mEq/L","C) 4,5 a 6,0 mEq/L","B) 3,5 a 5,0 mEq/L","D) 5,0 a 6,5 mEq/L"],"correct":2},{"q":"22. Qual dos fatores a seguir promove a entrada (shift) de potássio do espaço extracelular para o intracelular?","a":["A) Acidose metabólica inorgânica","B) Bloqueio dos receptores beta-adrenérgicos","D) Lise celular tumoral ou rabdomiólise","C) Ação da insulina e alcalose metabólica"],"correct":3},{"q":"23. Qual alteração eletrocardiográfica é considerada típica e precoce na hipocalemia moderada a grave?","a":["A) Aparecimento de ondas U e achatamento da onda T","B) Alargamento do intervalo PR e bloqueio atrioventricular total","C) Encurtamento marcado do intervalo QT","D) Onda T apiculada, simétrica e de base estreita"],"correct":0},{"q":"24. Na reposição venosa de cloreto de potássio (KCl), qual é a velocidade máxima de infusão recomendada em acesso venoso periférico para evitar flebite e parada cardíaca?","a":["B) 30 a 40 mEq/hora","A) 10 a 20 mEq/hora","C) 50 mEq/hora","D) 100 mEq/hora em bôlus"],"correct":1},{"q":"25. Um paciente internado apresenta hipocalemia refratária que não normaliza mesmo após sucessivas reposições venosas de KCl. Qual distúrbio eletrolítico associado deve ser pesquisado e corrigido prioritariamente?","a":["A) Hipercalcemia","C) Hiperfosfatemia","B) Hipomagnesemia","D) Hipercloremia"],"correct":2},{"q":"26. Qual é a primeira alteração eletrocardiográfica a surgir na hipercalemia (K⁺ entre 5,5 e 6,5 mEq/L)?","a":["A) Onda U proeminente","C) Desaparecimento completo da onda P","D) Ritmo sinoventricular com padrão sinusoidal","B) Onda T apiculada, simétrica e em tenda"],"correct":3},{"q":"27. Paciente com insuficiência renal aguda apresenta K⁺ = 7,4 mEq/L e o ECG evidencia alargamento do complexo QRS e achatamento de onda P. Qual medida farmacológica deve ser instituída de imediato?","a":["C) Gluconato de cálcio a 10% por via endovenosa","A) Solução de insulina regular com glicose 50%","B) Resina de troca de potássio por via retal (poliestirenossulfonato)","D) Nebulização contínua com salbutamol"],"correct":0},{"q":"28. Qual é o objetivo terapêutico primordial da administração do Gluconato de Cálcio a 10% no tratamento da hipercalemia grave?","a":["A) Promover a excreção renal imediata de potássio","C) Estabilizar a membrana do cardiomiócito sem alterar a concentração sérica de potássio","B) Forçar o influxo de potássio para o interior das células","D) Corrigir a acidose metabólica associada ao choque"],"correct":1},{"q":"29. Dentre as opções abaixo, qual conduta terapêutica promove a translocação intracelular temporária do potássio sérico?","a":["A) Furosemida venosa","C) Resina de troca (Sorcal)","B) Solução de Glicoinsulina (Insulina Regular + Glicose)","D) Hemodiálise de urgência"],"correct":2},{"q":"30. Para promover a remoção efetiva e definitiva do excesso de potássio do organismo em um paciente com diurese preservada, utiliza-se:","a":["A) Bicarbonato de sódio a 8,4%","B) Nebulização com beta-2 agonista","D) Gluconato de cálcio a 10%","C) Diuréticos de alça (como a furosemida)"],"correct":3},{"q":"[Cálcio, Magnésio e Fósforo] 31. Em pacientes cirúrgicos com hipoalbuminemia importante, a avaliação da calcemia deve ser corrigida ou complementada com a dosagem de:","a":["A) Cálcio ionizado (iônico)","B) Cálcio ligado a citrato","C) Fosfatase alcalina","D) Paratormônio intacto (PTH)"],"correct":0},{"q":"32. A contração involuntária da musculatura facial ipsilateral provocada pela percussão leve do tronco do nervo facial à frente do meato acústico externo denomina-se:","a":["A) Sinal de Trousseau","B) Sinal de Chvostek","C) Sinal de Cullen","D) Sinal de Grey-Turner"],"correct":1},{"q":"33. O espasmo carpopodal desencadeado pela insuflação do manguito do esfigmomanômetro cerca de 20 mmHg acima da pressão arterial sistólica por 3 minutos é o:","a":["A) Sinal de Chvostek","C) Sinal de Homans","B) Sinal de Trousseau","D) Sinal de Blumberg"],"correct":2},{"q":"34. No traçado eletrocardiográfico, a manifestação eletrofisiológica clássica decorrente da hipocalcemia aguda é:","a":["A) Alargamento isolado do complexo QRS","B) Encurtamento do intervalo PR","D) Encurtamento acentuado do intervalo QT","C) Alongamento do intervalo QT (devido ao aumento da fase 2 do potencial de ação)"],"correct":3},{"q":"35. Qual é a etiologia mais comum de hipercalcemia em pacientes ambulatoriais sem histórico neoplásico evidente?","a":["A) Hiperparatireoidismo primário","B) Neoplasia oculta com metástase lítica","C) Intoxicação por vitamina D","D) Síndrome do leite-álcali"],"correct":0},{"q":"36. Em pacientes internados com hipercalcemia grave (Ca²⁺ > 14 mg/dL), a principal causa de base é:","a":["A) Sarcoidose","C) Neoplasia maligna (hipercalcemia da malignidade)","B) Hiperparatireoidismo secundário","D) Imobilização prolongada"],"correct":1},{"q":"37. A manifestação clínica mais temida e potencialmente fatal da hipofosfatemia severa na Síndrome de Realimentação cirúrgica decorre da:","a":["B) Crise hipertensiva refratária","C) Pancreatite aguda necrotizante","A) Falência respiratória aguda por fraqueza da musculatura diafragmática","D) Mielinólise pontina central"],"correct":2},{"q":"38. Paciente no 5º DPO de cirurgia abdominal de grande porte em uso de nutrição parenteral exclusiva desenvolve tremores, hiperreflexia tendinosa e arritmias ventriculares. O potássio e o cálcio estão normais. Qual íon deve ser investigado prioritariamente?","a":["A) Sódio","C) Cloreto","D) Bicarbonato","B) Magnésio"],"correct":3},{"q":"[Equilíbrio Ácido-Base e Gasometria] 39. Quais são os valores de referência fisiológicos no sangue arterial para o pH, a pressão parcial de gás carbônico (pCO₂) e o bicarbonato (HCO₃⁻), respectivamente?","a":["B) 7,35–7,45; 35–45 mmHg; 22–26 mEq/L","A) 7,25–7,35; 40–50 mmHg; 18–22 mEq/L","C) 7,40–7,50; 30–40 mmHg; 24–28 mEq/L","D) 7,30–7,40; 45–55 mmHg; 20–24 mEq/L"],"correct":0},{"q":"40. A fórmula para o cálculo do Ânion Gap sérico é expressa por:","a":["B) (Na⁺ + K⁺) - Cl⁻","A) Na⁺ - (Cl⁻ + HCO₃⁻)","C) Na⁺ - Cl⁻ / HCO₃⁻","D) (Na⁺ + Cl⁻) - HCO₃⁻"],"correct":1},{"q":"41. O valor fisiológico de referência padrão para o Ânion Gap sérico oscila entre:","a":["A) 2 a 6 mEq/L","C) 16 a 20 mEq/L","B) 8 a 12 mEq/L","D) 22 a 26 mEq/L"],"correct":2},{"q":"42. Qual das opções a seguir é uma causa clássica de acidose metabólica com Ânion Gap NORMAL (hiperclorêmica)?","a":["A) Choque séptico com acidose lática","B) Cetoacidose diabética","D) Insuficiência renal terminal com uremia","C) Perda intestinal baixa (diarreia volumosa ou fístula entérica)"],"correct":3},{"q":"43. Qual das causas a seguir cursa com acidose metabólica com Ânion Gap ELEVADO?","a":["C) Cetoacidose alcoólica","A) Acidose tubular renal tipo 1","B) Infusão maciça de solução de cloreto de sódio a 0,9%","D) Drenagem biliar externa copiosa"],"correct":0},{"q":"44. Paciente cirúrgico submetido à descompressão gástrica com sonda nasogástrica (SNG) aberta com alto débito de drenagem de suco gástrico tem maior propensão a desenvolver:","a":["A) Acidose metabólica com ânion gap normal","B) Alcalose metabólica hipoclorêmica e hipocalêmica","C) Acidose respiratória crônica","D) Alcalose respiratória pura"],"correct":1},{"q":"45. Em uma acidose metabólica primária, qual é a resposta compensatória fisiológica esperada pelo sistema respiratório?","a":["A) Redução da ventilação minuto, retendo CO₂","C) Aumento isolado do volume corrente sem alteração da pCO₂","B) Hiperventilação alveolar, reduzindo a pCO₂ (respiração de Kussmaul)","D) Inibição completa do centro respiratório bulbar"],"correct":2},{"q":"46. A resposta renal fisiológica compensatória em um quadro de acidose respiratória crônica consiste em:","a":["A) Excreção renal aumentada de bicarbonato","C) Retenção tubular seletiva de íons hidrogênio","D) Inibição da produção de amônia tubular","B) Retenção e regeneração renal de bicarbonato com aumento da acidez titulável urinária"],"correct":3},{"q":"[Casos Clínicos Integrados] 47. Paciente de 72 anos, no 4º dia de pós-operatório de colectomia parcial, evolui com desorientação progressiva. Exames laboratoriais revelam: Na⁺ = 118 mEq/L, K⁺ = 4,0 mEq/L, Glicemia = 95 mg/dL. Ao exame físico: mucosas úmidas, turgor cutâneo preservado, sem edemas em membros inferiores e com pressão arterial de 130/80 mmHg. Osmolalidade urinária = 450 mOsm/kg e sódio urinário = 45 mEq/L. Qual é o diagnóstico mais provável e a conduta inicial para o quadro?","a":["C) Síndrome da Secreção Inapropriada de ADH (SIADH); restrição hídrica rigorosa.","A) Síndrome perdedora de sal cerebral; reposição volêmica vigorosa com salina isotônica.","B) Insuficiência cardíaca descompensada; restrição salina e furosemida venosa.","D) Hiponatremia hipovolêmica por terceiro espaço; infusão de albumina a 20%."],"correct":0},{"q":"48. Vítima de colisão moto contra anteparo chega à sala de trauma em choque hemorrágico classe III. Recebe 4000 mL de Soro Fisiológico a 0,9% durante o transporte e a primeira hora de atendimento. A gasometria de controle revela: pH = 7,26, HCO₃⁻ = 15 mEq/L, pCO₂ = 32 mmHg, Na⁺ = 142 mEq/L, Cl⁻ = 117 mEq/L. Qual é a interpretação do distúrbio ácido-base instalado e sua causa determinante?","a":["A) Acidose metabólica com ânion gap elevado por acidose lática persistente.","C) Acidose metabólica hiperclorêmica com ânion gap normal decorrente da sobrecarga de cloreto pelo SF 0,9%.","B) Acidose respiratória aguda decorrente de contusão pulmonar grave.","D) Alcalose metabólica mascarada por hipoventilação reflexa."],"correct":1},{"q":"49. Mulher de 42 anos é submetida a tireoidectomia total por carcinoma papilífero. No segundo dia de pós-operatório, queixa-se de formigamento perilabial contínuo e câimbras intensas nos pés e mãos. Ao aferir a pressão arterial, nota-se flexão do punho e das articulações metacarpofalângicas da paciente. Qual fármaco deve ser prescrito imediatamente por via intravenosa?","a":["A) Sulfato de magnésio a 50%","B) Cloreto de potássio a 10%","C) Gluconato de cálcio a 10%","D) Fosfato de potássio"],"correct":2},{"q":"50. Homem de 58 anos, etilista crônico desnutrido, é internado com diagnóstico de fístula digestiva de alto débito e inicia Nutrição Parenteral Total (NPT) com alto aporte calórico. No terceiro dia de infusão, desenvolve insuficiência respiratória aguda, fraqueza muscular generalizada e arritmia cardíaca. A dosagem laboratorial mostrará caracteristicamente uma queda acentuada de qual elemento sérico?","a":["A) Sódio","C) Cloreto","D) Ureia","B) Fósforo"],"correct":3},{"q":"[Soluções Venosas e Compartimentos] 51. Qual é a distribuição esperada de 1.000 mL de Soro Glicosado a 5% (SG 5%) após sua metabolização no organismo de um adulto saudável?","a":["C) Cerca de 666 mL no líquido intracelular (LIC) e 333 mL no líquido extracelular (LEC).","A) 1.000 mL no espaço intravascular.","B) 750 mL no espaço intersticial e 250 mL no intravascular.","D) 1.000 mL no compartimento extracelular."],"correct":0},{"q":"52. Na reanimação volêmica inicial do paciente em choque hipovolêmico, o ATLS recomenda o uso de soluções isotônicas aquecidas. Qual é a principal desvantagem do uso abusivo de Soro Fisiológico a 0,9% (NaCl 0,9%) nesse cenário?","a":["A) Alcalose metabólica hipoclorêmica.","B) Acidose metabólica hiperclorêmica.","C) Coagulopatia por diluição de plaquetas.","D) Hiponatremia dilucional severa."],"correct":1},{"q":"53. O Ringer Lactato é amplamente utilizado em cirurgias. No fígado, o lactato presente na solução é primariamente convertido em:","a":["A) Cloreto.","C) Glicose.","B) Bicarbonato.","D) Piruvato."],"correct":2},{"q":"54. Em pacientes vítimas de trauma cranioencefálico grave (TCE) com hipertensão intracraniana, qual solução cristaloide deve ser evitada por sua característica levemente hipotônica em relação ao plasma (osmolaridade in vivo)?","a":["A) Salina Hipertônica a 3%.","B) Soro Fisiológico a 0,9%.","D) Albumina humana a 20%.","C) Ringer Lactato."],"correct":3},{"q":"55. Ao avaliar um paciente no pós-operatório com suspeita de hipovolemia, qual dos seguintes achados clínicos é o indicador mais precoce de perda de volume intravascular compensada?","a":["B) Redução da amplitude do pulso (pressão de pulso pinçada) e taquicardia.","A) Hipotensão arterial (PAS < 90 mmHg).","C) Rebaixamento do nível de consciência.","D) Anúria completa."],"correct":0},{"q":"56. Um paciente submetido a uma cirurgia prolongada apresenta edema periférico generalizado (anasarca) no 3º DPO, porém está hipotenso, taquicárdico e oligúrico. Qual é a melhor descrição para este estado fisiológico?","a":["A) Hipervolemia absoluta com hipertensão sistêmica.","B) Depleção do espaço intravascular com expansão do terceiro espaço (intersticial).","C) Intoxicação hídrica primária por iatrogenia.","D) Insuficiência renal aguda pós-renal."],"correct":1},{"q":"57. A reposição volêmica ideal para perdas gástricas puras (ex.: vômitos repetidos por estenose de piloro) deve ser feita com:","a":["A) Ringer Lactato.","C) Soro Glicosado a 5% puro.","B) Soro Fisiológico a 0,9% com adição de KCl.","D) Solução Salina a 3%."],"correct":2},{"q":"58. Ao utilizar coloides sintéticos (ex.: amidos hidroxietílicos - HES) para expansão volêmica no choque séptico, qual é o principal risco que justifica a restrição do seu uso nas diretrizes atuais (Surviving Sepsis Campaign)?","a":["B) Transmissão de doenças virais.","C) Hipertermia maligna.","D) Alcalose respiratória severa.","A) Risco aumentado de lesão renal aguda e necessidade de diálise."],"correct":3},{"q":"59. Quantos mEq de Sódio e de Cloro, respectivamente, estão presentes em 1 litro de Soro Fisiológico a 0,9%?","a":["C) 154 e 154.","A) 130 e 109.","B) 140 e 140.","D) 100 e 100."],"correct":0},{"q":"60. Qual é o componente do Ringer Lactato que impede o seu uso como diluente na mesma via de infusão que o Concentrado de Hemácias, devido ao risco de microtrombos/coagulação no equipo?","a":["A) Sódio.","C) Cálcio.","B) Potássio.","D) Lactato."],"correct":1},{"q":"[Nuances dos Distúrbios de Sódio] 61. Para calcular o déficit de água livre em um paciente com hipernatremia pura, utiliza-se o peso do paciente e o Na⁺ sérico. O principal objetivo dessa correção é repor a água com qual solução preferencial?","a":["A) Soro Fisiológico a 0,9%.","B) Ringer Lactato.","C) Enteral (água livre por via oral/SNG) ou Soro Glicosado a 5% IV.","D) Salina Hipertônica."],"correct":2},{"q":"62. Paciente neurocirúrgico apresenta poliúria grave (6 litros/dia) com urina muito diluída (osmolalidade < 200 mOsm/kg) e hipernatremia (Na = 155 mEq/L). Qual é o diagnóstico mais provável?","a":["A) Diabetes Mellitus descompensado.","C) Síndrome Perdedora de Sal Cerebral (SCWS).","D) SIADH.","B) Diabetes Insipidus central."],"correct":3},{"q":"63. Paciente com Diabetes Insipidus central no pós-operatório imediato de ressecção de adenoma hipofisário. Qual é o tratamento farmacológico de escolha?","a":["B) Desmopressina (DDAVP).","A) Furosemida.","C) Hidrocortisona em altas doses.","D) Tolvaptan."],"correct":0},{"q":"64. Na Síndrome Perdedora de Sal Cerebral (SCWS), o mecanismo fisiopatológico primário envolve a secreção exacerbada de:","a":["A) Aldosterona.","B) Peptídeo Natriurético Cerebral (BNP).","C) Hormônio Antidiurético (ADH).","D) Cortisol."],"correct":1},{"q":"65. Qual é o achado que melhor diferencia clinicamente a Síndrome Perdedora de Sal (SCWS) da SIADH, ambas comuns no contexto neurocirúrgico?","a":["A) O sódio urinário (alto na SCWS e baixo na SIADH).","C) O sódio sérico (baixo na SCWS e alto na SIADH).","B) O volume extracelular (hipovolemia na SCWS e euvolemia na SIADH).","D) A glicemia capilar."],"correct":2},{"q":"66. A utilização dos \\\"Vaptans\\\" (ex.: Tolvaptan, Conivaptan) tem indicação aprovada no manejo de qual distúrbio hidroeletrolítico?","a":["A) Hipernatremia hipovolêmica.","C) Hipocalemia refratária.","D) Hipercalcemia da malignidade.","B) Hiponatremia euvolêmica ou hipervolêmica (ex.: SIADH ou IC)."],"correct":3},{"q":"67. Um paciente internado desenvolve hipernatremia devido a febre alta persistente e taquipneia. Esse quadro é classicamente descrito como perda de:","a":["C) Água livre (perda insensível).","A) Líquido isotônico.","B) Líquido rico em sódio.","D) Plasma puro."],"correct":0},{"q":"68. Na reposição de Salina a 3% para hiponatremia sintomática severa, qual é o cálculo rápido para estimar a variação de sódio no paciente para cada litro infundido (Fórmula de Adrogué-Madias)?","a":["B) (Na⁺ infundido + Na⁺ paciente) / (Água Corporal Total).","A) (Na⁺ infundido - Na⁺ paciente) / (Água Corporal Total + 1).","C) (Na⁺ infundido - Na⁺ paciente) / Peso.","D) (Na⁺ paciente - Na⁺ ideal) / (Água Corporal Total + 1)."],"correct":1},{"q":"69. Em um paciente com cirrose hepática descompensada (ascite volumosa e edema) apresentando Na⁺ = 126 mEq/L, o sódio corporal total encontra-se:","a":["A) Reduzido.","B) Normal.","C) Elevado, porém com excesso ainda maior de água livre.","D) Indetectável."],"correct":2},{"q":"70. No tratamento da hiponatremia assintomática associada à Insuficiência Cardíaca descompensada (hipervolêmica), a primeira linha de tratamento baseia-se em:","a":["A) Salina hipertônica a 3%.","B) Reposição vigorosa de Soro Fisiológico.","D) Fludrocortisona.","C) Restrição hídrica e otimização do tratamento da doença de base (diuréticos)."],"correct":3},{"q":"[Nuances dos Distúrbios de Potássio] 71. O uso de Succinilcolina durante a intubação de sequência rápida em pacientes grandes queimados, politraumatizados ou acamados crônicos é contraindicado pelo risco de:","a":["B) Hipercalemia letal por despolarização maciça e efluxo de K⁺.","A) Hipocalemia aguda e arritmia ventricular.","C) Hipercalcemia com parada em sístole.","D) Síndrome de lise tumoral."],"correct":0},{"q":"72. Em um paciente apresentando fraqueza muscular simétrica ascendente, paralisia flácida e íleo paralítico, com K⁺ = 2,1 mEq/L e Mg⁺⁺ = 0,9 mg/dL. Qual é a conduta sequencial correta?","a":["A) Repor primeiro o Potássio venoso em alta velocidade e depois o Magnésio.","B) Repor o Magnésio concomitantemente ou antes do Potássio, pois a hipomagnesemia impede a retenção de potássio.","C) Realizar hemodiálise de urgência.","D) Administrar cálcio venoso antes de qualquer outra medida."],"correct":1},{"q":"73. Dentre os anestésicos e medicações perioperatórias, qual classe é notoriamente conhecida por causar desvio intracelular de potássio e hipocalemia transitória?","a":["A) Inibidores da ECA.","B) Bloqueadores de receptor de angiotensina (BRAs).","C) Agonistas Beta-2 adrenérgicos (ex.: Salbutamol).","D) Bloqueadores neuromusculares adespolarizantes (ex.: Rocurônio)."],"correct":2},{"q":"74. A resina de troca iônica (Poliestirenossulfonato de cálcio/Sorcal) age predominantemente no:","a":["A) Túbulo contorcido distal, bloqueando a aldosterona.","B) Estômago, impedindo a absorção de K⁺.","D) Glomérulo renal, aumentando a filtração.","C) Trato gastrointestinal (cólon), trocando cálcio/sódio por potássio sérico."],"correct":3},{"q":"75. Paciente com Doença Renal Crônica avançada necessita de cirurgia eletiva de hérnia. No risco cirúrgico, nota-se K⁺ = 6,2 mEq/L, sem alterações no ECG. Qual é a melhor abordagem pré-operatória?","a":["B) Medidas clínicas para espoliação de potássio (ex.: Sorcal, furosemida, bicarb) ou diálise profilática antes da cirurgia.","A) Suspender a cirurgia e indicar transplante renal imediato.","C) Realizar a cirurgia normalmente com Gluconato de Cálcio intraoperatório profilático.","D) Administrar apenas insulina sem glicose antes da indução."],"correct":0},{"q":"76. Qual tipo de distúrbio ácido-base está mais frequentemente associado à hipocalemia decorrente do desvio (shift) transcelular em um paciente na UTI?","a":["A) Acidose metabólica com ânion gap normal.","B) Alcalose metabólica.","C) Acidose respiratória.","D) Acidose metabólica com ânion gap alto."],"correct":1},{"q":"77. Na paralisia periódica hipocalêmica tireotóxica, precipitada por estresse ou ingesta pesada de carboidratos, o principal mecanismo causador é:","a":["A) Falência renal com perda maciça de potássio.","C) Destruição muscular com captação de potássio secundária.","B) Hiperatividade da bomba Na⁺-K⁺-ATPase induzida por hormônios tireoidianos e insulina.","D) Intoxicação digitálica secundária."],"correct":2},{"q":"78. Em um trauma por esmagamento (Síndrome de Crush), a liberação maciça do conteúdo intracelular para a circulação causa classicamente:","a":["A) Hipocalemia, Hipocalcemia e Hipernatremia.","C) Hipocalemia, Hipofosfatemia e Hipercalcemia.","D) Hipercalemia, Hipernatremia e Hipercalcemia.","B) Hipercalemia, Hiperuricemia e Hipocalcemia."],"correct":3},{"q":"79. Sobre o eletrocardiograma (ECG) na evolução da hipercalemia grave não tratada, qual é a ordem cronológica clássica das alterações?","a":["B) T apiculada → Redução/desaparecimento de P → Alargamento de QRS → Ritmo sinusoidal/FV.","A) Fibrilação ventricular → T apiculada → Achatamento de P.","C) QRS alargado → T apiculada → Ondas U proeminentes.","D) Encurtamento QT → Ondas P apiculadas → Bloqueio AV."],"correct":0},{"q":"80. A velocidade de infusão de reposição de KCl em veia periférica não deve ultrapassar 10-20 mEq/h. Se o paciente necessita de uma correção mais rápida (ex.: 40 mEq/h) devido a hipocalemia sintomática grave, qual é a exigência técnica obrigatória?","a":["A) Monitorização com EEG contínuo.","C) Acesso venoso central (CVC) e monitorização eletrocardiográfica contínua.","B) Administração concomitante de Bicarbonato.","D) Proteção da solução contra a luz (equipo fotossensível)."],"correct":1},{"q":"[Aprofundamento Ácido-Base] 81. Para avaliar se a resposta compensatória respiratória em uma acidose metabólica é adequada, utilizamos a Fórmula de Winters. Qual é essa fórmula?","a":["B) pCO₂ esperada = (HCO₃⁻) + 15 (± 2).","C) pCO₂ esperada = (0,7 × HCO₃⁻) + 20 (± 5).","A) pCO₂ esperada = (1,5 × HCO₃⁻) + 8 (± 2).","D) pCO₂ esperada = HCO₃⁻ + 24 (± 2)."],"correct":2},{"q":"82. Paciente com diarreia aguda apresenta: pH 7,29; pCO₂ 30 mmHg; HCO₃⁻ 14 mEq/L. Usando a fórmula de Winters, a pCO₂ esperada seria (1,5 × 14) + 8 = 29 (faixa 27-31). O distúrbio deste paciente é:","a":["A) Acidose metabólica mista com acidose respiratória.","C) Alcalose respiratória primária.","D) Acidose metabólica mista com alcalose respiratória.","B) Acidose metabólica simples compensada."],"correct":3},{"q":"83. Se a pCO₂ medida de um paciente com acidose metabólica estiver maior do que a pCO₂ esperada calculada pela Fórmula de Winters, qual é o diagnóstico?","a":["C) Acidose respiratória associada (distúrbio misto).","A) Distúrbio simples compensado.","B) Alcalose respiratória sobreposta.","D) Erro de coleta gasométrica."],"correct":0},{"q":"84. A alcalose metabólica compensa com hipoventilação (retenção de CO₂). Qual é o limite fisiológico máximo de aumento da pCO₂ antes que ocorra hipóxia severa?","a":["A) Cerca de 40 a 45 mmHg.","B) Cerca de 50 a 55 mmHg.","C) Cerca de 70 a 75 mmHg.","D) O pulmão consegue reter pCO₂ indefinidamente."],"correct":1},{"q":"85. A alcalose metabólica pode ser classificada em \\\"cloreto-responsiva\\\" ou \\\"cloreto-resistente\\\" com base na dosagem do cloro urinário. Um cloro urinário baixo (< 10-20 mEq/L) sugere uma causa cloreto-responsiva. Qual é o exemplo clássico?","a":["A) Hiperaldosteronismo primário.","C) Uso de corticoides sistêmicos em altas doses.","B) Vômitos incoercíveis / drenagem gástrica.","D) Síndrome de Cushing."],"correct":2},{"q":"86. Na acidose metabólica com Ânion Gap elevado, a relação Delta Gap / Delta HCO₃⁻ (Relação ∆/∆) é usada para encontrar distúrbios mistos ocultos. Se a relação ∆/∆ for < 1,0, isso sugere a presença simultânea de:","a":["A) Alcalose metabólica.","C) Alcalose respiratória crônica.","D) Acidose respiratória aguda.","B) Acidose metabólica com Ânion Gap normal (hiperclorêmica) associada."],"correct":3},{"q":"87. A cetoacidose diabética clássica e a acidose lática do choque hemorrágico apresentam, laboratorialmente:","a":["A) pH < 7,35, HCO₃⁻ baixo, Ânion Gap elevado (> 12).","B) pH < 7,35, HCO₃⁻ baixo, Ânion Gap normal (8 a 12).","C) pH > 7,45, HCO₃⁻ alto, Ânion Gap elevado.","D) pH < 7,35, pCO₂ alta, HCO₃⁻ normal."],"correct":0},{"q":"88. Durante a reanimação cardiopulmonar prolongada ou parada circulatória, o tecido gera lactato (acidose metabólica) enquanto a falha ventilatória acumula CO₂. Na gasometria, encontraremos caracteristicamente uma:","a":["B) Acidose metabólica compensada.","A) Acidose mista (metabólica + respiratória).","C) Alcalose respiratória severa.","D) Alcalose mista."],"correct":1},{"q":"89. Paciente asmático grave, intubado após crise refratária. Na admissão apresentava pH 7,15 e pCO₂ 75 mmHg. Após ser colocado em ventilação mecânica e hiperventilado agressivamente, nova gaso mostra pH 7,55 e pCO₂ 25 mmHg. Trata-se de uma:","a":["A) Acidose metabólica compensada.","C) Alcalose metabólica.","B) Alcalose respiratória primária iatrogênica.","D) Acidose respiratória crônica aguda."],"correct":2},{"q":"90. No tratamento de uma alcalose metabólica severa refratária associada ao uso crônico de diuréticos, além da suspensão do agente e reposição de Soro Fisiológico (NaCl), qual eletrólito deve ser imperativamente reposto para corrigir o distúrbio ácido-base?","a":["A) Cálcio.","B) Bicarbonato de Sódio.","D) Fósforo.","C) Potássio (pois a correção da hipocalemia bloqueia a excreção de H⁺)."],"correct":3},{"q":"[Casos Clínicos Cirúrgicos e Integrados] 91. Paciente de 55 anos no 3º DPO de laparotomia exploradora por volvo de sigmoide evolui com fístula entérica de alto débito (> 1.500 mL/dia). Gasometria revela pH 7,28, pCO₂ 32 mmHg, HCO₃⁻ 15 mEq/L, Na⁺ 135, Cl⁻ 108. Qual é a etiologia do distúrbio e a conduta volêmica ideal?","a":["B) Acidose hiperclorêmica por perda de HCO₃⁻ na fístula; reposição com Soro Fisiológico ou Ringer Lactato e considerar Bicarbonato caso não resolva.","A) Acidose lática por sepse; Ringer Lactato e antibióticos.","C) Alcalose metabólica paradoxal; Cloreto de potássio.","D) Acidose por retenção de CO₂; iniciar VNI."],"correct":0},{"q":"92. O preparo cirúrgico ótimo para um paciente com estenose hipertrófica do piloro ou úlcera péptica estenosante exige a reversão do distúrbio clássico, que consiste em:","a":["A) Acidose hiperclorêmica e hipercalemia.","B) Alcalose hipoclorêmica, hipocalêmica e depleção de volume.","C) Acidose lática com normocalemia.","D) Alcalose respiratória crônica."],"correct":1},{"q":"93. Um paciente grande queimado (50% SCQ) inicia ressuscitação volêmica (Fórmula de Parkland) recebendo grandes volumes de Ringer Lactato nas primeiras 24h. No 2º dia, a diurese cai e o sódio sérico eleva para 152 mEq/L. A conduta mais apropriada para esse hipernatremia leve/moderada é:","a":["A) Suspender hidratação totalmente por 24h.","C) Dialisar o paciente imediatamente.","B) Trocar a infusão para Soro Glicosado a 5% ou água por via enteral (transição de fase aguda).","D) Infundir Albumina 20%."],"correct":2},{"q":"94. Mulher de 70 anos chega ao PS letárgica, Na⁺ = 105 mEq/L. Familiares relatam início progressivo de confusão ao longo da última semana associada ao uso recente de hidroclorotiazida. Foi iniciada salina hipertônica 3%. Após 12 horas, o sódio aferido é de 125 mEq/L e a paciente desenvolve paralisia flácida, disartria e disfagia (síndrome pseudobulbar). Qual foi o erro de manejo e a complicação instalada?","a":["B) Reposição insatisfatória, deveria ter chegado a 135 mEq/L no primeiro dia.","C) Falta de reposição de potássio levando à parada cardiorrespiratória iminente.","D) Uso de salina em paciente com hipervolemia, causando edema agudo de pulmão.","A) Aumento muito rápido do sódio sérico (> 10-12 mEq/L em 24h) causando Mielinólise Pontina Central."],"correct":3},{"q":"95. Paciente admitida por trauma abdominal fechado (choque Classe IV) recebeu 12 bolsas de Concentrado de Hemácias, 8 de Plasma e 2 de Plaquetas nas primeiras horas (Protocolo de Transfusão Maciça). Apresenta agora hipotensão refratária à noradrenalina e prolongamento do intervalo QT. Qual é a causa mais provável e a intervenção imediata?","a":["B) Intoxicação por citrato causando hipocalcemia grave; Gluconato/Cloreto de Cálcio venoso.","A) Hipercalemia por lise de hemácias estocadas; Insulina Regular.","C) Alcalose respiratória; reduzir volume corrente.","D) Reação transfusional hemolítica aguda; interromper todas as infusões."],"correct":0},{"q":"96. Paciente cirúrgico no 7º DPO de duodenopancreatectomia (Whipple) em uso de nutrição parenteral (NPT). Gasometria aponta acidose metabólica hiperclorêmica, contudo o débito dos drenos é mínimo e não há sinais de sepse. Qual componente da prescrição da NPT provavelmente está gerando essa descompensação?","a":["A) Excesso de glicose causando acidose lática.","B) Uso de aminoácidos cloridratados na formulação sem o balanço de acetato adequado.","C) Emulsão lipídica a 20%.","D) Adição de insulina regular na bolsa."],"correct":1},{"q":"97. Você é chamado na enfermaria cirúrgica: paciente obeso operado de bypass gástrico desenvolve dispneia súbita e dor torácica no 5º DPO. Suspeita forte de TEP (Tromboembolismo Pulmonar). A gasometria arterial típica deste momento agudo revelará:","a":["B) Acidose respiratória por falha da musculatura diafragmática.","C) Alcalose metabólica primária.","A) Alcalose respiratória secundária à taquipneia (hiperventilação e hipoxemia).","D) Acidose metabólica hiperclorêmica."],"correct":2},{"q":"98. Na UTI, um paciente em choque séptico de foco abdominal (peritonite fecal) apresenta lactato = 6,5 mmol/L (VR < 2). pH = 7,10 e HCO₃⁻ = 10 mEq/L. Para justificar a administração de Bicarbonato de Sódio venoso, segundo as diretrizes (Surviving Sepsis), o pH deve estar geralmente abaixo de qual valor, e qual é o efeito adverso associado à infusão rápida dessa substância?","a":["B) pH < 7,30. Efeito adverso: Hipercalemia refratária.","C) pH < 7,40. Efeito adverso: Hipoglicemia imediata.","D) Não há indicação de bicarbonato na sepse sob nenhuma circunstância de pH.","A) pH < 7,15 (ou 7,20 em renais crônicos). Efeito adverso: Acidose paradoxal intracelular por geração de CO₂ e hipernatremia."],"correct":3},{"q":"99. Paciente portador de DRC dialítica não faz sessão há 4 dias. Chega ao PS torporoso, ECG com QRS extremamente alargado se fundindo com ondas T (padrão sinusoidal). Além da proteção cardíaca imediata e deslocamento de potássio, qual intervenção médica definitiva dita o prognóstico deste paciente no pronto-socorro?","a":["B) Acionamento imediato da equipe de Nefrologia para Hemodiálise de urgência.","A) Nebulização contínua por 48 horas.","C) Laparotomia exploradora.","D) Reposição de Sulfato de Magnésio e alta médica."],"correct":0},{"q":"100. Jovem de 25 anos, sem comorbidades prévias, dá entrada com \\\"abdome agudo\\\", dor difusa, vômitos e hálito cetônico. Cirurgião de plantão suspeita que não é cirúrgico e pede uma gasometria com eletrólitos: pH 7,12; pCO₂ 25 mmHg; HCO₃⁻ 8 mEq/L; Na 135; Cl 95; Glicose 480 mg/dL. Qual é o diagnóstico e o ânion gap?","a":["A) Abdome agudo perfurativo; AG = 15.","B) Cetoacidose diabética (quadro mimetiza abdome agudo cirúrgico); AG = 32 (Acidose com AG elevado).","C) Intoxicação alcoólica severa; AG = 10.","D) Sepse de foco urinário; AG = 20."],"correct":1},{"q":"1. Qual é a definição fisiopatológica fundamental e universal do estado de choque, independentemente de sua etiologia?","a":["A) Hipotensão arterial refratária a fluidos.","B) Taquicardia associada a rebaixamento do nível de consciência.","C) Desequilíbrio entre a oferta (DO₂) e o consumo (VO₂) de oxigênio em nível tecidual.","D) Queda do débito cardíaco associada a vasoplegia periférica."],"correct":2},{"q":"2. O metabolismo celular em condições de hipóxia tecidual (choque) desvia-se para a via anaeróbica. Qual é o principal subproduto mensurável desse metabolismo que atua como marcador de gravidade e perfusão?","a":["A) Bicarbonato.","C) Glicose.","D) Ureia.","B) Ácido Lático (Lactato)."],"correct":3},{"q":"3. A Oferta de Oxigênio (DO₂) aos tecidos é determinada pelo Débito Cardíaco (DC) e pelo Conteúdo Arterial de Oxigênio (CaO₂). Qual dos fatores abaixo é o determinante mais crítico do CaO₂?","a":["A) Concentração de Hemoglobina (Hb).","B) Pressão Parcial de Oxigênio dissolvido no plasma (pO₂).","C) Frequência Cardíaca (FC).","D) Pressão Venosa Central (PVC)."],"correct":0},{"q":"4. Qual variável hemodinâmica reflete de maneira mais acurada a balança entre a oferta e o consumo global de oxigênio pelo organismo, sendo frequentemente mensurada através de cateter na artéria pulmonar (Swan-Ganz) ou acesso venoso central?","a":["A) Pressão Arterial Média (PAM).","B) Saturação Venosa Mista de Oxigênio (SvO₂) ou Saturação Venosa Central (ScvO₂).","C) Resistência Vascular Sistêmica (RVS).","D) Pressão de Oclusão da Artéria Pulmonar (POAP)."],"correct":1},{"q":"5. Em um paciente hígido, a Extração de Oxigênio (Taxa de Extração - O₂ER) pelos tecidos gira em torno de 25%. Durante as fases iniciais de um choque hipovolêmico compensado, a O₂ER:","a":["A) Diminui para poupar energia.","B) Permanece inalterada, pois depende apenas da pO₂.","C) Aumenta significativamente para compensar a queda na oferta (DO₂).","D) Torna-se negativa."],"correct":2},{"q":"6. A Pressão Arterial Média (PAM) é o principal motor para a perfusão dos órgãos nobres. Qual é o valor alvo mínimo de PAM recomendado na reanimação da maioria dos estados de choque (exceto no neurotrauma ou hipertensos crônicos)?","a":["A) 55 mmHg.","C) 75 mmHg.","D) 90 mmHg.","B) 65 mmHg."],"correct":3},{"q":"7. A fórmula da Pressão Arterial Média (PAM) é calculada clinicamente por:","a":["B) Pressão Sistólica + (2 × Pressão Diastólica) / 3.","A) (Pressão Sistólica + Pressão Diastólica) / 2.","C) (2 × Pressão Sistólica + Pressão Diastólica) / 3.","D) Pressão Sistólica - Pressão Diastólica."],"correct":0},{"q":"8. Qual é o mecanismo compensatório neuroendócrino imediato e primário desencadeado pela queda da pressão arterial (detectada pelos barorreceptores) no choque hipovolêmico?","a":["A) Liberação de aldosterona e retenção de sódio.","C) Ativação do sistema nervoso simpático com liberação de catecolaminas (adrenalina e noradrenalina).","B) Liberação de ADH (vasopressina) pelo hipotálamo.","D) Aumento imediato da produção de eritropoietina."],"correct":1},{"q":"9. No endotélio vascular normal, qual gás atua como principal mediador vasodilatador local, cujo excesso está intimamente ligado à vasoplegia refratária do choque distributivo (séptico)?","a":["A) Monóxido de carbono (CO).","C) Dióxido de carbono (CO₂).","B) Óxido nítrico (NO).","D) Oxigênio (O₂)."],"correct":2},{"q":"10. Qual alteração eletrolítica aguda severa pode mimetizar o estado de choque ao deprimir diretamente a contratilidade do miocárdio (inotropismo negativo profundo) e causar vasodilatação?","a":["A) Hipernatremia.","C) Hipocalemia.","D) Hipercloremia.","B) Hipocalcemia."],"correct":3},{"q":"[Perfis Hemodinâmicos e Classificação Geral] 11. Qual perfil hemodinâmico caracteriza classicamente o Choque Hipovolêmico?","a":["B) DC baixo, PVC baixa, RVS alta (vasoconstrição compensatória).","A) DC alto, PVC baixa, RVS alta.","C) DC baixo, PVC alta, RVS baixa.","D) DC alto, PVC alta, RVS baixa."],"correct":0},{"q":"12. Paciente na UTI por infarto agudo do miocárdio de parede anterior extenso evolui com hipotensão. A monitorização mostra: DC muito baixo, PVC elevada e RVS muito alta (extremidades frias). Qual é o diagnóstico?","a":["B) Choque Distributivo.","A) Choque Cardiogênico.","C) Choque Obstrutivo por TEP.","D) Choque Hipovolêmico."],"correct":1},{"q":"13. Qual perfil hemodinâmico é marca registrada do Choque Distributivo (Séptico hiperdinâmico) em suas fases iniciais?","a":["A) Débito Cardíaco baixo e Resistência Vascular Sistêmica alta.","C) Débito Cardíaco baixo e Resistência Vascular Sistêmica baixa.","B) Débito Cardíaco alto e Resistência Vascular Sistêmica baixa (vasoplegia).","D) Débito Cardíaco alto e Pressão Venosa Central muito elevada."],"correct":2},{"q":"14. No Choque Neurogenico, decorrente de trauma raquimedular alto (ex.: transecção em C5), ocorre a perda do tônus simpático. Quais são os dois sinais clínicos cardinais que o diferenciam do choque hipovolêmico clássico?","a":["A) Hipotensão associada à Taquicardia severa.","B) Hipertensão e Bradicardia (Reflexo de Cushing).","D) Hipotensão, extremidades frias e sudorese profusa.","C) Hipotensão associada à Bradicardia (ou ausência de taquicardia) e extremidades quentes."],"correct":3},{"q":"15. O tamponamento cardíaco e o pneumotórax hipertensivo causam choque por impedir o enchimento ventricular adequado. Essa classificação fisiopatológica denomina-se Choque:","a":["D) Obstrutivo.","A) Distributivo.","B) Cardiogênico.","C) Hipovolêmico."],"correct":0},{"q":"16. Um paciente jovem é picado por abelha e rapidamente desenvolve hipotensão, taquicardia, broncoespasmo e eritema generalizado. Qual é a droga de escolha e a via de administração IMEDIATA para salvar a vida deste paciente?","a":["A) Hidrocortisona intravenosa.","B) Adrenalina intramuscular no vasto lateral da coxa.","C) Anti-histamínico (Prometazina) intravenoso.","D) Cristaloides em acesso venoso central."],"correct":1},{"q":"17. Qual dos seguintes sinais clínicos compõe a Tríade de Beck, clássica do tamponamento cardíaco (choque obstrutivo)?","a":["B) Hipertensão, bradicardia e alteração do ritmo respiratório.","C) Hipotensão, taquicardia e extremidades quentes.","A) Hipotensão, estase jugular e abafamento das bulhas cardíacas.","D) Estase jugular, desvio de traqueia e murmúrio vesicular abolido."],"correct":2},{"q":"18. Na sepse grave, a disfunção microvascular e celular impede que as células utilizem o oxigênio ofertado adequadamente, gerando um defeito na extração. Como se denomina essa condição fisiopatológica celular?","a":["A) Choque hemorrágico oculto.","B) Shunt arteriovenoso anatômico.","D) Efeito Bohr reverso.","C) Disóxia celular (Choque citopático)."],"correct":3},{"q":"19. Qual parâmetro laboratorial de gasometria venosa reflete a incapacidade dos tecidos em extrair o oxigênio no choque séptico avançado (Choque citopático)?","a":["B) Saturação Venosa Central (ScvO₂) anormalmente ALTA (> 80-85%).","A) Saturação Venosa Central (ScvO₂) anormalmente BAIXA (< 50%).","C) pCO₂ venosa reduzida.","D) Bicarbonato venoso elevado."],"correct":0},{"q":"20. Diferencie clinicamente o Choque Neurogênico do Choque Medular (Espinhal):","a":["A) São sinônimos clínicos, indicando secção da medula.","B) O neurogênico é um choque hemodinâmico (hipotensão/bradicardia); o espinhal refere-se à flacidez neurológica temporária e arreflexia pós-trauma.","C) O espinhal responde a volume, o neurogênico só a sangue.","D) O neurogênico causa taquicardia extrema, o espinhal causa parada cardíaca."],"correct":1},{"q":"[O Choque Hemorrágico e ATLS] 21. De acordo com o ATLS (10ª Edição), qual é o sinal clínico mais precoce que o corpo manifesta em resposta à perda aguda de volume sanguíneo?","a":["A) Queda da pressão arterial sistólica.","C) Rebaixamento do nível de consciência.","B) Taquicardia.","D) Anúria completa."],"correct":2},{"q":"22. Na Classificação de Choque Hemorrágico do ATLS, uma perda sanguínea estimada de 750 a 1.500 mL (15 a 30% do volume sanguíneo) em um adulto de 70 kg caracteriza qual classe?","a":["A) Classe I.","C) Classe III.","D) Classe IV.","B) Classe II."],"correct":3},{"q":"23. A partir de qual Classe de choque hemorrágico (ATLS) observa-se, pela primeira vez, uma QUEDA da pressão arterial sistólica (hipotensão estabelecida)?","a":["C) Classe III.","A) Classe I.","B) Classe II.","D) Classe IV."],"correct":0},{"q":"24. Vítima de arma branca no abdome apresenta pulso de 145 bpm, PA inaudível, confuso e letárgico, diurese ausente. Qual é a estimativa de perda sanguínea percentual aproximada deste paciente (Classe IV)?","a":["A) < 15%.","D) > 40%.","B) 15 a 30%.","C) 31 a 40%."],"correct":1},{"q":"25. No choque hemorrágico Classe II (perda de 15 a 30%), a Pressão de Pulso (diferença entre sistólica e diastólica) apresenta-se tipicamente:","a":["A) Alargada.","C) Inalterada.","B) Pinçada (reduzida).","D) Ausente."],"correct":2},{"q":"26. O ATLS orienta que a reposição inicial de fluidos no trauma contuso ou penetrante com choque associado inicie-se com uma infusão em bôlus de cristaloides isotônicos aquecidos. Na 10ª Edição, qual é o volume máximo estipulado para esse bôlus em adultos, visando não diluir fatores de coagulação nem \\\"estourar\\\" coágulos formados?","a":["A) 2 a 3 litros.","C) 500 mL apenas se PAM < 50.","D) Reposição 3 para 1 até a PA normalizar.","B) 1 litro."],"correct":3},{"q":"27. O conceito de \\\"Hipotensão Permissiva\\\" no trauma visa:","a":["C) Tolerar PAS em torno de 80-90 mmHg até o controle cirúrgico do sangramento, evitando hipertensão que pode remover coágulos recém-formados.","A) Manter a PAM > 90 mmHg à custa de cristaloides em grande volume para proteger os rins.","B) Infundir aminas vasopressoras profilaticamente antes da cirurgia.","D) Evitar qualquer tipo de infusão intravenosa até a chegada ao centro cirúrgico."],"correct":0},{"q":"28. A Hipotensão Permissiva é CONTRAINDICADA em qual dos seguintes cenários de trauma concomitante, onde a manutenção da pressão de perfusão é vital?","a":["A) Trauma pÃ©lvico grave em \"livro aberto\".","C) Traumatismo Cranioencefálico (TCE) grave associado.","B) Trauma penetrante tóraco-abdominal.","D) Fraturas expostas de fêmur bilateral."],"correct":1},{"q":"29. O Ácido Tranexâmico (Transamin) demonstrou reduzir a mortalidade por sangramento no trauma (Estudo CRASH-2). Qual é a sua principal janela terapêutica temporal de eficácia?","a":["A) Deve ser feito em até 24 horas após o trauma.","C) É restrito ao uso intrahospitalar intraoperatório exclusivamente.","B) Deve ser infundido idealmente em até 3 horas do evento traumático.","D) Só pode ser feito após a normalização do INR."],"correct":2},{"q":"30. Qual é o mecanismo de ação farmacológico do Ácido Tranexâmico?","a":["A) Fator tecidual recombinante sintético.","C) Estimulador da agregação plaquetária via tromboxano A2.","D) Pró-fator VIII e Fator de von Willebrand.","B) Antifibrinolítico (inibe a conversão do plasminogênio em plasmina)."],"correct":3},{"q":"31. Em pacientes pediátricos (crianças), a reposição inicial em bôlus de cristaloide recomendada pelo ATLS (10ª Ed) para reversão do choque obedece à regra de:","a":["A) 20 mL/kg.","B) 40 mL/kg.","C) 10 mL/kg.","D) 50 mL/kg."],"correct":0},{"q":"32. A Escala de Coma de Glasgow do paciente chocado reflete a perfusão cerebral. Qual padrão de resposta neurológica é esperado no Choque Classe III?","a":["A) Ansiedade leve a moderada.","C) Confusão mental e letargia.","B) Ansioso, porém perfeitamente orientado.","D) Coma profundo, sem resposta a dor."],"correct":1},{"q":"33. O \\\"Base Deficit\\\" (Déficit de Base) medido na gasometria é um marcador valioso no choque do trauma. Valores piores que qual ponto de corte costumam se correlacionar clinicamente com choque Classe III ou IV (necessidade iminente de sangue)?","a":["A) -2 a -6 mEq/L.","B) > +2 mEq/L.","C) -6 a -10 mEq/L.","D) Nenhuma das anteriores, pois depende da pCO₂."],"correct":2},{"q":"34. Ao realizar a ressuscitação volêmica guiada por metas (Early Goal-Directed), a normalização de qual dos parâmetros clínicos abaixo reflete a recuperação precoce e eficaz da perfusão dos leitos esplâncnicos/renais?","a":["A) Redução da FC de 130 para 110.","C) Glasgow subindo de 14 para 15.","D) Normalização imediata da saturação no oxímetro de pulso.","B) Débito urinário em adulto restaurado para ≥ 0,5 mL/kg/hora."],"correct":3},{"q":"35. Um paciente responde ao primeiro bôlus de 1L de Ringer Lactato (FC cai de 120 para 90 e PAS sobe de 80 para 110). Dez minutos depois da infusão, a FC volta a 125 e a PAS cai para 75 mmHg. Esta resposta classifica o paciente como:","a":["C) Respondedor transitório (necessita de sangue urgente e controle cirúrgico/angioembólico).","A) Respondedor rápido.","B) Não respondedor (Refratário).","D) Choque cardiogênico oculto."],"correct":0},{"q":"[A Tríade Letal, Transfusão e Controle de Danos] 36. A \\\"Tríade Letal\\\" do trauma é um ciclo vicioso de deterioração fisiológica no paciente exsanguinando. Ela é classicamente composta por:","a":["A) Hipóxia, Hipercapnia, e Alcalose.","B) Hipotermia, Coagulopatia, e Acidose Metabólica.","C) Hipocalcemia, Hipotermia, e Alcalose Metabólica.","D) Hipercalemia, Hipotensão, e Disóxia celular."],"correct":1},{"q":"37. Qual é a temperatura central abaixo da qual as enzimas da cascata de coagulação e as plaquetas perdem progressivamente a sua função (marco da hipotermia na tríade letal)?","a":["A) < 37,5 °C.","B) < 36,0 °C.","C) < 35,0 °C.","D) < 32,0 °C."],"correct":2},{"q":"38. O choque hipovolêmico não tratado prolongado gera metabolismo anaeróbico intenso. Isso precipita qual ponta da Tríade Letal?","a":["A) Alcalose respiratória.","C) Coagulopatia dilucional.","D) Hipotermia primária.","B) Acidose Metabólica por acúmulo de ácido lático."],"correct":3},{"q":"39. O Protocolo de Transfusão Maciça (PTM) costuma ser ativado quando o cirurgião prevê necessidade extrema de sangue ou baseando-se em escores clínicos (como o ABC Score). Qual é a clássica proporção \\\"balanceada\\\" de hemoderivados orientada pela maioria das diretrizes atuais?","a":["B) 1 Hemácia : 1 Plasma : 1 Plaqueta (1:1:1).","A) 3 Hemácias : 1 Plasma : 1 Plaqueta.","C) Sangue Total diluído em 1 Litro de SF.","D) 2 Hemácias : 1 Crioprecipitado."],"correct":0},{"q":"40. A cirurgia de \\\"Controle de Danos\\\" (Damage Control Surgery) baseia-se na filosofia de:","a":["A) Realizar reconstruções anatômicas primárias definitivas logo no primeiro atendimento.","C) Priorizar a reversão da fisiologia alterada; realizar apenas controle rápido de hemorragia e contaminação, enviando o paciente aberto (laparostomia) para UTI.","B) Fechar todas as anastomoses intestinais antes de enviar para UTI.","D) Realizar cirurgias robóticas minimamente invasivas em politraumatizados."],"correct":1},{"q":"41. Qual é a sequência tradicional (em 3 etapas principais) da Cirurgia de Controle de Danos?","a":["A) Laparotomia definitiva → UTI para desmame → Alta.","C) Ressuscitação clínica no PS → Cirurgia aberta → Radiologia Intervencionista definitiva.","B) Laparotomia abreviada (tamponamento/ligaduras) → Reanimação fisiológica em UTI (aquecimento/hemoderivados) → Reoperação planejada para tratamento definitivo.","D) Controle angioembólico → Cirurgia curativa → UTI prolongada."],"correct":2},{"q":"42. Durante a transfusão maciça, o uso de grande quantidade de bolsas de sangue estocadas expõe o paciente ao excesso de Citrato (anticoagulante da bolsa). Isso precipita gravemente qual distúrbio eletrolítico?","a":["A) Hipernatremia.","C) Hipocalemia grave.","D) Hipermagnesemia.","B) Hipocalcemia (pois o citrato quela o cálcio iônico)."],"correct":3},{"q":"43. Escores de avaliação rápida, como o ABC Score (Assessment of Blood Consumption), ajudam a disparar o Protocolo de Transfusão Maciça no PS. Qual dos seguintes NÃO é critério do clássico ABC Score?","a":["C) Presença de trauma craniano grave (Glasgow < 8).","A) Pressão Arterial Sistólica < 90 mmHg.","B) Frequência Cardíaca > 120 bpm.","D) Mecanismo de trauma penetrante."],"correct":0},{"q":"44. O uso excessivo de Soro Fisiológico (NaCl 0,9%) durante a ressuscitação piora substancialmente a Tríade Letal porque:","a":["A) Causa vasodilatação periférica severa por excesso de cloro.","B) Provoca acidose hiperclorêmica, agravando a acidose metabólica sistêmica.","C) Impede a ação dos leucócitos na contenção da infecção.","D) Reage quimicamente com o Ácido Tranexâmico inativando-o."],"correct":1},{"q":"45. Em um paciente recebendo transfusão maciça, o tromboelastograma (TEG) ou tromboelastometria rotacional (ROTEM) é frequentemente utilizado para:","a":["A) Confirmar a tipagem sanguínea cruzada em tempo real.","B) Avaliar o nível de consciência do paciente rebaixado.","C) Guiar a reposição específica de hemoderivados, identificando falha qualitativa no coágulo (ex: falta de fibrinogênio ou plaqueta).","D) Medir a pressão de oclusão da artéria pulmonar indiretamente."],"correct":2},{"q":"[Casos Clínicos Iniciais] 46. Vítima de capotamento veicular, 22 anos, pálido, confuso. FC 135 bpm, PAS 85 mmHg, SatO₂ 94%. Pelve instável (livro aberto). Você é o acadêmico na sala de trauma. Qual deve ser o próximo passo em relação ao controle hemodinâmico, logo após garantir via aérea (A) e ventilação (B)?","a":["A) Iniciar infusão lenta de Soro Glicosado e solicitar TC de abdome urgência.","C) Administrar Furosemida venosa para garantir fluxo urinário e repor cristaloide até PAM de 100.","D) Iniciar Noradrenalina imediata antes dos fluidos para subir a pressão para a tomografia.","B) Realizar estabilização (amarração) pélvica mecânica imediata (lençol/cinta), acesso IV grosso e ativar protocolo de transfusão maciça."],"correct":3},{"q":"47. Paciente de 45 anos, baleado no tórax direito (hemitórax hipertimpânico, jugulares túrgidas, MV abolido). Chega com PAS 60 mmHg e FC 145 bpm. Qual é a conduta IMEDIATA para reversão desse estado de choque obstrutivo (Pneumotórax Hipertensivo)?","a":["B) Descompressão torácica por punção de alívio (agulha no 5º espaço intercostal, linha axilar anterior/média) seguida de drenagem fechada.","A) Intubação orotraqueal em sequência rápida.","C) Toracotomia de reanimação no pronto-socorro antes de qualquer punção.","D) Pericardiocentese guiada por ultrassom."],"correct":0},{"q":"48. Em cirurgia aberta de trauma hepático complexo, o cirurgião percebe que todos os tecidos no campo operatório estão \\\"minando\\\" sangue continuamente, sem pulso arterial definido (sangramento em lençol não cirúrgico). O paciente tem Temperatura de 34,2°C e pH gasométrico de 7,12. A atitude cirúrgica correta do preceptor será:","a":["A) Suturar calmamente todo o parênquima hepático por 3 horas até não sobrar sangramento.","B) Realizar o tamponamento hepático primário (packing com compressas), fechar a pele apenas ou bolsa de Bogotá (Damage Control) e enviar o paciente para a UTI.","C) Iniciar circulação extracorpórea e resfriar mais o paciente para proteção cerebral.","D) Lavar a cavidade com água destilada morna para provocar lise das plaquetas e coagulação local."],"correct":1},{"q":"49. Gestante de 32 semanas dá entrada no pronto-socorro após trauma automobilístico. Apresenta FC 110 e PA 100x60 mmHg (normotensa para a idade gestacional, mas o examinador nota que ela caiu de seu basal de 120x80). Útero hipertônico. Por que o choque hemorrágico (hipovolemia) é frequentemente \\\"mascarado\\\" e muito perigoso na gestante avançada?","a":["A) O feto supre a mãe com hemácias fetais ricas em oxigênio.","C) A placenta produz catecolaminas locais que impedem a taquicardia.","B) A gestante possui uma hipervolemia fisiológica crônica de 30 a 50%, permitindo perder grande quantidade de sangue antes de exibir sinais clássicos de hipotensão.","D) O sistema renina-angiotensina da grávida está inativo no 3º trimestre."],"correct":2},{"q":"50. Homem de 60 anos, sem trauma prévio, chega ao PS com dor abdominal súbita lancinante irradiada para as costas e desmaio. Apresenta palidez cutânea, FC 120 e PA 70x40 mmHg. Massa pulsátil palpável em mesogástrio. O FAST (ultrassom focado) não mostra líquido livre na cavidade peritoneal isolada, mas aponta grande hematoma retroperitoneal. Diagnóstico mais provável e conduta:","a":["A) Choque séptico por diverticulite; antibióticos.","B) Choque obstrutivo por IAM inferior com extensão; cateterismo.","D) Choque neurogênico por isquemia espinhal; corticoide alta dose.","C) Choque hemorrágico por ruptura de Aneurisma de Aorta Abdominal (AAA); acionar cirurgia vascular e ressuscitação volêmica restrita/sangue para o centro cirúrgico Imediato."],"correct":3},{"q":"[Manejo Vasopressor e Reposição no Choque] 51. Em um paciente com Choque Séptico cuja hipotensão é refratária à reposição volêmica inicial, qual é a droga vasopressora de primeira escolha recomendada pelas diretrizes mundiais?","a":["C) Noradrenalina.","A) Dopamina.","B) Adrenalina.","D) Vasopressina."],"correct":0},{"q":"52. O mecanismo de ação principal da Noradrenalina que a torna tão eficaz na reversão do choque distributivo baseia-se no seu potente agonismo em quais receptores adrenérgicos?","a":["A) Receptores Beta-2, promovendo vasodilatação esplâncnica.","B) Receptores Alfa-1, promovendo intensa vasoconstrição arterial e venosa.","C) Receptores Dopaminérgicos, protegendo a perfusão renal.","D) Receptores V1 e V2 do hormônio antidiurético."],"correct":1},{"q":"53. Durante a reanimação inicial de um paciente em choque séptico, após a infusão do pacote de fluidos, o início do vasopressor visa atingir qual Pressão Arterial Média (PAM) alvo?","a":["A) PAM > 50 mmHg.","C) PAM > 85 mmHg.","B) PAM = 65 mmHg.","D) PAM > 100 mmHg."],"correct":2},{"q":"54. O uso da Variação da Pressão de Pulso (VPP) ou da manobra de Elevação Passiva das Pernas (Passive Leg Raise) em pacientes na UTI tem como objetivo hemodinâmico determinar:","a":["A) O grau de falência do ventrículo direito.","C) O diagnóstico diferencial de tamponamento cardíaco.","D) A necessidade iminente de intubação orotraqueal.","B) A responsividade a fluidos (se o coração aumentará o débito cardíaco caso receba mais volume)."],"correct":3},{"q":"55. No Choque Cardiogênico isolado, com ecocardiograma evidenciando disfunção contrátil severa do ventrículo esquerdo (fração de ejeção baixa) e congestão pulmonar, qual droga inotrópica é a clássica primeira linha de tratamento?","a":["A) Dobutamina.","B) Fenilefrina.","C) Vasopressina.","D) Amiodarona."],"correct":0},{"q":"56. Um paciente em choque séptico já está recebendo altas doses de Noradrenalina, mas a pressão arterial continua caindo. A diretriz do *Surviving Sepsis Campaign* orienta associar qual segunda droga vasopressora para \\\"poupar\\\" catecolaminas e tentar elevar a PAM?","a":["A) Adrenalina.","B) Vasopressina.","C) Dopamina.","D) Isoproterenol."],"correct":1},{"q":"57. Qual é a meta terapêutica laboratorial clássica avaliada nas primeiras horas de reanimação de qualquer estado de choque grave para inferir melhora da perfusão microvascular?","a":["A) Normalização absoluta do sódio sérico.","C) Aumento da saturação periférica de O₂ para 100%.","B) Clearance (depuração) de Lactato arterial com queda de 10% a 20% a cada 2 a 6 horas.","D) Elevação do pH gasométrico para acima de 7,45."],"correct":2},{"q":"58. O estudo clínico ANDROMEDA-SHOCK demonstrou que a reanimação guiada por um exame clínico simples à beira do leito é tão eficaz quanto a reanimação guiada por dosagens repetidas de lactato. Qual é este exame clínico?","a":["A) Fundo de olho.","B) Reflexo cutaneoplantar.","D) Pressão Venosa Central (PVC).","C) Tempo de Enchimento Capilar (TEC)."],"correct":3},{"q":"59. Pela diretriz Sepsis-3, como se define tecnicamente o estado de \\\"Choque Séptico\\\", diferenciando-o da Sepse simples?","a":["B) Necessidade de vasopressor para manter PAM ≥ 65 mmHg E lactato > 2 mmol/L após ressuscitação volêmica adequada.","A) Infecção documentada associada a rebaixamento do Glasgow.","C) Hemocultura positiva associada a dois critérios de SIRS.","D) Presença de bacteremia acompanhada de febre > 39 °C e taquicardia."],"correct":0},{"q":"60. O Índice de Choque (Shock Index) é uma ferramenta rápida de triagem calculada pela divisão da Frequência Cardíaca pela Pressão Arterial Sistólica (FC/PAS). Em um adulto no trauma, valores acima de qual ponto de corte costumam indicar choque grave e necessidade de transfusão?","a":["A) > 0,5.","C) > 1,0.","B) > 0,7.","D) > 2,0."],"correct":1},{"q":"61. Em pacientes com choque anafilático severo evoluindo com colapso hemodinâmico, a Adrenalina é a medicação salva-vidas devido à sua ação simultânea em:","a":["B) Alfa-2 e Dopaminérgico.","C) Bloqueio de receptores histamínicos H1 e H2 centralmente.","A) Alfa-1 (vasoconstrição) e Beta-2 (broncodilatação e inibição da degranulação de mastócitos).","D) Receptores muscarínicos cardíacos."],"correct":2},{"q":"62. No manejo atual do choque séptico refratário a fluidos e em uso de altas doses de vasopressores, a indicação clássica para o uso de corticosteroides sistêmicos (Hidrocortisona) visa tratar uma possível:","a":["B) Meningite subclínica.","C) Reação anafilática oculta a antibióticos.","D) Fibrose pulmonar aguda.","A) Insuficiência Adrenal Relativa (Critical Illness-Related Corticosteroid Insufficiency)."],"correct":3},{"q":"63. Durante o atendimento de trauma no pré-hospitalar ou emergência, caso o acesso venoso periférico calibroso falhe após 2 tentativas ou 90 segundos em um paciente exsanguinando, a próxima via imediata de escolha para infusão de fluidos e medicações é:","a":["C) Acesso Intraósseo.","A) Cateter Venoso Central (Subclávia).","B) Dissecção venosa de safena.","D) Injeção intracardíaca direta."],"correct":0},{"q":"64. Em adultos grandes queimados com choque hipovolêmico distributivo, a ressuscitação volêmica guiada pela Fórmula de Parkland (ou regra do ATLS atual de 2 mL/kg/%SCQ) utiliza tradicionalmente qual solução cristaloide nas primeiras 24 horas?","a":["A) Soro Glicosado a 5%.","B) Ringer Lactato.","C) Salina Hipertônica a 3%.","D) Coloides sintéticos (Dextran)."],"correct":1},{"q":"65. O pacote de 1 hora da Campanha de Sobrevivência à Sepse orienta que a ressuscitação inicial com fluidos intravenosos seja feita rapidamente e na dose de:","a":["A) 10 mL/kg de cristaloides.","B) 20 mL/kg de cristaloides.","C) 30 mL/kg de cristaloides.","D) 50 mL/kg de cristaloides."],"correct":2},{"q":"[Hemoderivados e Controle de Danos] 66. Durante a cirurgia de Controle de Danos em um paciente vitima de múltiplos tiros, a equipe solicita Crioprecipitado. Qual é a principal indicação e componente fornecido por esse hemoderivado?","a":["A) Repor a contagem de plaquetas circulantes.","C) Expandir o volume plasmático rapidamente pelo alto teor de albumina.","D) Fornecer Fator II da coagulação para reverter a heparina.","B) Tratar hipofibrinogenemia severa (fornece concentrado de Fibrinogênio e Fator VIII)."],"correct":3},{"q":"67. Qual é a principal complicação fatal não infecciosa (e a maior causa de mortalidade relacionada diretamente à bolsa infundida) no contexto das transfusões sanguíneas?","a":["B) TRALI (Lesão Pulmonar Aguda Relacionada à Transfusão).","A) Hepatite B fulminante.","C) Doença do enxerto contra o hospedeiro (GVHD).","D) Transmissão de doença de Chagas."],"correct":0},{"q":"68. A TRALI caracteriza-se fisiopatologicamente pela:","a":["A) Incompatibilidade ABO grave causando hemólise aguda.","C) Ação de anticorpos do plasma do doador ativando leucócitos do receptor, causando dano endotelial e edema pulmonar não cardiogênico.","B) Sobrecarga de volume intravascular levando a edema agudo de pulmão cardiogênico.","D) Reação alérgica mediada por IgE contra as proteínas do plasma transfundido."],"correct":1},{"q":"69. Como diferenciar clinicamente e laboratorialmente a TRALI (Lesão Pulmonar Transfusional) da TACO (Sobrecarga Circulatória Associada à Transfusão)?","a":["A) Na TRALI há hipertensão grave; na TACO há choque profundo.","C) A TRALI causa diarreia intensa, e a TACO causa constipação.","B) Na TRALI o BNP/NT-proBNP costuma estar normal e a PVC não eleva; na TACO há sinais clássicos de insuficiência cardíaca congestiva.","D) A TRALI responde rapidamente a furosemida, enquanto a TACO necessita de corticoide."],"correct":2},{"q":"70. Além da hipocalcemia (pela quelação pelo citrato), qual outra alteração metabólica é comumente encontrada após transfusão maciça de bolsas de sangue estocadas há muito tempo?","a":["B) Hipercalcemia aguda.","C) Hipoglicemia severa.","D) Hipomagnesemia primária.","A) Hipercalemia (pela lise lenta das hemácias na bolsa)."],"correct":3},{"q":"71. Em média, a infusão de 1 unidade (bolsa) de Concentrado de Hemácias em um adulto sem sangramento ativo eleva a Hemoglobina sérica em aproximadamente:","a":["B) 1,0 g/dL.","A) 0,5 g/dL.","C) 2,5 g/dL.","D) 4,0 g/dL."],"correct":0},{"q":"72. Um paciente em uso domiciliar de Varfarina sofre TCE grave com sangramento intracraniano (choque classe I/II por espoliação scalp, mas alta gravidade neurológica). INR de admissão é 4,5. A reversão farmacológica de urgência mais eficaz e de ação mais rápida para este caso é feita com:","a":["A) Vitamina K subcutânea exclusivamente.","C) Concentrado de Complexo Protrombínico (PCC).","B) Plasma Fresco Congelado.","D) Crioprecipitado."],"correct":1},{"q":"73. Qual fator da cascata de coagulação é tipicamente o PRIMEIRO a atingir níveis críticos de depleção no paciente politraumatizado em choque hemorrágico (levando a alteração precoce no tromboelastograma)?","a":["A) Fator II (Protrombina).","B) Fator X.","C) Fator I (Fibrinogênio).","D) Fator VII."],"correct":2},{"q":"74. Na ausência de tempo hábil para tipagem sanguínea e prova cruzada em um paciente exsanguinando no pronto-socorro (trauma Classe IV), qual é o sangue considerado \\\"Doador Universal\\\" a ser transfundido de imediato em mulheres em idade fértil?","a":["A) O Positivo.","C) AB Positivo.","D) A Negativo.","B) O Negativo (O Rh-)."],"correct":3},{"q":"75. O aumento extremo da Pressão Intra-abdominal (PIA) no paciente cirúrgico chocado e politransfundido pode gerar a Síndrome Compartimental Abdominal (SCA). Como ela compromete hemodinamicamente o paciente?","a":["B) Comprime a veia cava inferior, diminuindo drasticamente o retorno venoso e o débito cardíaco.","A) Causa vasodilatação arterial reflexa.","C) Provoca bradicardia vagal irreversível.","D) Aumenta excessivamente a perfusão renal, causando poliúria e desidratação."],"correct":0},{"q":"76. Pela definição, a Síndrome Compartimental Abdominal está estabelecida quando a Pressão Intra-abdominal (medida classicamente pelo cateter vesical) excede:","a":["A) 5 mmHg acompanhada de dor.","C) 20 mmHg associada à nova disfunção de órgão (ex.: oligúria, aumento da pressão de via aérea).","B) 10 mmHg isoladamente.","D) 35 mmHg, independentemente de sintomatologia."],"correct":1},{"q":"77. Frente a uma Síndrome Compartimental Abdominal refratária com falência renal e respiratória instaladas em paciente na UTI, a conduta definitiva é:","a":["A) Paracentese de alívio por punção guiada por ultrassom.","C) Aumento agressivo das aminas vasopressoras para vencer a resistência.","B) Laparotomia descompressiva de urgência (abertura da cavidade).","D) Hemodiálise com ultrafiltração contínua e observação."],"correct":2},{"q":"78. O conceito de Terapia de Fechamento Abdominal Temporário (ex.: Peritoniostomia com Bolsa de Bogotá ou Terapia a Vácuo) no Controle de Danos serve fundamentalmente para:","a":["B) Cicatrizar aponeuroses destruídas por infecção necrotizante primária.","C) Curar fístulas entéricas de alto débito sem intervenção manual.","D) Melhorar a estética da ferida operatória em pacientes sépticos.","A) Impedir a Síndrome Compartimental Abdominal e facilitar a reabordagem após estabilização da fisiologia."],"correct":3},{"q":"79. O REBOA (Resuscitative Endovascular Balloon Occlusion of the Aorta) é uma técnica emergente para pacientes no trauma. Sua indicação principal ocorre no controle temporário de sangramentos maciços originados:","a":["C) Abaixo do diafragma (hemorragia de tronco não compressível, como pelve e abdome).","A) Na abóbada craniana.","B) No parênquima pulmonar alto.","D) Nas fraturas de fêmur isoladas."],"correct":0},{"q":"80. A administração sistemática de Cálcio Venoso (geralmente Cloreto de Cálcio em acesso central ou Gluconato em periférico) durante a transfusão maciça justifica-se pois o Cálcio atua, além da contratilidade cardíaca, como qual Fator da cascata de coagulação?","a":["A) Fator II.","B) Fator IV.","C) Fator VIII.","D) Fator X."],"correct":1},{"q":"[Casos Clínicos Integrados] 81. Um paciente de 75 anos, hipertenso crônico em uso de Metoprolol 100mg/dia, sofre queda de escada e fratura bacia. Chega ao PS letárgico, com PAS 85 mmHg e FC 82 bpm. O residente de cirurgia hesita em acionar o protocolo de transfusão maciça pois \\\"o paciente não está taquicárdico\\\". Qual é o erro na avaliação?","a":["A) Pacientes idosos têm metabolismo acelerado e não fazem choque classe III ou IV.","C) A pressão de 85 mmHg é normal para a idade, portanto não há choque hemorrágico em curso.","B) O betabloqueador (Metoprolol) inibe a resposta taquicárdica simpática compensatória. O choque está mascarado e é grave.","D) A fratura de bacia raramente sangra a ponto de causar choque."],"correct":2},{"q":"82. Atleta maratonista de elite (28 anos) sofre acidente de moto. Ao chegar no PS, FC é 95 bpm e PA 110x70 mmHg. O FAST mostra líquido livre abdominal. A urina está concentrada e em pequeno volume. Levando em consideração a fisiologia do atleta, a FC de 95 bpm indica:","a":["A) Ansiedade leve, estado normovolêmico.","C) Falsa leitura do monitor, requerendo troca de cabos.","D) Choque neurogênico por trauma cervical alto.","B) Possível choque grau II ou III em curso, pois um atleta possui FC basal bradicárdica (ex: 45-50 bpm), logo 95 bpm representa um aumento de quase 100% da frequência."],"correct":3},{"q":"83. Gestante no 3º trimestre de gravidez dá entrada chocada após colisão auto-auto. Além da estabilização padrão (A, B, C), qual manobra mecânica imediata deve ser realizada no leito para otimizar o retorno venoso (débito cardíaco) da mãe e melhorar a resposta ao choque?","a":["C) Deslocamento manual do útero gravídico para a esquerda (ou decúbito lateral esquerdo).","A) Posição de Trendelenburg reverso (cabeça elevada).","B) Elevação manual do útero para a direita.","D) Flexão extrema dos joelhos sobre o abdome."],"correct":0},{"q":"84. Crianças possuem uma enorme reserva fisiológica em casos de trauma e hemorragia. Por conta disso, no paciente pediátrico, a queda da Pressão Arterial Sistólica (hipotensão franca):","a":["A) Ocorre logo na Classe I, sendo o sinal mais precoce.","B) É um sinal tardio de exaustão compensatória, indicando colapso sistêmico e PCR iminente (perda > 30-40% da volemia).","C) Ocorre exclusivamente por trauma cranioencefálico, nunca por perda de sangue.","D) Não possui valor diagnóstico, guiando-se a reposição apenas pelo suor."],"correct":1},{"q":"85. Vítima de capotamento sem cinto chega paraplégico e sem sensibilidade abaixo da linha mamilar. Ao exame: PA 70x40 mmHg, FC 55 bpm, extremidades quentes e rosadas. Fast abdominal negativo. Qual é a melhor associação para o tratamento medicamentoso primário para restaurar a PAM desse paciente após infusão inicial rápida e prudente de cristaloide?","a":["A) Ácido Tranexâmico e Sangue.","C) Adrenalina intramuscular e Anti-histamínicos.","B) Noradrenalina ou Dopamina (Vasopressores) para reverter a perda do tônus simpático medular.","D) Bloqueadores de canal de cálcio para neuroproteção."],"correct":2},{"q":"86. Vítima de assalto apresenta perfuração por faca em hemitórax esquerdo. Chega confuso, com estase jugular bilateral evidente a 45 graus, abafamento grave de bulhas e murmúrio vesicular PRESENTE e SIMÉTRICO em ambos os pulmões. Qual é o diagnóstico e o tipo de choque?","a":["A) Pneumotórax hipertensivo / Choque obstrutivo.","C) Laceração miocárdica pura / Choque cardiogênico.","D) Choque neurogênico central.","B) Tamponamento cardíaco / Choque obstrutivo."],"correct":3},{"q":"87. Jovem de 19 anos, politraumatizado, é intubado no PS. Imediatamente após ser conectado ao ventilador com pressão positiva, saturação cai para 80%, PAM cai de 90 para 40, e observa-se desvio de traqueia para a direita. Qual o diagnóstico clássico e conduta salva-vidas em segundos?","a":["B) Pneumotórax hipertensivo à esquerda induzido por barotrauma/VPP; punção de alívio IMEDIATA e toracostomia com dreno.","A) Extubação acidental; reintubar.","C) Tamponamento; toracotomia esquerda.","D) Choque neurogênico por hiperextensão na intubação;
