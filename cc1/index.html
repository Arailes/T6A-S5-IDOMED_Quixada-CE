a":["A) Desbridamento cirúrgico de fáscia.","B) Suspensão empírica e sequencial dos medicamentos suspeitos e observação clínica.","C) Trocar todos os acessos venosos profundos por periféricos.","D) Realizar laparotomia exploradora imediata."],"correct":1},{"q":"[Nível 2: Complicações da Ferida Operatória e Cicatrização] 11. Qual é a complicação cirúrgica caracterizada pelo acúmulo de líquido claro, amarelado e linfático no tecido celular subcutâneo, sendo extremamente comum após cirurgias com grandes descolamentos de retalhos (ex: mastectomia, abdominoplastia)?","a":["A) Hematoma.","C) Evisceração.","B) Seroma.","D) Abscesso."],"correct":2},{"q":"12. O tratamento de um seroma de pequeno volume, assintomático e sem tensão na pele consiste em:","a":["A) Drenagem aberta no centro cirúrgico.","C) Iniciar antibióticos sistêmicos por 14 dias.","D) Reabrir toda a incisão.","B) Conduta expectante (reabsorção espontânea) ou punção aspirativa se causar desconforto/tensão."],"correct":3},{"q":"13. Um hematoma cervical em expansão nas primeiras horas de pós-operatório de uma tireoidectomia total é considerado uma emergência cirúrgica por qual motivo?","a":["B) Risco agudo de compressão traqueal, asfixia e insuficiência respiratória.","A) Risco de infecção generalizada (sepse).","C) Risco de embolia gordurosa.","D) Risco de Síndrome de Horner."],"correct":0},{"q":"14. Qual dos sinais abaixo é o achado patognomônico e classicamente o primeiro a aparecer em uma deiscência aponeurótica profunda (abertura da fáscia) no pós-operatório de cirurgia abdominal?","a":["A) Febre > 39°C.","B) Drenagem repentina de grande quantidade de lÃ­quido cor de \"Ã¡gua de lavagem de carne\" (secreÃ§Ã£o serossanguinolenta profusa) pela ferida.","C) Retração dos bordos da pele sem secreção.","D) Necrose negra (escara) nas bordas."],"correct":1},{"q":"15. Quando ocorre a deiscência total (abertura de todos os planos, incluindo pele e aponeurose) com exposição e exteriorização de alças intestinais, a complicação é denominada:","a":["A) Eventração.","B) Hérnia incisional.","C) Evisceração.","D) Fístula estercoral."],"correct":2},{"q":"16. Frente a um quadro de evisceração aguda na enfermaria cirúrgica, a conduta imediata do médico no leito é:","a":["A) Tentar empurrar as alças de volta para a cavidade de forma vigorosa.","C) Suturar a pele sobre as alças no próprio leito com anestesia local.","D) Administrar antibióticos e aguardar cicatrização por segunda intenção.","B) Cobrir as alças com compressas estéreis umedecidas em soro fisiológico morno e encaminhar o paciente imediatamente ao centro cirúrgico."],"correct":3},{"q":"17. A falha tardia da cicatrização da aponeurose, em que a pele está fechada, mas ocorre protrusão do conteúdo abdominal através da falha muscular, é chamada de:","a":["A) Hérnia incisional.","B) Seroma crônico.","C) Evisceração tardia.","D) Diástase fisiológica."],"correct":0},{"q":"18. Qual fator técnico dependente exclusivamente do cirurgião é o principal responsável pela ocorrência de deiscência aponeurótica aguda?","a":["A) Desnutrição proteica prévia do paciente.","B) Falha técnica no fechamento (ex: margem insuficiente de fáscia, tensão excessiva, escolha inadequada do fio ou nós frouxos).","C) Tosse no pós-operatório.","D) Uso de corticoides."],"correct":1},{"q":"19. Qual é a complicação da ferida que ocorre predominantemente por uma falha na hemostasia no intraoperatório ou por alterações da coagulação do paciente?","a":["A) Seroma.","C) Fístula quilosa.","B) Hematoma.","D) Queloide."],"correct":2},{"q":"20. A complicação fibrótica benigna que ultrapassa as bordas da incisão original (crescimento exofítico, tipo \\\"garra\\\"), frequentemente associada a fatores genéticos, é o(a):","a":["A) Cicatriz hipertrófica.","C) Granuloma de fio.","D) Neuroma de amputação.","B) Queloide."],"correct":3},{"q":"[Nível 3: Complicações Cardiopulmonares e Vasculares] 21. Qual é a complicação pulmonar pós-operatória mais frequente em cirurgias de abdome superior e tórax, causada pela respiração superficial do paciente devido à dor?","a":["B) Atelectasia.","A) Trombose venosa profunda.","C) Edema agudo de pulmão.","D) Pneumotórax espontâneo."],"correct":0},{"q":"22. A pneumonia aspirativa (Síndrome de Mendelson) ocorre pela aspiração de conteúdo gástrico e é uma emergência temida. Qual a medida anestésica que minimiza esse risco na indução de pacientes com estômago cheio?","a":["A) Ventilação sob máscara com pressão positiva máxima.","B) Intubação de Sequência Rápida com manobra de Sellick (compressão da cartilagem cricoide).","C) Uso de máscara laríngea padrão.","D) Indução exclusivamente com agentes inalatórios em baixa dose."],"correct":1},{"q":"23. Paciente obeso, no 5º DPO de artrodese de coluna, desenvolve dispneia súbita, taquicardia, dor torácica pleurítica e hipoxemia refratária. Qual é o diagnóstico mais provável?","a":["A) Infarto Agudo do Miocárdio.","C) Atelectasia de ápice.","B) Tromboembolismo Pulmonar (TEP).","D) Pneumonia lobar."],"correct":2},{"q":"24. Na suspeita de Tromboembolismo Pulmonar agudo em pós-operatório de grande porte recente, o tratamento inicial mandatório antes mesmo do diagnóstico por imagem definitivo (se alta probabilidade clínica e sem contraindicação absoluta de sangramento) é:","a":["A) Antibioticoterapia.","C) Trombólise endovenosa sistêmica imediata com Alteplase.","D) Observação com cateter nasal de O2.","B) Anticoagulação plena (ex: Heparina Não Fracionada ou Enoxaparina em dose terapêutica)."],"correct":3},{"q":"25. Qual arritmia cardíaca é a mais comumente desencadeada no período pós-operatório, principalmente após cirurgias torácicas, em pacientes idosos submetidos a estresse volêmico?","a":["A) Fibrilação Atrial.","B) Fibrilação Ventricular.","C) Bloqueio Atrioventricular Total.","D) Taquicardia Ventricular Polimórfica (Torsades de Pointes)."],"correct":0},{"q":"26. O risco de Infarto Agudo do Miocárdio pós-operatório atinge seu pico classicamente em qual período após a cirurgia?","a":["A) Durante a incisão.","C) Entre o 2º e o 3º dia de pós-operatório (DPO), frequentemente de forma silenciosa.","B) Nas primeiras horas na sala de recuperação (SRPA).","D) Após 30 dias da alta hospitalar."],"correct":1},{"q":"27. Paciente apresenta retenção urinária aguda no pós-operatório imediato de cirurgia de correção de hérnia inguinal sob raquianestesia. A conduta não invasiva inicial (antes da sondagem) deve ser:","a":["A) Realizar massagem prostática.","C) Prescrever Furosemida venosa em alta dose.","B) Promover deambulação, privacidade, uso de compressa morna no baixo ventre e analgesia.","D) Solicitar cistostomia percutânea de urgência."],"correct":2},{"q":"28. Se as medidas não invasivas falharem, o paciente apresenta bexigoma doloroso ao exame físico. A conduta imediata para alívio e prevenção de lesão renal aguda pós-renal é:","a":["A) Hemodiálise.","C) Aumentar a infusão de Soro Fisiológico.","D) Iniciar antibióticos para profilaxia de ITU.","B) Sondagem de alívio (cateterismo vesical intermitente)."],"correct":3},{"q":"29. A Insuficiência Renal Aguda pré-renal no pós-operatório é frequentemente secundária a:","a":["C) Hipovolemia e hipotensão intraoperatória mal compensadas.","A) Uso de aminoglicosídeos e contraste iodado.","B) Obstrução bilateral dos ureteres por ligadura inadvertida.","D) Hipertrofia prostática benigna aguda."],"correct":0},{"q":"30. A complicação neurológica pós-operatória aguda, caracterizada por flutuação do nível de consciência, agitação psicomotora, desorientação temporal e alucinações (muito comum em idosos internados) denomina-se:","a":["A) Demência vascular.","C) Delirium pós-operatório.","B) Acidente Vascular Cerebral Isquêmico.","D) Epilepsia temporal primária."],"correct":1},{"q":"[Nível 4: Complicações Gastrointestinais e Anastomóticas] 31. O retardo prolongado (além do fisiológico) do retorno do trânsito gastrointestinal no pós-operatório, com náuseas, vômitos e distensão abdominal generalizada e simétrica, mas sem cólicas intensas, é definido como:","a":["A) Obstrução mecânica mecânica por brida.","C) Volvo de sigmoide.","B) Íleo paralítico (adinâmico) prolongado.","D) Hérnia interna estrangulada."],"correct":2},{"q":"32. Para diferenciar clinicamente um íleo paralítico de uma obstrução intestinal mecânica precoce (brida), qual achado semiológico é chave?","a":["A) No íleo paralítico há ruídos hidroaéreos de luta e cólica intensa; na obstrução os ruídos estão abolidos desde o início.","C) Apenas a tomografia diferencia, a clínica é idêntica.","D) O vômito fecaloide ocorre exclusivamente no íleo paralítico.","B) No íleo paralítico, o abdome é silencioso (ruídos abolidos) e a distensão é global, enquanto na obstrução há cólica forte, peristaltismo visível e ruídos metálicos."],"correct":3},{"q":"33. Qual distúrbio eletrolítico é clássico e famoso por causar ou agravar fortemente o íleo paralítico pós-operatório?","a":["C) Hipocalemia (Potássio baixo).","A) Hipernatremia.","B) Hipocalcemia.","D) Hiperfosfatemia."],"correct":0},{"q":"34. Uma deiscência de anastomose intestinal ocorre quando há falha na cicatrização da união das alças. Essa complicação atinge seu pico de incidência entre quais dias de pós-operatório?","a":["A) No 1º ao 2º dia.","B) No 5º ao 7º dia.","C) Entre o 15º e o 20º dia.","D) Somente após 30 dias."],"correct":1},{"q":"35. Quando a deiscência da anastomose intestinal se comunica com a pele (geralmente guiada por um trajeto ou dreno local), estabelece-se o diagnóstico de:","a":["B) Abscesso intra-abdominal fechado.","C) Úlcera de estresse.","A) Fístula enterocutânea.","D) Síndrome de Fournier."],"correct":2},{"q":"36. No manejo clínico e conservador de uma fístula enterocutânea (tentativa de fechamento espontâneo), as medidas primárias, conhecidas pelo mnemônico SNAP (Sepsis, Nutrition, Anatomy, Procedure), consistem inicialmente em:","a":["A) Reoperar no 1º dia para suturar o orifício independente da inflamação local.","C) Forçar dieta oral sólida para formar fezes pastosas e tampar o orifício.","D) Colocar um dreno de Penrose dentro do orifício da fístula.","B) Controle do débito e proteção da pele, controle do foco infeccioso (sepse) e instituição precoce de Nutrição Parenteral Total ou enteral distal."],"correct":3},{"q":"37. Fístulas de alto débito são aquelas cuja drenagem em 24 horas supera qual volume?","a":["C) 500 mL.","A) 100 mL.","B) 200 mL.","D) 1.000 mL."],"correct":0},{"q":"38. Paciente no 6º DPO de colectomia esquerda evolui com taquicardia, febre, dor pélvica aguda e sinais de irritação peritoneal difusa. Não há saída de secreção pelo dreno. Qual é o diagnóstico mais provável a ser investigado por TC com contraste?","a":["A) Fístula colônica controlada.","B) Deiscência de anastomose com peritonite generalizada e abscesso cavitário.","C) Colite pseudomembranosa.","D) Trombose venosa mesentérica primária."],"correct":1},{"q":"39. A complicação hepática caracterizada por icterícia no pós-operatório secundária a absorção massiva de bilirrubina em áreas extensas de sangramento interno e politransfusão é chamada de:","a":["A) Colestase extra-hepática cirúrgica.","C) Síndrome de Mirizzi.","B) Icterícia pré-hepática (ou sobrecarga de bilirrubina por reabsorção de hematoma/hemólise).","D) Cirrose biliar primária."],"correct":2},{"q":"40. Paciente internado por grande queimadura e trauma encefálico apresenta hemorragia digestiva alta (hematêmese maciça). A endoscopia revela lesões gástricas difusas sem história de gastrite prévia. Trata-se classicamente de:","a":["B) Varizes esofágicas rotas.","C) Síndrome de Mallory-Weiss.","D) Câncer gástrico avançado.","A) Úlceras de estresse (Úlcera de Curling no queimado / Úlcera de Cushing no TCE)."],"correct":3},{"q":"[Nível 5: Princípios de Drenos, Cateteres e Casos Práticos] 41. Qual a principal finalidade de um dreno de Penrose deixado no leito cirúrgico e qual o seu mecanismo físico de ação?","a":["B) Drenar coleções ou prevenir seu acúmulo no tecido subcutâneo/cavidade; age por capilaridade.","A) Fornecer nutrição; age por gravidade.","C) Aspirar ativamente coágulos sólidos; age por pressão negativa alta.","D) Drenar o colédoco; age por sifonagem."],"correct":0},{"q":"42. Um cirurgião finaliza uma mastectomia radical e deseja manter a área descolada colada à parede torácica para evitar seroma contínuo, necessitando de drenagem contínua com pressão negativa. O dreno de escolha (sistema fechado ativo) é:","a":["A) Penrose.","C) Dreno de sucção a vácuo (ex: Jackson-Pratt, Blake, Hemovac).","B) Port-a-cath.","D) Dreno de Kehr."],"correct":1},{"q":"43. O Dreno de Kehr (em forma de \\\"T\\\") é utilizado quase que exclusivamente para drenagem de qual estrutura anatômica?","a":["B) Vias urinárias (Ureter).","C) Tecido subcutâneo.","A) Via biliar principal (Colédoco).","D) Cavidade pleural."],"correct":2},{"q":"44. Em relação aos cuidados diários e conduta para remoção de um dreno tubular de sucção fechada (ex: Portovac), a indicação de retirada segura geralmente ocorre quando:","a":["B) O dreno parar de funcionar abruptamente nas primeiras 2 horas da cirurgia.","C) Apenas quando a cirurgia completar exatamente 14 dias.","D) O débito for zero, mas o paciente estiver com febre.","A) O débito diário for inferior a 30-50 mL de líquido seroso em 24h e a cor sugerir ausência de sangue ou pus vivo."],"correct":3},{"q":"45. A complicação associada à manutenção prolongada de um dreno de Penrose exposto na cavidade abdominal por várias semanas é:","a":["B) Atuação como via de entrada (porta aberta) para bactérias, causando infecção retrógrada no leito cirúrgico.","A) Migração do dreno para o coração.","C) Reação anafilática ao látex generalizada e choque.","D) Absorção sistêmica do látex."],"correct":0},{"q":"46. Dreno torácico (tubo torácico) em selo d'água apresenta borbulhamento contínuo no frasco durante a respiração espontânea ou ventilação mecânica. Esse sinal semiológico clínico (fístula aérea ativa) indica:","a":["A) Que o dreno está obstruído.","B) Presença de vazamento de ar do pulmão ou brônquio para o espaço pleural.","C) Que o pulmão está perfeitamente re-expandido e grudado na parede.","D) Drenagem exclusiva de quilotórax."],"correct":1},{"q":"47. Paciente submetido a cirurgia oncológica requer um acesso venoso central de longa permanência totalmente implantável para quimioterapia em ambulatório, sem ficar com extremidades para fora da pele. O dispositivo indicado é:","a":["A) Cateter de Hickman.","B) Cateter Venoso Central (CVC) de duplo lúmen inserido em jugular interna.","C) Port-a-cath (Câmera injetora subcutânea).","D) Dreno pigtail."],"correct":2},{"q":"48. Sonda de Sengstaken-Blakemore. Qual é a sua utilidade primária na emergência cirúrgica?","a":["A) Descompressão de vólvulo gástrico.","B) Nutrição jejunal de longo prazo.","D) Lavagem vesical contínua.","C) Tamponamento hemostático mecânico temporário de varizes esofágicas sangrantes refratárias."],"correct":3},{"q":"49. Um dreno de sucção a vácuo deixado em leito de tireoidectomia para de drenar sangue e o pescoço começa a inchar rapidamente com abaulamento e dificuldade respiratória. A conduta é:","a":["B) Assumir que o dreno obstruiu por coágulos, ignorando o volume, realizar abertura emergencial das suturas na enfermaria/PS para liberar o hematoma e garantir via aérea, e reoperar em seguida.","A) Lavar o dreno com soro sob pressão.","C) Acionar a cirurgia e aguardar avaliação em 2 horas.","D) Aumentar o vácuo do reservatório externo e aplicar compressa gelada."],"correct":0},{"q":"50. Ao prescrever a retirada de um dreno de Penrose da cavidade abdominal que não apresentou intercorrências, a prática habitual orienta:","a":["A) Arrancar o dreno inteiramente de uma vez só no primeiro dia.","C) Tracionar (puxar) gradativamente de 1 a 2 cm por dia, cortando o excesso e refixando o alfinete, para permitir que o trajeto cicatrizacional (fístula dirigida) feche de dentro para fora sem formar coleções ocultas.","B) Lavar o curativo diariamente com iodo e manter por 30 dias.","D) Deixar o dreno cair sozinho."],"correct":1},{"q":"1. Homem, 45 anos, internado por estenose pilórica, apresenta vômitos incoercíveis há 5 dias. Exame físico: desidratado, PA 90x60 mmHg, FC 115 bpm. Gasometria: pH 7.52, pCO2 45, HCO3 35. Na 132, K 2.8, Cl 88. Qual a alteração ácido-base e a conduta endovenosa prioritária?","a":["A) Acidose metabólica / Ringer Lactato e Bicarbonato.","C) Alcalose respiratória crônica / Soro Glicosado 5% e Furosemida.","B) Alcalose metabólica hipoclorêmica / Soro Fisiológico 0,9% e KCl.","D) Alcalose metabólica hiperclorêmica / Salina 3%."],"correct":2},{"q":"2. Mulher, 68 anos, 3º DPO de colectomia, evolui com crise convulsiva tônico-clônica generalizada e coma. Exames: Na 111 mEq/L, K 4.2. Correção com Salina 3% é iniciada. Para evitar a Mielinólise Pontina Central, a elevação máxima segura do sódio nas primeiras 24h deve ser de:","a":["A) 4 a 6 mEq/L.","C) 12 a 15 mEq/L.","D) 15 a 20 mEq/L.","B) 8 a 10 mEq/L."],"correct":3},{"q":"3. Jovem de 22 anos dá entrada vítima de esmagamento de membros inferiores. Anúrico. ECG mostra QRS alargado e ausência de onda P. K = 8.1 mEq/L. Qual a primeira droga a ser administrada para prevenção de arritmia fatal imediata?","a":["C) Gluconato de Cálcio 10%.","A) Solução polarizante (Glicoinsulina).","B) Furosemida venosa.","D) Bicarbonato de Sódio 8,4%."],"correct":0},{"q":"4. Mulher, 30 anos, vítima de ferimento por arma de fogo no abdome. Chega letárgica, PA inaudível, FC 145 bpm, pulso filiforme. Apresenta sangramento ativo. Classificação do choque hemorrágico (ATLS) e conduta hemodinâmica inicial:","a":["A) Classe III / 2 Litros de SF 0,9% e aguardar TC.","B) Classe IV / Transfusão Maciça (1:1:1) e cirurgia imediata (Controle de Danos).","C) Classe IV / Ringer Lactato até PAM > 90 mmHg e Noradrenalina.","D) Classe II / 1 Litro de SF 0,9% e Ácido Tranexâmico apenas."],"correct":1},{"q":"5. Sobre o uso do Ácido Tranexâmico no trauma grave (estudo CRASH-2), a sua janela máxima de eficácia e seu mecanismo de ação são:","a":["A) 6 horas / Pró-coagulante ativador do Fator VII.","C) 12 horas / Quelante de citrato.","B) 3 horas / Antifibrinolítico (inibe plasminogênio).","D) 24 horas / Agonista de tromboxano A2."],"correct":2},{"q":"6. Homem, 55 anos, em choque séptico de foco abdominal (peritonite fecal). Após 30 mL/kg de Ringer Lactato, PA 70x40 mmHg. O uso de Noradrenalina é iniciado com alvo de PAM ≥ 65 mmHg. Qual o receptor adrenérgico predominante responsável por sua eficácia neste cenário?","a":["B) Beta-1.","C) Beta-2.","D) Dopaminérgico.","A) Alfa-1."],"correct":3},{"q":"7. No pronto-socorro, o aplicativo de triagem e decisão clínica Fluxsus alerta a equipe para um paciente de 60 anos com FC 130, PA 80x50, febre e lactato de 5.0 mmol/L. Após a ressuscitação inicial e controle do foco, o marcador laboratorial clássico para avaliar a melhora da perfusão microvascular é:","a":["B) Clearance (queda) do Lactato arterial.","A) Aumento do Bicarbonato para > 26.","C) Normalização da PCR (Proteína C Reativa).","D) Queda do Sódio sérico."],"correct":0},{"q":"8. Vítima de trauma tóraco-abdominal contuso submetido à laparotomia abreviada (Damage Control) é levado à UTI com abdome aberto (bolsa de Bogotá). Temperatura 33°C, pH 7.10, INR 3.5. Esta tríade letal é composta por:","a":["B) Hipóxia, Hipercapnia e Alcalose.","A) Hipotermia, Acidose Metabólica e Coagulopatia.","C) Hipocalcemia, Hipotermia e Síndrome Compartimental.","D) Acidose Respiratória, Hipotensão e Fibrinólise."],"correct":1},{"q":"9. Homem, 30 anos, esfaqueado no hemitórax esquerdo. Murmúrio vesicular presente e simétrico. PA 70x40, FC 130, turgência jugular a 45º e bulhas abafadas. Diagnóstico e conduta:","a":["A) Pneumotórax Hipertensivo / Toracocentese de alívio.","C) Hemotórax Maciço / Drenagem torácica em selo d'água.","B) Tamponamento Cardíaco / Pericardiocentese (ou toracotomia de urgência).","D) Choque Neurogênico / Noradrenalina."],"correct":2},{"q":"10. Paciente no 2º DPO de ressecção intestinal apresenta K = 2.5 mEq/L refratário a altas doses de reposição venosa de KCl. O íon que deve estar depletado e impede a correção do potássio renal é o:","a":["A) Sódio.","B) Cálcio.","D) Fósforo.","C) Magnésio."],"correct":3},{"q":"11. Mulher, 70 anos, desnutrida grave (IMC 14). Inicia Nutrição Parenteral Total com 2.500 kcal no 1º dia. Evolui com falência respiratória e arritmia. A Síndrome de Realimentação tem como marca laboratorial clássica a:","a":["B) Hipofosfatemia severa.","A) Hipocalcemia.","C) Hipernatremia.","D) Hiperglicemia isolada."],"correct":0},{"q":"12. Qual ferramenta é validada e recomendada internacionalmente (ESPEN/BRASPEN) como padrão-ouro para triagem de risco nutricional nas primeiras 48h de internação cirúrgica?","a":["A) Escala de Braden.","B) NRS-2002.","C) MUST exclusivo para UTI.","D) Avaliação Global Subjetiva."],"correct":1},{"q":"13. O protocolo ERAS/ACERTO revolucionou o preparo pré-operatório. Para reduzir a resistência insulínica e o catabolismo, recomenda-se a oferta de líquidos claros com carboidratos (ex: maltodextrina) até quanto tempo antes da anestesia?","a":["A) 8 horas.","B) 6 horas.","C) 2 horas.","D) 30 minutos."],"correct":2},{"q":"14. Durante a fase \\\"Ebb\\\" (Refluxo) da resposta metabólica ao trauma (primeiras horas do choque), o padrão fisiológico é:","a":["A) Hipermetabolismo e hipertermia.","C) Diurese maciça.","D) Anabolismo proteico.","B) Hipometabolismo, hipoperfusão e queda da temperatura."],"correct":3},{"q":"15. Paciente obeso, diabético, operado de apendicite supurada (ferida suja). Fez tricotomia com gilete em casa e a cefazolina foi feita 3 horas antes do corte. Evolui com Infecção de Sítio Cirúrgico (ISC) no 6º DPO. O timing correto da profilaxia antibiótica deveria ter sido:","a":["B) 30 a 60 minutos antes da incisão.","A) 24 horas antes, via oral.","C) Apenas no pós-operatório imediato.","D) Imediatamente após a retirada do apêndice."],"correct":0},{"q":"16. Cirurgia de herniorrafia inguinal eletiva com tela em paciente hígido (ASA I). Classificação da ferida e necessidade de profilaxia:","a":["A) Limpa / Sem profilaxia sistêmica.","C) Limpa / Cefazolina indicada devido ao implante de prótese (tela).","B) Potencialmente Contaminada / Cefazolina dose única.","D) Contaminada / Cefazolina + Metronidazol."],"correct":1},{"q":"17. Vítima de trauma fechado necessita de transfusão maciça (recebeu 10 CH e 10 Plasma). Evolui com hipotensão refratária e espasmo carpopodal (Sinal de Trousseau). A toxicidade do citrato da bolsa de sangue causou:","a":["A) Hipercalemia.","C) Alcalose metabólica severa.","B) Hipocalcemia.","D) Hipomagnesemia."],"correct":2},{"q":"18. Homem, 65 anos, histórico de infarto há 5 anos (revascularizado), assintomático, joga tênis (Capacidade > 10 METs). Fará cirurgia de catarata (risco < 1%). Avaliação cardiológica necessária:","a":["B) Ecocardiograma e Teste Ergométrico obrigatórios.","C) Cintilografia miocárdica de estresse.","D) Adiar a cirurgia por 6 meses.","A) Nenhuma adicional, cirurgia de baixo risco e excelente capacidade funcional."],"correct":3},{"q":"19. Mulher, 45 anos, HAS controlada e obesidade leve (IMC 31), sem outras comorbidades. Vai realizar colecistectomia eletiva. Classificação ASA:","a":["B) ASA II.","A) ASA I.","C) ASA III.","D) ASA IV."],"correct":0},{"q":"20. Paciente em uso crônico de Metoprolol (betabloqueador) para HAS e angina. Vai operar o cólon amanhã. Conduta em relação à medicação:","a":["A) Suspender 48 horas antes.","B) Manter, inclusive na manhã da cirurgia.","C) Trocar por Losartana.","D) Dobrar a dose para segurar o estresse."],"correct":1},{"q":"21. Homem, 75 anos, no 2º DPO de colectomia aberta, apresenta febre de 38,5°C, estertores crepitantes em base direita e tosse fraca. O provável diagnóstico (\\\"W\\\" de Wind) e a profilaxia primária não farmacológica são:","a":["B) ITU / Remoção de sonda.","C) TVP / Enoxaparina.","A) Atelectasia / Fisioterapia respiratória e deambulação precoce.","D) Infecção de ferida / Abertura de pontos."],"correct":2},{"q":"22. Paciente no 6º DPO de laparotomia relata saída súbita e volumosa de líquido cor de \\\"água de lavagem de carne\\\" (serossanguinolento) pela incisão fechada. O abdome não está tenso. Este sinal é patognomônico de:","a":["A) Seroma subcutâneo benigno.","B) Fístula quilosa.","D) Infecção de sítio cirúrgico superficial simples.","C) Deiscência aponeurótica profunda (iminência de evisceração)."],"correct":3},{"q":"23. Mulher, 55 anos, diabética. No 15º DPO de histerectomia, drena pus pelo fundo de saco vaginal, com febre e leucocitose. O abscesso pélvico é classicamente uma Infecção de Sítio Cirúrgico do tipo:","a":["C) Órgão/Espaço.","A) Incisional Superficial.","B) Incisional Profunda.","D) Sistêmica não relacionada."],"correct":0},{"q":"24. Qual a indicação clássica para o uso de Nutrição Parenteral Total (NPT)?","a":["A) Todos os pacientes com desnutrição severa no pré-operatório.","B) Trato gastrointestinal não funcionante, obstruído, isquêmico ou com acesso impossibilitado (ex: íleo prolongado).","C) Complementação calórica para pacientes que comem pouco via oral.","D) Pacientes entubados em ventilação mecânica."],"correct":1},{"q":"25. Dieta enteral polimérica administrada em UTI por sonda nasoenteral fina entope frequentemente. A medida preventiva de enfermagem (flush) correta é:","a":["B) Injetar ar sob alta pressão com seringa de 60mL.","C) Usar Coca-Cola diariamente.","A) Lavar com 20-30 mL de água antes e após as dietas e medicamentos.","D) Trocar o fio guia a cada 24h."],"correct":2},{"q":"26. Um paciente de 35 anos, programador de trading, passou as últimas 48h sentado ininterruptamente monitorando a configuração GAP RUN da bolsa. Opera o apêndice no dia seguinte e, no 5º DPO, apresenta dispneia súbita, hipoxemia e dor torácica. O diagnóstico provável enquadra-se em qual W da febre cirúrgica?","a":["A) Wind (Pneumonia).","C) Water (ITU).","D) Wound (Fasciíte necrotizante).","B) Walking (Tromboembolismo Pulmonar secundário à TVP)."],"correct":3},{"q":"27. Choque Neurogênico no trauma raquimedular cervical alto caracteriza-se classicamente por qual perfil hemodinâmico, diferente do choque hipovolêmico?","a":["B) Hipotensão, bradicardia relativa e extremidades quentes (vasoplegia por perda do tônus simpático).","A) Hipotensão, taquicardia severa e extremidades frias.","C) Hipertensão, bradicardia e bradipneia (Tríade de Cushing).","D) PA normal com pulso fino."],"correct":0},{"q":"28. Paciente no 4º DPO de anastomose intestinal. Ausência de ruídos hidroaéreos, abdome distendido de forma simétrica, indolor à palpação profunda, sem sinais de irritação peritoneal. Vômitos raros. Diagnóstico:","a":["A) Obstrução mecânica por brida.","B) Íleo paralítico (adinâmico) prolongado.","C) Fístula enterocutânea.","D) Isquemia mesentérica."],"correct":1},{"q":"29. Mulher de 55 anos dá entrada na UPA após viagem de ônibus pela Expresso Guanabara no trecho Fortaleza-Quixadá. Apresenta abdome agudo perfurativo por úlcera péptica. Na cirurgia (após 12h do início da dor), encontra-se líquido purulento difuso. A ferida operatória será classificada como:","a":["A) Limpa.","B) Potencialmente Contaminada.","D) Suja / Infectada.","C) Contaminada."],"correct":2},{"q":"30. A complicação pulmonar TRALI (Lesão Pulmonar Aguda Relacionada à Transfusão) tem como base fisiopatológica:","a":["A) Sobrecarga de volume sistêmico gerando congestão (TACO).","C) Reação anafilática IgE mediada severa.","D) Hemólise intravascular aguda por incompatibilidade ABO.","B) Ação de anticorpos do plasma do doador contra os leucócitos do receptor, gerando dano endotelial capilar pulmonar não-cardiogênico."],"correct":3},{"q":"31. Dreno de Penrose posicionado na cavidade pélvica de uma apendicectomia complicada tem seu princípio físico de funcionamento baseado na:","a":["C) Capilaridade e gravidade.","A) Pressão negativa contínua.","B) Sifonagem.","D) Pressão arterial local."],"correct":0},{"q":"32. Para a profilaxia de Tromboembolismo Venoso (TEV), o escore mais utilizado na cirurgia geral que avalia fatores de risco (idade, cirurgia, imobilidade) para indicação de heparina profilática é o:","a":["B) Índice de Lee (RCRI).","A) Escore de Caprini.","C) Escore ARISCAT.","D) Critérios de Centor."],"correct":1},{"q":"33. Paciente faz uso de Varfarina crônica (Fibrilação Atrial). Vai operar a vesícula. Orientação de suspensão pré-operatória:","a":["A) 24 horas antes.","C) 10 dias antes, ponte com AAS.","B) 5 dias antes, avaliando necessidade de ponte com Heparina e checando INR < 1,5.","D) Não se suspende Varfarina para colecistectomia."],"correct":2},{"q":"34. Em uma acidose metabólica primária severa com ânion gap elevado por choque séptico (Lactato = 8), a compensação fisiológica esperada do sistema respiratório (Fórmula de Winters) consiste em:","a":["A) Hipoventilação alveolar para reter CO2.","C) Aumento do HCO3 renal.","D) Vasoconstrição da artéria pulmonar.","B) Hiperventilação alveolar compensatória para baixar a pCO2."],"correct":3},{"q":"35. No atendimento ao politraumatizado com instabilidade de pelve (fratura em livro aberto) e choque hemorrágico Classe IV, a conduta mecânica inicial imediata antes de fluidos/sangue é:","a":["C) Fechamento mecânico do anel pélvico com lençol/cinta pélvica no pronto-socorro (tamponamento).","A) Laparotomia exploradora.","B) Fixação ortopédica definitiva com placa e parafuso no centro cirúrgico.","D) Drenagem torácica bilateral preventiva."],"correct":0},{"q":"36. O Volume Residual Gástrico (VRG) na nutrição enteral do paciente crítico:","a":["A) Deve ser medido de hora em hora e a dieta pausada sempre que > 50 mL.","B) Caiu em desuso como rotina estrita; tolera-se volumes maiores (< 500 mL) na ausência de sintomas obstrutivos para evitar a subnutrição do paciente.","C) É inútil e jamais deve ser medido.","D) Serve apenas para confirmar o posicionamento da sonda na traqueia."],"correct":1},{"q":"37. Fístulas digestivas de alto débito (> 500 mL/dia) cursam com rápida espoliação. Uma fístula entérica duodenal gera predominantemente qual distúrbio ácido-base inicial pela perda do suco entérico e biliar?","a":["A) Acidose metabólica hiperclorêmica (perda de bases/HCO3).","C) Alcalose respiratória.","B) Alcalose metabólica hipoclorêmica (perda de H+ e Cl-).","D) Acidose lática primária."],"correct":2},{"q":"38. Paciente cirrótico com ascite maciça apresenta Na = 125 mEq/L (Hiponatremia). Essa condição é classificada como:","a":["A) Hiponatremia hipovolêmica por diurese.","C) Hiponatremia euvolêmica (SIADH).","D) Pseudohiponatremia.","B) Hiponatremia hipervolêmica (dilucional), onde o sódio corporal total está aumentado, mas a retenção de água livre é ainda maior."],"correct":3},{"q":"39. Homem, 25 anos. Abdome agudo cirúrgico (apendicite). FC 120, PAS 110x70. Diurese 0,2 ml/kg/h. Ansioso. Segundo o ATLS, a classe de choque hemorrágico mais compatível com esse quadro isolado de perda volêmica (desidratação/terceiro espaço) equivalente é a:","a":["B) Classe II (Taquicardia, PA normal, redução do fluxo urinário e ansiedade).","A) Classe I.","C) Classe III.","D) Classe IV."],"correct":0},{"q":"40. A complicação de ferida cirúrgica caracterizada pelo excesso de tecido cicatricial (colágeno) que transborda e invade os limites da incisão original de forma exofítica é o:","a":["A) Cicatriz hipertrófica.","B) Queloide.","C) Granuloma de corpo estranho.","D) Seroma capsular."],"correct":1},{"q":"41. Paciente no 8º DPO de laparotomia para trauma hepático. A ferida encontra-se aberta e vermelha. O curativo ideal para acelerar o fechamento de grandes defeitos limpos de parede abdominal (Terapia por Pressão Negativa) é o:","a":["A) Curativo com açúcar.","C) Gaze com iodo povidona contínuo.","B) Curativo a Vácuo (VAC).","D) Pomada de colagenase apenas."],"correct":2},{"q":"42. A infecção do sítio cirúrgico associada à formação de bolhas violáceas, dor extrema desproporcional ao exame, crepitação subcutânea e rápida evolução para choque séptico nas primeiras 24-48h indica:","a":["A) Infecção incisional superficial por S. aureus.","C) Deiscência fisiológica aguda.","D) Celulite alérgica ao fio.","B) Fasciíte Necrotizante (ex: infecção estreptocócica de grupo A ou polimicrobiana)."],"correct":3},{"q":"43. O preparo de pele ideal, com maior poder residual para o campo operatório dentro da sala de cirurgia, visando prevenir ISC é:","a":["B) Clorexidina alcoólica (sob pele seca e limpa).","A) PVPI aquoso.","C) Álcool 70% simples.","D) Soro fisiológico morno."],"correct":0},{"q":"44. Paciente 60 anos, fumante pesado. A cessação do tabagismo reduz o risco de complicações pulmonares pós-operatórias (CPP). Para que haja restabelecimento real da função mucociliar, o tabagismo deve ser idealmente interrompido:","a":["A) 24 horas antes.","C) 4 a 8 semanas antes.","B) 2 dias antes.","D) No momento da intubação apenas."],"correct":1},{"q":"45. Em uso crônico de inibidor da ECA (Enalapril), qual a conduta preferencial de muitas escolas anestésicas antes de cirurgias de médio/grande porte sob anestesia geral?","a":["A) Dobrar a dose.","C) Trocar por beta-bloqueador no dia.","B) Suspender 24h antes (ou na manhã da cirurgia) pelo alto risco de hipotensão profunda refratária intraoperatória.","D) Manter sem restrições."],"correct":2},{"q":"46. Qual macronutriente infundido isoladamente de forma maciça na via parenteral de um paciente gravemente desnutrido precipita a Síndrome de Realimentação pelo pico de secreção de insulina?","a":["A) Lipídios.","B) Aminoácidos ramificados.","D) Fibras insolúveis.","C) Carboidratos (Dextrose)."],"correct":3},{"q":"47. Paciente pós-reanimação cardíaca, necessita de Dreno Torácico em selo d'água por pneumotórax. O dreno para repentinamente de oscilar e o paciente piora a respiração. Causa provável:","a":["C) Obstrução mecânica do dreno (coágulo ou dobra).","A) O pulmão expandiu perfeitamente.","B) Fístula broncopleural de alto fluxo.","D) Enfisema subcutâneo residual normal."],"correct":0},{"q":"48. O índice de Risco Cardíaco Revisado de Lee (RCRI) engloba 6 fatores preditores independentes. Qual dos fatores abaixo faz parte do escore?","a":["A) Diabetes Mellitus não insulino-dependente.","C) Creatinina pré-operatória > 2,0 mg/dL.","B) Idade superior a 70 anos.","D) Tabagismo ativo."],"correct":1},{"q":"49. Paciente pós-bariátrica chega ao PS com quadro de confusão mental, oftalmoplegia e ataxia após uso de soro glicosado indiscriminado sem vitaminas. A falta aguda de qual vitamina no paciente desnutrido causa a Encefalopatia de Wernicke?","a":["A) Vitamina C.","B) Vitamina B12 (Cobalamina).","C) Vitamina B1 (Tiamina).","D) Vitamina B6."],"correct":2},{"q":"50. Durante a discussão de um caso na preceptoria do 5º semestre no ambulatório do IDOMED, o interno avalia um paciente diabético com nefropatia, insuficiência cardíaca crônica e que sofreu um IAM há 1 ano (ASA III). A cirurgia é de alto risco (revascularização periférica) e a capacidade funcional é de 2 METs. A conduta cardíaca pré-operatória recomendada pela AHA/ACC é:","a":["A) Liberar o paciente sem exames, pois é cirurgia ortopédica.","C) Realizar angioplastia coronariana profilática mandatória antes do procedimento.","D) Pedir apenas um ECG e operar.","B) Solicitar teste provocativo de isquemia não-invasivo (ex: Cintilografia) devido ao risco alto, RCRI ≥ 1 e baixa capacidade funcional."],"correct":3},{"q":"[Unidade 1: Equilíbrio Hidroeletrolítico e Ácido-Base] 51. Mulher, 42 anos, pós-operatório de ressecção de tumor hipofisário. Desenvolve poliúria maciça (8 L/dia), urina muito diluída e Na⁺ sérico de 158 mEq/L. O diagnóstico e o tratamento de escolha são:","a":["B) Diabetes Insipidus central / Desmopressina (DDAVP).","A) SIADH / Restrição hídrica.","C) Síndrome Perdedora de Sal Cerebral / Salina 3%.","D) Cetoacidose diabética / Insulina venosa."],"correct":0},{"q":"52. Um paciente em choque séptico recebe 5 litros de Soro Fisiológico 0,9%. A gasometria evolui com pH 7.25, HCO3 14, pCO2 30, Na 145, Cl 118. O distúrbio ácido-base instalado iatrogenicamente é:","a":["A) Acidose metabólica com ânion gap elevado.","C) Acidose metabólica hiperclorêmica (ânion gap normal).","B) Acidose respiratória crônica.","D) Alcalose metabólica paradoxal."],"correct":1},{"q":"53. Homem, 60 anos, em uso crônico de furosemida e espironolactona, apresenta fraqueza muscular e ondas T apiculadas no ECG. K⁺ sérico = 7,2 mEq/L. A medida medicamentosa imediata que estabiliza a membrana miocárdica sem reduzir os níveis séricos de potássio é:","a":["A) Glicoinsulina.","C) Bicarbonato de Sódio.","B) Gluconato de Cálcio a 10%.","D) Resina de troca (Sorcal)."],"correct":2},{"q":"54. Ao repor grandes volumes em um trauma, a principal vantagem teórica do Ringer Lactato sobre o Soro Fisiológico a 0,9% é:","a":["A) Ter maior osmolaridade, prevenindo edema cerebral.","C) Estar isento de cálcio, facilitando transfusões simultâneas.","D) Não conter potássio.","B) Conter lactato, que é convertido em bicarbonato no fígado, prevenindo acidose hiperclorêmica."],"correct":3},{"q":"55. Qual é a alteração eletrocardiográfica mais precoce e clássica da hipocalemia (K⁺ < 3,0 mEq/L)?","a":["B) Presença de ondas U proeminentes e achatamento da onda T.","A) Alargamento do QRS.","C) Bloqueio Atrioventricular Total.","D) Encurtamento do intervalo QT."],"correct":0},{"q":"56. Paciente obstrutivo alto com vômitos incoercíveis há 4 dias. O distúrbio ácido-base esperado pela perda de suco gástrico é a Alcalose Metabólica. Qual eletrólito, além do sódio e do cloro, é fundamental repor para que o rim consiga reter o íon H⁺ e corrigir a alcalose?","a":["A) Cálcio.","D) Potássio.","B) Fósforo.","C) Magnésio."],"correct":1},{"q":"57. A correção aguda da hipernatremia grave (> 160 mEq/L) com água livre muito rápida acarreta qual complicação neurológica fatal?","a":["A) Edema cerebral e hipertensão intracraniana.","C) Hemorragia subaracnóidea.","B) Mielinólise pontina central.","D) Síndrome de Wernicke."],"correct":2},{"q":"58. O cálculo do Ânion Gap (Na - [Cl + HCO3]) é útil nas acidoses metabólicas. Qual das etiologias abaixo cursa com ânion gap NORMAL?","a":["A) Cetoacidose diabética.","B) Acidose lática por sepse.","D) Intoxicação por salicilatos.","C) Perda intestinal de bicarbonato (ex: diarreia severa, fístula biliar)."],"correct":3},{"q":"[Unidade 2: Choque, Transfusão e Controle de Danos] 59. Vítima de trauma apresenta FC 135 bpm, PA 85x50 mmHg, confuso, sem diurese. Pelo ATLS 10ª Ed, a queda da pressão arterial sistólica marca a transição para qual classe de choque hemorrágico?","a":["C) Classe III.","A) Classe I.","B) Classe II.","D) Classe IV."],"correct":0},{"q":"60. No choque séptico refratário a fluidos, a recomendação de iniciar vasopressores precocemente tem como meta atingir qual Pressão Arterial Média (PAM)?","a":["A) PAM > 50 mmHg.","B) PAM ≥ 65 mmHg.","C) PAM > 90 mmHg.","D) PAM = 120 mmHg."],"correct":1},{"q":"61. Paciente politraumatizado recebe 12 bolsas de concentrado de hemácias. Apresenta hipotensão refratária e Sinal de Chvostek positivo. Essa complicação é típica da:","a":["A) Hipercalemia por lise de hemácias.","C) Reação transfusional hemolítica aguda.","B) Hipocalcemia induzida pelo citrato presente nas bolsas de sangue.","D) Alcalose respiratória hiperventilada."],"correct":2},{"q":"62. Jovem esfaqueado no dorso. Chega paraplégico, FC 50 bpm, PA 70x40 mmHg, extremidades quentes. FAST negativo. O diagnóstico hemodinâmico é:","a":["A) Choque hemorrágico oculto.","B) Choque obstrutivo por pneumotórax.","D) Choque séptico precoce.","C) Choque neurogênico (perda do tônus simpático)."],"correct":3},{"q":"63. A essência da Cirurgia de Controle de Danos (Damage Control) no politraumatizado exsanguinando é:","a":["B) Interromper a cirurgia rapidamente após hemostasia temporária (packing) e controle de contaminação, levando o paciente à UTI para reverter a Tríade Letal.","A) Realizar reconstrução definitiva de todos os órgãos em uma única etapa.","C) Manter hipotensão permissiva por 48 horas na enfermaria.","D) Fazer reanimação apenas com cristaloides."],"correct":0},{"q":"64. O uso de Ácido Tranexâmico no trauma contuso/penetrante grave provou reduzir mortalidade se administrado:","a":["B) Apenas após 12 horas.","A) Nas primeiras 3 horas após a lesão.","C) Somente via intramuscular.","D) Exclusivamente em crianças."],"correct":1},{"q":"65. O choque cardiogênico puro apresenta qual perfil de monitorização hemodinâmica clássica?","a":["A) Débito cardíaco alto, RVS baixa, PVC alta.","C) Débito cardíaco baixo, RVS baixa, PVC baixa.","B) Débito cardíaco baixo, RVS alta, PVC alta.","D) Débito cardíaco alto, RVS alta, PVC baixa."],"correct":2},{"q":"66. A proporção recomendada de hemoderivados no Protocolo de Transfusão Maciça (ex: 1:1:1) visa evitar qual ponta da Tríade Letal?","a":["A) Hipotermia.","B) Acidose Lática.","D) Hipercalemia.","C) Coagulopatia Dilucional."],"correct":3},{"q":"[Unidade 3: Nutrição em Cirurgia] 67. Segundo os protocolos ACERTO/ERAS, o preparo pré-operatório moderno recomenda a abreviação do jejum. Qual o limite de tempo seguro para ingestão de líquidos claros com carboidratos antes da cirurgia eletiva?","a":["D) 2 horas.","A) 8 horas.","B) 6 horas.","C) 4 horas."],"correct":0},{"q":"68. Paciente em UTI desenvolve Síndrome de Realimentação após introdução abrupta de Nutrição Parenteral Total. O marcador laboratorial que define a gravidade desta síndrome e pode causar PCR é a:","a":["A) Hipercalcemia.","B) Hipofosfatemia aguda.","C) Hipoglicemia severa.","D) Hipernatremia."],"correct":1},{"q":"69. Qual a contraindicação ABSOLUTA formal para o início da Nutrição Enteral no paciente grave?","a":["A) Ausência de ruídos hidroaéreos e eliminação de flatos (íleo fisiológico).","B) Fístula colônica de baixo débito.","C) Isquemia mesentérica franca com necrose.","D) Uso concomitante de vasopressores em baixa dose."],"correct":2},{"q":"70. A avaliação nutricional pré-operatória que aponta perda de peso involuntária maior que 10% em 6 meses indica desnutrição grave. Qual a conduta cirúrgica recomendada para cirurgias oncológicas de grande porte nestes casos?","a":["A) Operar de imediato para retirar o tumor \"consumidor\".","C) Manter jejum absoluto e hiperidratação por 3 dias antes do corte.","D) Iniciar NPT intraoperatória.","B) Adiar a cirurgia eletiva e realizar suporte nutricional pré-operatório (7 a 14 dias)."],"correct":3},{"q":"71. O macronutriente cuja necessidade aumenta significativamente na fase de \\\"Flow\\\" do catabolismo cirúrgico (frequentemente prescrito em 1,2 a 2,0 g/kg/dia) para evitar sarcopenia rápida é:","a":["B) Proteína.","A) Carboidrato.","C) Lipídio.","D) Fibra solúvel."],"correct":0},{"q":"72. O marcador hepático de meia-vida muito curta (2-3 dias), ideal para avaliar a resposta imediata ao suporte nutricional na enfermaria, é a:","a":["A) Albumina.","C) Pré-albumina (Transtirretina).","B) Transferrina.","D) Proteína C Reativa."],"correct":1},{"q":"73. Paciente com fístula enterocutânea duodenal de altíssimo débito (1.500 mL/dia). Qual é a estratégia inicial de suporte nutricional que garante repouso do trato alto?","a":["A) Nutrição enteral por sonda nasogástrica em bôlus.","C) Dieta oral rica em fibras.","B) Nutrição Parenteral Total exclusiva ou Nutrição Enteral distal à fístula.","D) Jejum absoluto sem suporte."],"correct":2},{"q":"74. A principal causa mecânica acidental de oclusão de sonda nasoenteral de fino calibre na enfermaria, prevenível com \\\"flushes\\\" de 20-30mL de água, é:","a":["A) Crescimento fúngico.","B) Dobradura gástrica do poliuretano.","D) Ação do ácido gástrico derretendo a ponta.","C) Ressecamento de dieta e precipitação de comprimidos triturados inadequadamente."],"correct":3},{"q":"[Unidade 4: Infecção e Protocolo de Cuidados] 75. Qual o timing ideal e baseado em evidências para a infusão do antibiótico profilático sistêmico (ex: Cefazolina) nas cirurgias limpas/potencialmente contaminadas?","a":["B) 30 a 60 minutos antes da incisão da pele.","A) Na noite anterior à cirurgia.","C) Apenas na hora de fechar a aponeurose.","D) Nas primeiras 12 horas de pós-operatório."],"correct":0},{"q":"76. Uma apendicectomia eletiva por apendicite fase I (flogística, sem pus livre, sem perfuração) é classicamente uma ferida:","a":["A) Limpa.","B) Potencialmente Contaminada.","C) Contaminada.","D) Suja."],"correct":1},{"q":"77. Quando se faz o repique intraoperatório do antibiótico profilático (nova dose)?","a":["A) Somente se o paciente fizer febre na mesa.","C) A cada hora, independentemente do tipo de antibiótico.","B) Se a cirurgia ultrapassar 2 meias-vidas da droga (ex: > 4h para cefazolina) ou se houver perda sanguínea maciça (>1,5 L).","D) Nunca, é contraindicado."],"correct":2},{"q":"78. De acordo com as diretrizes de prevenção de ISC (Bundle), o preparo da pele intraoperatório com maior eficácia residual é feito com:","a":["A) Iodopovidona aquosa.","C) Soro fisiológico morno.","D) Álcool 70% puro.","B) Clorexidina alcoólica."],"correct":3},{"q":"79. Paciente fará colectomia amanhã. Apresenta muitos pelos no abdome. A recomendação correta para tricotomia é:","a":["C) Não retirar, a menos que atrapalhe; se necessário, usar tricotomizador elétrico (clippers) logo antes da cirurgia.","A) Raspar com lâmina de barbear (gilete) na noite anterior.","B) Aplicar cera quente 48h antes.","D) Raspar com lâmina na sala de indução anestésica."],"correct":0},{"q":"80. ISC Incisional Profunda é aquela que acomete:","a":["A) Apenas pele e subcutâneo.","B) Fáscia e camada muscular.","C) O interior do órgão operado.","D) O sítio de inserção do cateter venoso periférico."],"correct":1},{"q":"81. Homem no 2º DPO de laparotomia desenvolve dor excruciante na ferida, inchaço violáceo, bolhas, crepitação (enfisema subcutâneo) e choque circulatório grave. Qual é a hipótese principal que exige reabordagem imediata?","a":["B) Erisipela por Streptococcus.","C) Seroma infectado.","A) Fasciíte Necrotizante.","D) Hematoma retido."],"correct":2},{"q":"82. No preparo de cirurgias colorretais, o uso de profilaxia mecânica (limpeza) do cólon combinada com antibióticos orais (neomicina + metronidazol) no dia anterior, associada à profilaxia venosa padrão, demonstrou:","a":["A) Aumentar a deiscência anastomótica.","C) Ser ineficaz em todas as revisões recentes.","D) Causar colite pseudomembranosa em 100% dos casos.","B) Reduzir significativamente a taxa de Infecção de Sítio Cirúrgico (ISC)."],"correct":3},{"q":"83. O controle rigoroso de qual parâmetro metabólico intraoperatório e no pós-operatório imediato provou reduzir ISC em diabéticos e não diabéticos?","a":["B) Glicemia (alvo < 180 mg/dL ou 140-180 mg/dL).","A) Natremia (Sódio sérico).","C) Fosfatemia.","D) Lactato arterial."],"correct":0},{"q":"[Unidade 5: Avaliação Pré-operatória] 84. Paciente hígida de 25 anos, não tabagista, fará retirada de cisto ovariano. Nenhum sintoma ao exame. Sua classificação ASA é:","a":["B) ASA II.","A) ASA I.","C) ASA III.","D) ASA IV."],"correct":1},{"q":"85. O Índice de Risco Cardíaco Revisado (RCRI - Lee) utiliza 6 variáveis para estimar o risco cardiovascular pré-operatório. Assinale a alternativa que contém apenas critérios válidos do RCRI:","a":["A) Idade > 70 anos e Hipertensão Arterial.","C) Tabagismo e obesidade mórbida.","B) História de IAM, Insuficiência Cardíaca, Doença Cerebrovascular e DM em uso de insulina.","D) Uso crônico de anticoagulante e asma."],"correct":2},{"q":"86. Paciente faz uso de Clopidogrel (inibidor P2Y12) após stent colocado há 2 anos. Vai operar uma hérnia incisional eletiva gigante. Conduta recomendada:","a":["A) Suspender 12 horas antes.","C) Não suspender.","D) Trocar por Heparina de baixo peso.","B) Suspender 5 a 7 dias antes."],"correct":3},{"q":"87. O uso crônico de qual destas medicações cardiológicas NÃO deve ser suspenso de forma alguma no pré-operatório, devido ao alto risco de taquicardia e isquemia miocárdica rebote?","a":["C) Betabloqueadores (ex: Atenolol, Metoprolol).","A) Inibidores da ECA (ex: Captopril).","B) Diuréticos tiazídicos.","D) Antagonistas do receptor de angiotensina II (BRAs)."],"correct":0},{"q":"88. Paciente com capacidade funcional classificada como < 4 METs é aquele que NÃO consegue:","a":["A) Correr uma maratona.","B) Subir um lance de escadas sem parar ou andar quadras em passo rápido sem cansaço.","C) Levantar um copo d'água.","D) Permanecer de pé por 5 minutos."],"correct":1},{"q":"89. Qual exame pré-operatório laboratorial é inquestionável e obrigatório para qualquer mulher jovem em idade fértil, sem história de laqueadura, antes de ir para o bloco cirúrgico?","a":["A) TAP / TTPA.","B) ECG de 12 derivações.","D) Teste de gravidez (Beta-hCG).","C) Raio-X de Tórax."],"correct":2},{"q":"90. Homem, 70 anos, fumante crônico pesado (DPOC). Para haver redução substancial do risco de complicações pulmonares pós-operatórias (melhora da depuração mucociliar), o tabagismo deve ser interrompido com qual antecedência mínima ideal?","a":["A) 12 horas.","B) 24 a 48 horas.","D) 6 meses.","C) 4 a 8 semanas."],"correct":3},{"q":"91. O escore de Caprini é fundamental na avaliação cirúrgica pré-operatória para estabelecer a profilaxia adequada de qual evento?","a":["B) Tromboembolismo Venoso (TVP/TEP).","A) Infarto Agudo do Miocárdio.","C) Insuficiência Renal Aguda.","D) Delirium no idoso."],"correct":0},{"q":"[Unidade 6: Complicações Pós-operatórias] 92. A \\\"Regra dos W's\\\" investiga as causas de febre pós-operatória. O 1º W, que responde pela febre nas primeiras 48h, é \\\"Wind\\\" (Vento), cujo principal representante patológico é:","a":["A) Infecção Urinária (ITU).","B) Atelectasia pulmonar.","C) Trombose Venosa Profunda.","D) Infecção de ferida operatória."],"correct":1},{"q":"93. Paciente no 6º DPO de laparotomia percebe a saída súbita e volumosa de líquido serossanguinolento (\\\"água de lavagem de carne\\\") pela incisão na pele fechada. Esse é o sinal clínico patognomônico de:","a":["A) Formação de hematoma subcutâneo.","C) Fístula urinária.","B) Deiscência da aponeurose profunda (eventração iminente).","D) Celulite estafilocócica."],"correct":2},{"q":"94. Em relação aos drenos cirúrgicos, um Dreno de Penrose funciona fisicamente através do princípio de:","a":["A) Vácuo contínuo ativo.","C) Sucção pulsátil.","D) Sifonagem em sistema fechado estéril.","B) Capilaridade e gradiente de gravidade."],"correct":3},{"q":"95. Uma complicação aguda temida no pós-operatório (geralmente entre o 4º e o 7º dia) de cirurgias pélvicas e ortopédicas de grande porte, caracterizada por dispneia súbita, dor pleurítica e taquicardia, sem achados óbvios ao raio-X torácico inicial, é:","a":["A) Tromboembolismo Pulmonar (TEP).","B) Edema Agudo de Pulmão.","C) Pneumonia aspirativa (Síndrome de Mendelson).","D) Atelectasia basal."],"correct":0},{"q":"96. O que caracteriza o diagnóstico de íleo paralítico (adinâmico) no exame físico abdominal do paciente no 3º dia de pós-operatório?","a":["A) Cólicas excruciantes com peristaltismo de luta e ruídos metálicos.","B) Distensão abdominal simétrica, indolor (ou desconforto leve) e ausência de ruídos hidroaéreos.","C) Defesa muscular involuntária e sinal de Blumberg positivo.","D) Vômitos fecaloide em jato nas primeiras 2 horas."],"correct":1},{"q":"97. O \\\"Delirium\\\" no idoso cirúrgico cursa com flutuação da consciência e desorientação. A medida preventiva inicial mais importante na enfermaria é:","a":["A) Prescrever benzodiazepínicos de meia-vida longa de horário.","B) Manter o paciente amarrado e sedado profilaticamente.","C) Promover mobilização precoce, reorientação temporal/visual, controle da dor e respeitar o ciclo sono-vigília.","D) Manter jejum noturno rigoroso."],"correct":2},{"q":"98. Paciente no pós-operatório de tireoidectomia apresenta hematoma cervical expansivo rápido, dispneia e estridor. A conduta salvadora imediata à beira do leito é:","a":["A) Traqueostomia.","B) Punção aspirativa com agulha fina.","D) Compressa de gelo e observação por 1 hora.","C) Abertura de todos os pontos da incisão (pele e músculos) no próprio leito para descomprimir a via aérea."],"correct":3},{"q":"99. Qual é o período de pico (em dias de pós-operatório) onde fisiologicamente o tecido conectivo está mais frágil, havendo o maior risco de deiscência de anastomoses intestinais?","a":["B) 5º ao 7º dia.","A) 1º ao 2º dia.","C) 14º ao 21º dia.","D) Após 30 dias."],"correct":0},{"q":"100. A deiscência total (pele e aponeurose abertas) com exposição nítida de alças intestinais para fora do abdome é denominada Evisceração. Qual o manejo inicial no leito da enfermaria até a chegada ao centro cirúrgico?","a":["A) Empurrar vigorosamente as alças para dentro com as mãos enluvadas.","B) Cobrir o intestino exteriorizado com compressas estéreis umedecidas em soro fisiológico morno e não tentar reintroduzi-lo, acionando o centro cirúrgico.","C) Suturar a pele por cima na enfermaria.","D) Aplicar iodo tópico nas alças e aguardar cicatrização."],"correct":1}];

let current = 0, score = 0, answered = false;

const qnum = document.getElementById('qnum');
const question = document.getElementById('question');
const options = document.getElementById('options');
const feedback = document.getElementById('feedback');
const next = document.getElementById('next');
const counter = document.getElementById('counter');
const scoreEl = document.getElementById('score');
const bar = document.getElementById('bar');
const quizCard = document.getElementById('quizCard');
const result = document.getElementById('result');

function render(){
  const q = QUESTIONS[current];
  answered = false;
  qnum.textContent = `Questão ${current+1}`;
  counter.textContent = `${current+1} / ${QUESTIONS.length}`;
  scoreEl.textContent = score;
  bar.style.width = `${(current / QUESTIONS.length) * 100}%`;
  question.textContent = q.q;
  options.innerHTML = '';
  feedback.className = 'feedback';
  feedback.textContent = '';
  next.disabled = true;
  q.a.forEach((text, i)=>{
    const b = document.createElement('button');
    b.className = 'option';
    b.innerHTML = `<strong>${String.fromCharCode(65+i)})</strong> ${escapeHtml(text)}`;
    b.addEventListener('click', ()=>answer(i));
    options.appendChild(b);
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function answer(i){
  if(answered) return;
  answered = true;
  const q = QUESTIONS[current];
  const btns = [...options.children];
  btns.forEach((b,j)=>{
    b.disabled = true;
    if(j === q.correct) b.classList.add('correct');
  });
  if(i === q.correct){
    score++;
    feedback.className = 'feedback show good';
    feedback.innerHTML = '<strong>Correto!</strong> Você marcou a alternativa certa.';
  } else {
    btns[i].classList.add('wrong');
    feedback.className = 'feedback show bad';
    feedback.innerHTML = `<strong>Resposta incorreta.</strong> A alternativa correta é <strong>${String.fromCharCode(65+q.correct)}</strong>.`;
  }
  scoreEl.textContent = score;
  next.disabled = false;
}

next.addEventListener('click', ()=>{
  if(!answered) return;
  if(current < QUESTIONS.length-1){
    current++;
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  } else finish();
});

function finish(){
  quizCard.style.display='none';
  result.classList.add('show');
  const pct = (score / QUESTIONS.length) * 100;
  document.getElementById('finalScore').textContent = `${pct.toFixed(1)}%`;
  document.getElementById('finalText').textContent =
    `Você acertou ${score} de ${QUESTIONS.length} questões.`;
  bar.style.width='100%';
}

function restart(){
  current=0; score=0;
  quizCard.style.display='block';
  result.classList.remove('show');
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('restart').addEventListener('click',restart);
document.getElementById('again').addEventListener('click',restart);

document.addEventListener('keydown', e=>{
  if(['1','2','3','4'].includes(e.key) && !answered){
    const i=Number(e.key)-1;
    options.children[i]?.click();
  }
  if(e.key==='Enter' && answered && !next.disabled) next.click();
});
render();
</script>
</body>
</html>
