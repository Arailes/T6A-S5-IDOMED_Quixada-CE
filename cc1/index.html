 iniciar adrenalina."],"correct":0},{"q":"88. Mulher de 55 anos dá entrada com febre de 39°C, tosse produtiva e confusão mental. PA 75x40 mmHg, FC 120. Lactato 4,5 mmol/L. Recebeu 30 mL/kg de Ringer Lactato em bôlus rápido e antibioticoterapia empírica. Após 1 hora, a PAM permanece em 55 mmHg. Qual é a conduta sequencial correta segundo a Campanha de Sobrevivência à Sepse?","a":["B) Dobrar o volume de cristaloides, infundindo mais 30 mL/kg.","A) Iniciar infusão contínua de Noradrenalina pelo acesso venoso periférico até obtenção do central, visando PAM > 65.","C) Administrar Hidrocortisona em altas doses antes do vasopressor.","D) Iniciar Dobutamina isolada para melhorar o trabalho cardíaco."],"correct":1},{"q":"89. Durante um procedimento de tomografia com contraste iodado, paciente relata dispneia súbita, prurido intenso e evolui com estridor laríngeo e síncope por PA inaudível. A intervenção medicamentosa de Ouro a ser executada no primeiro minuto é:","a":["A) Difenidramina venosa.","B) Hidrocortisona 500mg venosa.","C) Adrenalina aquosa (1:1000) 0,3 a 0,5 mg via intramuscular na coxa.","D) Salbutamol sob nebulização contínua."],"correct":2},{"q":"90. Paciente vítima de trauma contuso toracoabdominal foi submetido a cirurgia de controle de danos (laparostomia com compressas) e enviada à UTI intubada. O plantonista nota aumento progressivo das pressões de via aérea no ventilador (baixa complacência), oligúria franca e PAM limítrofe, embora o abdome contenha compressas e cobertura de plástico. PIA mensurada intravesical = 26 mmHg. Trata-se de qual complicação cirúrgica?","a":["A) Atelectasia maciça pós-operatória.","C) Coagulopatia por consumo (CIVD).","D) Embolia gordurosa por fraturas ocultas.","B) Síndrome Compartimental Abdominal instalada necessitando retorno ao bloco para descompressão."],"correct":3},{"q":"91. Paciente cirrótico Child C dá entrada com hemorragia digestiva alta grave por varizes esofágicas. No manejo inicial do choque, a equipe prescreve cristaloides, hemoderivados e terlipressina. O mecanismo fisiopatológico esperado neste perfil específico de paciente é:","a":["C) RVS basal muito baixa (vasodilatação esplâncnica e sistêmica crônica), combinada com choque hemorrágico, tornando a pressão extremamente sensível à perda de volume.","A) RVS constitucionalmente elevada que mascara a hipotensão.","B) Hipercoagulabilidade crônica protegendo-o de choque severo.","D) Resistência total ao uso de vasopressores periféricos."],"correct":0},{"q":"92. Jovem esfaqueado no pescoço (Zona II), apresentando hematoma pulsátil em expansão rápida, cianose orofacial, estridor e choque classe III. Conduta:","a":["B) Compressão manual do pescoço com ataduras apertadas circunferenciais e aguardar tomografia.","A) Intubação imediata (se possível) ou cricotireoidostomia, seguida de exploração cirúrgica cervical imediata em bloco.","C) Passagem de acesso venoso central na jugular interna do lado lesionado.","D) Reposição volêmica maciça isolada."],"correct":1},{"q":"93. Paciente grande queimado (40% de superfície) no segundo dia de internação, mantendo diurese de 1 mL/kg/h, apresenta piora súbita da estabilidade, lactato em ascensão e extremidades frias. Pressões de enchimento central (PVC) normais, mas DC extremamente baixo. Fator complicador comumente visto na fase subaguda de grandes queimaduras elétricas/chama associado a dano endotelial profundo que precipita instabilidade é:","a":["A) SIADH secundária à queimadura.","B) Choque Neurogênico tardio.","C) Sepse de foco cutâneo ou pulmonar associada à depressão miocárdica (disfunção cardíaca do queimado/sepse).","D) Hipocalemia aguda induzida pelo fogo."],"correct":2},{"q":"94. O \\\"Índice de Choque Modificado\\\" (Modified Shock Index) difere do índice tradicional por utilizar qual parâmetro de pressão em sua fórmula para aumentar a sensibilidade de detecção de hipoperfusão?","a":["A) Pressão Diastólica (FC/PAD).","C) Pressão de Pulso (FC/PP).","D) Pressão Venosa Central (FC/PVC).","B) Pressão Arterial Média (FC/PAM)."],"correct":3},{"q":"95. Em um cenário pré-hospitalar militar (Tactical Combat Casualty Care - TCCC), diante de um choque hemorrágico exanguinante por amputação traumática de membro inferior por artefato explosivo, qual é a intervenção de salvamento inicial absoluta antes mesmo da via aérea?","a":["B) Aplicação rápida de Torniquete proximal à lesão.","A) Toracotomia de reanimação.","C) Intubação às cegas.","D) Acesso intraósseo tibial no mesmo membro lesado."],"correct":0},{"q":"96. Um paciente no trauma é classificado com Choque Hemorrágico Classe I (ex: fratura de rádio isolada). De acordo com os protocolos, qual hemoderivado é rotineiramente infundido para esse paciente na sala de emergência?","a":["B) Apenas 1 bolsa de hemácias profilaticamente.","A) Nenhum sangue. O tratamento baseia-se em fluidos cristaloides (se necessário) e controle ortopédico.","C) Protocolo de transfusão maciça devido à dor.","D) Plasma Fresco Congelado."],"correct":1},{"q":"97. O uso de vasopressores (Noradrenalina) no contexto de Choque Hemorrágico no trauma é considerado uma estratégia de:","a":["A) Primeira linha antes mesmo dos cristaloides, para ganhar tempo de transferência.","C) Tratamento definitivo e substituto da cirurgia de contenção.","B) Exceção e temporária, usada principalmente quando há suspeita de lesão medular associada (choque misto) ou choque terminal refratário a volume/sangue, pois agrava a hipoperfusão orgânica induzida pelo sangramento se não houver sangue reposto.","D) Ouro em todas as classes de choque do ATLS 10ª edição."],"correct":2},{"q":"98. A Toracotomia de Reanimação (Toracotomia no Pronto-Socorro) possui critérios muito restritos de sucesso. Qual é a indicação clássica com maior taxa de sobrevida aceita pelas diretrizes de cirurgia do trauma?","a":["A) Trauma cranioencefálico grave com PCR prolongada no APH.","B) Trauma contuso fechado abdominal e torácico com assistolia de 20 minutos.","D) Choque anafilático intra-hospitalar.","C) Trauma torácico penetrante com PCR presenciada (sinais de vida presentes momentos antes de chegar à sala de trauma ou já na sala)."],"correct":3},{"q":"99. Qual componente isolado, derivado do processo de armazenamento e fracionamento do sangue total, tem a capacidade de causar Hipotermia Iatrogênica irreversível e aprofundamento da Tríade Letal se infundido em velocidade maciça sem o uso de aquecedores de fluido?","a":["C) Concentrado de Hemácias refrigerado a 4°C.","A) Plasma Fresco Congelado em banho-maria.","B) Plaquetas (armazenadas em temperatura ambiente).","D) Crioprecipitado liofilizado."],"correct":0},{"q":"100. O objetivo primário final de toda a reanimação hemodinâmica, ressuscitação volêmica, transfusão maciça e cirurgia de controle de danos convergidos para salvar um paciente chocado é a restauração do:","a":["A) Débito cardíaco normal para a idade.","D) Equilíbrio ótimo entre a oferta e o consumo de oxigênio tecidual, revertendo o metabolismo anaeróbico no nível celular.","B) Nível normal de consciência e força motora.","C) Volume urinário fisiológico."],"correct":1},{"q":"[Nível 1: Triagem, Avaliação Nutricional e Marcadores] 1. Qual é o objetivo primário da triagem nutricional recomendada nas primeiras 24 a 48 horas da admissão de um paciente cirúrgico?","a":["A) Prescrever a fórmula definitiva de nutrição parenteral total.","C) Calcular com precisão o gasto energético por calorimetria indireta.","B) Identificar rapidamente pacientes desnutridos ou em risco nutricional que necessitam de avaliação aprofundada.","D) Determinar a dosagem sérica de todos os oligoelementos e vitaminas."],"correct":2},{"q":"2. Segundo as diretrizes da ESPEN e da BRASPEN, qual ferramenta de triagem nutricional é considerada padrão-ouro para o paciente hospitalizado?","a":["B) Escala de Glasgow.","C) Índice de Massa Corporal (IMC) isolado.","D) Dosagem de albumina sérica na admissão.","A) NRS-2002 (Nutritional Risk Screening 2002)."],"correct":3},{"q":"3. Na Avaliação Global Subjetiva (AGS), proposta originalmente por Detsky e Baker, a classificação do estado nutricional baseia-se fundamentalmente em:","a":["B) Dados clínicos (mudança de peso, ingestão alimentar, sintomas gastrointestinais) e exame físico (perda muscular/gordurosa e edemas).","A) Relação entre dosagem de pré-albumina e transferrina.","C) Tomografia de abdome para quantificação de área muscular lombar.","D) Cálculo da excreção urinária de creatinina em 24 horas."],"correct":0},{"q":"4. Uma perda ponderal involuntária é considerada clinicamente grave e preditora de aumento de morbimortalidade cirúrgica quando ultrapassa:","a":["A) 2% do peso corporal em 6 meses.","B) > 10% do peso corporal em 6 meses (ou > 5% em 1 mês).","C) 1 kg em relação ao peso habitual, independentemente do tempo.","D) 3% do peso corporal associado à diurese preservada."],"correct":1},{"q":"5. A albumina sérica é amplamente utilizada em ambulatórios cirúrgicos. No entanto, qual característica limita sua utilização como marcador dinâmico agudo de resposta nutricional no paciente internado grave?","a":["A) Produção exclusiva no endotélio vascular.","C) Meia-vida ultracurta de apenas 6 horas.","B) Meia-vida longa (cerca de 20 dias) e comportamento de proteína de fase aguda negativa (cai na inflamação sistêmica).","D) Dependência estrita da taxa de filtração glomerular para sua síntese."],"correct":2},{"q":"6. Em situações de trauma, sepse e estresse cirúrgico severo, o que ocorre fisiologicamente com as concentrações séricas de Albumina e de Proteína C Reativa (PCR), respectivamente?","a":["A) Ambas aumentam proporcionalmente.","C) A albumina aumenta e a PCR reduz.","D) Ambas permanecem inalteradas, pois dependem apenas do aporte calórico.","B) A albumina reduz (reagente de fase aguda negativo) e a PCR aumenta (reagente de fase aguda positivo)."],"correct":3},{"q":"7. Qual proteína sintetizada pelo fígado possui meia-vida curta (cerca de 2 a 3 dias), sendo útil como marcador dinâmico da melhora da síntese proteica durante o suporte nutricional?","a":["A) Pré-albumina (Transtirretina).","B) Globulina gama.","C) Ferritina sérica.","D) Fibrinogênio."],"correct":0},{"q":"8. Paciente idoso, acamado, com IMC de 16,5 kg/m². De acordo com os critérios da Organização Mundial da Saúde (OMS), esse valor de IMC enquadra o paciente em:","a":["A) Eutrofia.","B) Baixo peso / Desnutrição.","C) Sobrepeso com preservação sarcopênica.","D) Risco limítrofe normal."],"correct":1},{"q":"9. Um paciente obeso (IMC = 36 kg/m²) admitido com adenocarcinoma gástrico estenosante relata ter perdido 14 kg nos últimos dois meses devido a vômitos pós-prandiais. Do ponto de vista metabólico-cirúrgico, esse paciente deve ser classificado como:","a":["A) Eutrófico, pois seu IMC atual ainda está na faixa de obesidade.","C) Sem necessidade de terapia nutricional pré-operatória.","B) Em risco nutricional moderado a grave, com depleção aguda de massa magra protegida pelo tecido adiposo.","D) Apto para cirurgia de grande porte sem preparo nutricional prévio."],"correct":2},{"q":"10. A força de preensão palmar avaliada por dinamometria manual é uma ferramenta clínica prática utilizada no pré-operatório para:","a":["A) Medir a volemia e guiar a reposição hídrica cristaloide.","C) Determinar a taxa metabólica basal sem necessidade de fórmulas.","D) Estimar a perda de sangue intraoperatória.","B) Avaliar funcionalidade muscular e identificar sarcopenia ou comprometimento funcional associado à desnutrição."],"correct":3},{"q":"11. Na Avaliação Global Subjetiva (AGS), a letra \\\"C\\\" indica:","a":["C) Gravemente desnutrido.","A) Paciente bem nutrido / eutrófico.","B) Moderadamente desnutrido ou com suspeita de desnutrição.","D) Paciente com obesidade sarcopênica."],"correct":0},{"q":"12. A contagem total de linfócitos (CTL) é frequentemente usada como indicador indireto de competência imunológica relacionada à nutrição. Níveis indicativos de depleção nutricional grave são representados por valores inferiores a:","a":["B) 1.500 /mm³.","A) 800 /mm³.","C) 2.500 /mm³.","D) 3.500 /mm³."],"correct":1},{"q":"13. A deficiência de qual micronutriente está classicamente associada a defeitos na hidroxilação da prolina e lisina durante a síntese do colágeno, prejudicando diretamente a cicatrização e a força tênsil da ferida cirúrgica?","a":["B) Vitamina E.","C) Vitamina D.","A) Vitamina C (Ácido ascórbico).","D) Selênio."],"correct":2},{"q":"14. Paciente hígido (ASA I), eutrófico, com colelitíase sintomática, que passará por colecistectomia eletiva laparoscópica. A triagem nutricional (NRS-2002) resulta em score zero. Qual a indicação de suporte nutricional pré-operatório para este caso?","a":["A) Suplementação enteral imunomoduladora por 14 dias.","B) Nutrição Parenteral Periférica por 5 dias antes da internação.","D) Sonda nasoenteral profilática no intraoperatório.","C) Nenhuma indicação de suporte nutricional especial; seguir protocolos padrão de abreviação de jejum."],"correct":3},{"q":"15. Em um paciente com desnutrição grave confirmada (ex: perda de 18% do peso, hipoalbuminemia importante) candidato a gastrectomia total oncológica eletiva, a conduta recomendada pelas diretrizes internacionais é:","a":["B) Postergar a cirurgia por 7 a 14 dias para suporte nutricional pré-operatório adequado (preferencialmente enteral).","A) Operar de emergência antes que ocorra maior perda de peso.","C) Manter jejum absoluto por 5 dias e operar em seguida.","D) Realizar apenas hidratação venosa por 24 horas antes do procedimento."],"correct":0},{"q":"[Nível 2: Resposta Metabólica ao Trauma, Jejum e Protocolos Multimodais] 16. A resposta metabólica ao trauma divide-se historicamente em duas grandes fases (Cuthbertson). A fase inicial \\\"Ebb\\\" (ou de refluxo), que ocorre nas primeiras horas pós-choque/trauma, é marcada por:","a":["A) Aumento maciço do consumo de oxigênio e hipertermia.","B) Hipometabolismo basal, hipotensão, vasoconstrição e queda do débito cardíaco.","C) Intenso anabolismo com balanço nitrogenado positivo.","D) Gliconeogênese desenfreada e diurese osmótica."],"correct":1},{"q":"17. Na fase \\\"Flow\\\" (ou de fluxo) da resposta inflamatória cirúrgica, observa-se intenso catabolismo muscular. A quebra proteica muscular esquelética tem como principal finalidade metabólica:","a":["B) Gerar corpos cetônicos para a circulação cerebral exclusiva.","C) Fornecer cálcio iônico para a ativação da cascata de coagulação.","A) Fornecer aminoácidos (como alanina e glutamina) para a gliconeogênese hepática e síntese de proteínas inflamatórias/cicatrização.","D) Reduzir o trabalho cardíaco através da sarcopenia adaptativa."],"correct":2},{"q":"18. Os protocolos multimodais modernos de aceleração da recuperação cirúrgica (ERAS e Projeto ACERTO) recomendam para a ingestão de líquidos claros sem resíduos (água, chás adoçados, bebidas com carboidratos) no pré-operatório um tempo de jejum de até:","a":["A) 8 horas antes da indução anestésica.","B) 6 horas antes da indução anestésica.","D) 30 minutos antes da incisão na pele.","C) 2 horas antes da indução anestésica."],"correct":3},{"q":"19. Qual é o tempo mínimo de jejum pré-operatório recomendado para uma refeição sólida leve (como torradas e chá com leite desnatado) antes de uma cirurgia eletiva?","a":["C) 6 horas.","A) 2 horas.","B) 4 horas.","D) 12 horas."],"correct":0},{"q":"20. A oferta pré-operatória de solução enriquecida com carboidratos (maltodextrina a 12,5%) até 2 horas antes da indução visa fundamentalmente a:","a":["A) Evitar hipercalemia pós-operatória.","B) Atenuar a resistência insulínica pós-operatória, reduzir o catabolismo proteico e melhorar o conforto do paciente (menos sede e ansiedade).","C) Dilatar as alças intestinais para facilitar a manipulação cirúrgica.","D) Bloquear a secreção de saliva para diminuir secreção traqueal."],"correct":1},{"q":"21. No pós-operatório não complicado de ressecções intestinais eletivas com anastomose, a diretriz do Projeto ACERTO e do ERAS quanto ao início da dieta oral/enteral orienta:","a":["A) Aguardar imperativamente a eliminação de fezes e flatos (cerca do 5º DPO).","C) Manter sonda nasogástrica descompressiva aberta até o 7º dia.","B) Iniciar dieta líquida precoce já nas primeiras 24 horas de pós-operatório, se o paciente estiver clinicamente estável.","D) Prescrever nutriÃ§Ã£o parenteral total profilÃ¡tica por 48 horas para \"poupar\" a sutura cirÃºrgica."],"correct":2},{"q":"22. No íleo adinâmico pós-operatório fisiológico, qual segmento do trato gastrointestinal costuma restabelecer suas contrações e motilidade coordenada de forma mais rápida (frequentemente em menos de 24 horas)?","a":["A) Cólon esquerdo.","B) Estômago.","D) Junção retossigmoide.","C) Intestino delgado."],"correct":3},{"q":"23. Em pacientes cirúrgicos adultos internados, sem estresse extremo, a estimativa prática inicial de necessidades energéticas totais diárias costuma situar-se na faixa de:","a":["B) 25 a 30 kcal/kg/dia.","A) 10 a 15 kcal/kg/dia.","C) 45 a 55 kcal/kg/dia.","D) 60 a 70 kcal/kg/dia."],"correct":0},{"q":"24. Em relação ao aporte proteico no paciente cirúrgico catabólico (ex: pós-operatório de cirurgia de grande porte ou trauma moderado a grave), a recomendação diária padrão é de:","a":["A) 0,6 a 0,8 g/kg/dia.","B) 1,2 a 2,0 g/kg/dia.","C) > 3,5 g/kg/dia.","D) Zero g/kg/dia nas primeiras 72 horas para prevenir amoniemia."],"correct":1},{"q":"25. A imunonutrição consiste no uso de dietas enterais suplementadas com imunomoduladores. Qual combinação de substratos é classicamente descrita nessas formulações?","a":["A) Frutose, Ácido fólico e Ferro quelato.","C) Glicose, Sulfato de zinco e Tiamina.","B) Arginina, Ácidos graxos Ômega-3 e Nucleotídeos.","D) Colágeno hidrolisado, Cálcio e Vitamina K."],"correct":2},{"q":"[Nível 3: Nutrição Enteral (Vias, Fórmulas e Manejo)] 26. A manutenção do trânsito de nutrientes na luz do trato gastrointestinal através da nutrição enteral, em comparação com a via parenteral, protege contra infecções sistêmicas principalmente porque:","a":["A) Esteriliza a microbiota colônica habitual.","C) Inibe a motilidade gástrica, reduzindo o refluxo laringofaríngeo.","D) Estimula a secreção maciça de ácido clorídrico gástrico.","B) Mantém o trofismo dos enterócitos, preserva as junções de oclusão (tight junctions), estimula o GALT e secreta IgA, prevenindo a translocação bacteriana."],"correct":3},{"q":"27. Qual das seguintes alternativas representa uma contraindicação absoluta para a instituição de nutrição enteral?","a":["C) Isquemia mesentérica aguda com infarto/necrose intestinal.","A) Pancreatite aguda leve sem falência de órgãos.","B) Fístula colônica de baixo débito (< 150 mL/dia).","D) Íleo paralítico pós-operatório precoce (< 24h) sem distensão patológica."],"correct":0},{"q":"28. As dietas enterais poliméricas padrão são caracterizadas por apresentarem:","a":["B) Aminoácidos livres na sua totalidade, sem exigência de quebra enzimática.","A) Macronutrientes em sua forma intacta (proteínas inteiras, polissacarídeos), exigindo capacidade digestiva e enzimática normal do trato digestório.","C) Ausência total de lipídios em sua composição para evitar pancreatite.","D) Osmolaridade extremamente alta (> 1.200 mOsm/L), devendo ser infundidas exclusivamente em veia central."],"correct":1},{"q":"29. Paciente com síndrome do intestino curto secundária a trombose venosa mesentérica apresenta grande perda de área de digestão e absorção. Para viabilizar a absorção de macronutrientes pela mucosa restante, a formulação enteral mais adequada é a:","a":["A) Polimérica hiperlipídica.","C) Dieta artesanal batida com fibras insolúveis.","B) Oligomérica ou elementar (com peptídeos hidrolisados e triglicerídeos de cadeia média).","D) Dieta cetogênica estrita."],"correct":2},{"q":"30. O posicionamento da sonda enteral em topografia pós-pilórica (duodenal ou jejunal) está especialmente indicado em pacientes com:","a":["A) Ausência de dentes e disfagia leve.","C) Perfuração de cólon descendente com peritonite fecal.","D) Qualquer cirurgia que envolva o tórax.","B) Gastroparesia grave, estase gástrica importante ou refluxo gastroesofágico com alto risco documentado de broncoaspiração."],"correct":3},{"q":"31. Para um paciente com sequela neurológica de acidente vascular encefálico e disfagia grave e irreversível, cuja estimativa de necessidade de suporte nutricional por sonda ultrapasse 4 a 6 semanas, a melhor conduta de via de acesso é a confecção de:","a":["A) Gastrostomia percutânea (PEG) ou cirúrgica.","B) Sonda nasogástrica (SNG) calibrosa mantida por tempo indeterminado.","C) Sonda nasoenteral (SNE) com trocas semanais de narina.","D) Dissecção de veia basílica para nutrição parenteral perene."],"correct":0},{"q":"32. Para minimizar o risco de aspiração pulmonar do conteúdo gástrico durante a infusão de dieta enteral contínua na enfermaria ou UTI, a medida física não farmacológica mandatória é:","a":["A) Manter o paciente em decúbito ventral (prona) durante a infusão.","B) Manter a cabeceira do leito permanentemente elevada entre 30° e 45°.","C) Posicionar o paciente em decúbito de Trendelenburg.","D) Aspirar o estômago com sonda de grosso calibre a cada 30 minutos."],"correct":1},{"q":"33. A causa mais frequente de obstrução mecânica acidental de sondas nasoenterais de fino calibre (poliuretano/silicone) no pós-operatório é:","a":["A) Crescimento intraluminal de fungos oportunistas.","C) Formação de cálculos de oxalato dentro da sonda.","B) Ressecamento de restos de dieta e administração inadequada de comprimidos mal triturados sem lavagem prévia e posterior da sonda.","D) Reação imune do hospedeiro contra o plástico."],"correct":2},{"q":"34. Para manter a desobstrução e patência de sondas de nutrição enteral, a recomendação prática estabelecida é:","a":["B) Infundir refrigerante à base de cola diariamente de forma profilática.","C) Trocar o fio-guia metálico para dentro da sonda toda semana.","D) Aspirar com vácuo central potente duas vezes ao dia.","A) Lavar a sonda com 20 a 30 mL de água potável/filtrada antes e após a administração de dietas e medicamentos."],"correct":3},{"q":"35. Um paciente no 3º DPO em uso de nutrição enteral contínua evolui com episódios diarreicos frequentes. A equipe deve prontamente revisar a prescrição medicamentosa, pois qual classe de fármacos frequentemente administrada na forma de xaropes/soluções orais está implicada nessa complicação pela alta osmolalidade e presença de sorbitol?","a":["A) Antibióticos e xaropes medicamentosos ricos em sorbitol.","B) Anticoagulantes subcutâneos.","C) Protetores gástricos endovenosos (IBP).","D) Bloqueadores neuromusculares adespolarizantes."],"correct":0},{"q":"36. As diretrizes modernas de terapia nutricional recomendam, em relação à medição rotineira do Volume Residual Gástrico (VRG) no paciente tolerando dieta:","a":["A) Interromper a dieta sempre que o resíduo for superior a 50 mL.","B) Desencorajar a checagem rotineira do VRG em pacientes assintomáticos, reservando a avaliação para casos de distensão abdominal, dor ou vômitos.","C) Manter aspiração gástrica a cada 1 hora em todos os pacientes cirúrgicos.","D) Substituir a dieta por parenteral assim que o resíduo ultrapassar 100 mL."],"correct":1},{"q":"37. A administração de nutrição enteral no método fracionado em \\\"bôlus\\\" (injeção intermitente rápida de volume por seringa) é fisiologicamente restrita a sondas localizadas no:","a":["A) Jejuno distal.","B) Duodeno.","C) Estômago (devido à sua capacidade reservatório e relaxamento receptivo).","D) Esôfago proximal."],"correct":2},{"q":"38. Paciente submetido a ressecção intestinal de urgência com confecção de jejunostomia alta terminal apresenta perda de quase todo o íleo. A infusão de dieta com alto teor de fibras insolúveis nessa via:","a":["A) É mandatória para acelerar a absorção de gorduras.","C) Estimula a proliferação da flora bacteriana anaeróbica protetora no jejuno.","D) Deve ser associada a grandes bôlus de água pura hipertônica.","B) É contraindicada, pois pode aumentar o débito do estoma, agravar a espoliação hidroeletrolítica e causar obstrução luminal mecânica."],"correct":3},{"q":"[Nível 4: Nutrição Parenteral (NPT), Indicações e Complicações] 39. A indicação formal e primária para a instituição de Nutrição Parenteral Total (NPT) ocorre quando:","a":["B) O trato gastrointestinal for não funcionante, inacessível ou quando a nutrição enteral for contraindicada ou insuficiente.","A) O paciente apresenta recusa alimentar psicológica por mais de 24 horas.","C) O paciente for classificado como ASA I sem intercorrências.","D) Houver indicação de laparotomia eletiva não complicada."],"correct":0},{"q":"40. A Nutrição Parenteral Periférica (NPP) é uma alternativa transitória à via central. O principal fator limitante que restringe o uso da via venosa periférica a soluções de baixa densidade calórica é:","a":["A) O risco iminente de esteatose hepática fulminante.","B) O limite de osmolaridade (geralmente até 850–900 mOsm/L), acima do qual há risco elevado de flebite e tromboflebite química superficial.","C) A incapacidade de veias periféricas transportarem aminoácidos.","D) A incompatibilidade do endotélio venoso periférico com o cloreto de sódio."],"correct":1},{"q":"41. As bolsas de Nutrição Parenteral Total conhecidas como formulações \\\"3 em 1\\\" (All-in-One) contêm no mesmo invólucro os três macronutrientes fundamentais, que são:","a":["B) Proteínas inteiras, Maltodextrina e Fibras solúveis.","C) Albumina humana a 20%, Triglicerídeos e Amido.","A) Aminoácidos, Glicose (Dextrose) e Emulsão Lipídica.","D) Peptídeos livres, Lactose e Soro fisiológico."],"correct":2},{"q":"42. Qual é a complicação metabólica mais comum durante o início e a manutenção de uma infusão de Nutrição Parenteral Total em pacientes cirúrgicos em fase catabólica?","a":["A) Hipoglicemia severa persistente.","C) Hipocalemia grave induzida por perda renal de sódio.","D) Acidose respiratória crônica compensada.","B) Hiperglicemia secundária à alta carga de dextrose associada à resistência periférica à insulina pelo trauma."],"correct":3},{"q":"43. Pacientes dependentes de Nutrição Parenteral exclusiva por longos períodos sem qualquer estímulo enteral desenvolvem frequentemente alterações hepatobiliares caracterizadas por:","a":["B) Estase biliar, lama biliar, colecistolitíase alitiásica e esteatose hepática por falta de estimulação de colecistoquinina (CCK).","A) Hipertensão portal pré-hepática por trombose esplênica.","C) Carcinoma hepatocelular fibrolamelar.","D) Cirrose biliar primária autoimune."],"correct":0},{"q":"44. Qual complicação não metabólica associada ao uso prolongado do cateter venoso central exclusivo para NPT representa a maior causa de sepse e potencial mortalidade relacionada ao procedimento?","a":["B) Trombose venosa profunda de membros inferiores.","A) Infecção de corrente sanguínea associada a cateter (IPCS).","C) Perfuração tardia de artéria radial.","D) Fístula arteriovenosa periférica."],"correct":1},{"q":"45. Ao programar o desmame da Nutrição Parenteral Total quando a ingestão oral/enteral do paciente atinge mais de 60 a 75% das metas calórico-proteicas, a interrupção da NPT deve ser gradual (e nunca abrupta) para evitar qual efeito rebote metabólico?","a":["A) Crise tireotóxica.","C) Hipertensão arterial severa por retenção salina.","B) Hipoglicemia de rebote (secundária aos altos níveis circulantes de insulina endógena).","D) Hipercalemia refratária com ondas T apiculadas."],"correct":2},{"q":"[Nível 5: Síndrome de Realimentação e Casos Clínicos Complexos] 46. A Síndrome de Realimentação é uma complicação metabólica grave provocada pela reintrodução agressiva de nutrientes em pacientes gravemente desnutridos. O gatilho fisiopatológico central dessa entidade é o aumento súbito na secreção de qual hormônio?","a":["A) Cortisol.","B) Glucagon.","D) Somatostatina.","C) Insulina."],"correct":3},{"q":"47. O marco laboratorial clássico e a alteração eletrolítica mais frequente e perigosa na Síndrome de Realimentação, responsável por fraqueza muscular extrema, disfunção diafragmática e arritmias cardíacas, é a:","a":["B) Hipofosfatemia severa.","A) Hipercalcemia aguda.","C) Hipercloremia refratária.","D) Hipermagnesemia sintomática."],"correct":0},{"q":"48. Além da progressão calórica lenta e cautelosa (iniciando com 10 a 15 kcal/kg/dia), qual vitamina hidrossolúvel deve ser obrigatoriamente administrada antes e durante os primeiros dias de realimentação em pacientes de alto risco para evitar acidose lática grave e Encefalopatia de Wernicke?","a":["B) Piridoxina (Vitamina B6).","A) Tiamina (Vitamina B1).","C) Cobalamina (Vitamina B12).","D) Biotina (Vitamina B7)."],"correct":1},{"q":"49. Paciente de 58 anos com fístula digestiva enterocutânea de alto débito (1.200 mL/dia em jejuno médio) após deiscência de sutura cirúrgica. Encontra-se desnutrido grave, afebril, com abdome doloroso difusamente e sinais de desidratação. Qual é a conduta prioritária inicial em relação ao suporte nutricional e hidroeletrolítico?","a":["A) Forçar dieta oral sólida com alto teor de fibras para tornar as fezes pastosas.","C) Passagem imediata de sonda gástrica para início de dieta hiperproteica em bôlus.","B) Estabilização volêmica e hidroeletrolítica, controle do efluente da fístula e início de Nutrição Parenteral Total, mantendo o trato gastrointestinal proximal em repouso.","D) Laparotomia imediata no mesmo dia para fechar a fístula por sutura simples."],"correct":2},{"q":"50. Homem de 62 anos, etilista crônico, com neoplasia obstrutiva de esôfago médio, deu entrada no hospital pesando 42 kg (perda de 22% do peso habitual nos últimos 3 meses). A equipe médica instalou cateter venoso central e iniciou bolsa de NPT com meta plena calculada em 2.200 kcal/dia. No segundo dia de infusão contínua, o paciente evoluiu com confusão mental aguda, dispneia intensa por falência ventilatória, taquicardia ventricular não sustentada e edema periférico. O diagnóstico mais provável para esta descompensação aguda e a conduta imediata são:","a":["A) Choque cardiogênico por infarto agudo do miocárdio; indicar cineangiocoronariografia.","C) Tromboembolismo pulmonar maciço; trombólise imediata com alteplase.","D) Acidose tubular renal tipo II; início de bicarbonato em bôlus contínuo.","B) Síndrome de Realimentação; suspender/reduzir drasticamente a taxa de infusão da dieta parenteral, monitorar e repor ativamente fósforo, potássio e magnésio, e suplementar tiamina endovenosa."],"correct":3},{"q":"[Nível 1: Classificação das Feridas Cirúrgicas] 1. O grau de contaminação bacteriana no momento da cirurgia define a classificação da ferida cirúrgica. Uma herniorrafia inguinal sem colocação de tela em um paciente hígido é classificada como ferida:","a":["A) Limpa.","B) Potencialmente contaminada.","C) Contaminada.","D) Infectada."],"correct":0},{"q":"2. Cirurgias que envolvem a abertura do trato respiratório, gastrointestinal, genital ou urinário em condições controladas e sem extravasamento significativo de conteúdo são classificadas como:","a":["A) Limpas.","B) Potencialmente contaminadas.","C) Contaminadas.","D) Sujas / Infectadas."],"correct":1},{"q":"3. Qual das cirurgias abaixo é o exemplo clássico de uma ferida potencialmente contaminada?","a":["A) Biópsia de linfonodo cervical.","C) Apendicectomia por apendicite supurada com peritonite difusa.","B) Colecistectomia eletiva por colelitíase sem inflamação aguda.","D) Drenagem de abscesso isquiorretal."],"correct":2},{"q":"4. Durante uma colectomia eletiva, ocorre o derramamento acidental maciço de fezes na cavidade abdominal. A classificação da ferida cirúrgica, que inicialmente era potencialmente contaminada, passa imediatamente a ser:","a":["A) Limpa com risco.","C) Suja / Infectada.","D) Irreversível.","B) Contaminada."],"correct":3},{"q":"5. A classificação de \\\"Ferida Suja ou Infectada\\\" aplica-se quando os microrganismos causadores da infecção pós-operatória já estavam presentes no campo operatório antes mesmo da incisão. Qual o melhor exemplo clínico?","a":["C) Laparotomia exploradora para correção de úlcera gástrica perfurada há 24 horas com peritonite purulenta.","A) Gastrectomia parcial por úlcera péptica crônica.","B) Histerectomia abdominal total.","D) Tireoidectomia total."],"correct":0},{"q":"6. Em feridas classificadas estritamente como Limpas, a antibioticoprofilaxia geralmente NÃO está indicada, EXCETO quando:","a":["A) A cirurgia durar mais de 30 minutos.","B) Houver inserção de próteses/implantes (ex: telas, válvulas, próteses ortopédicas) ou em cirurgias cardíacas e neurocirurgias.","C) O paciente for do sexo masculino e obeso.","D) A incisão for maior que 10 centímetros."],"correct":1},{"q":"7. Feridas traumáticas recentes (abertas há menos de 4 a 6 horas), acidentais, penetrantes e com quebra de técnica asséptica durante a cirurgia são classificadas como:","a":["A) Limpas.","B) Potencialmente contaminadas.","C) Contaminadas.","D) Infectadas."],"correct":2},{"q":"8. A taxa de Infecção de Sítio Cirúrgico (ISC) esperada estatisticamente para uma ferida cirúrgica estritamente limpa sem uso de profilaxia sistêmica é de aproximadamente:","a":["B) 10% a 15%.","C) 20% a 30%.","D) Superior a 40%.","A) 1% a 2%."],"correct":3},{"q":"9. Um paciente sofre ferimento por arma de fogo no abdome, com perfuração de cólon transverso. A cirurgia é realizada 1 hora após o trauma. Esta ferida é classificada como:","a":["B) Contaminada.","A) Potencialmente contaminada.","C) Limpa, pois o trauma foi recente.","D) Suja / Infectada, pois fezes entraram em contato com o sangue."],"correct":0},{"q":"10. Qual dos procedimentos abaixo converte uma cirurgia de via biliar (potencialmente contaminada) em uma cirurgia com ferida Infectada/Suja?","a":["A) Colangiografia intraoperatória demonstrando cálculo no colédoco.","B) Presença de bile com pus evidente (piocolecisto) ou empiema biliar no momento da abertura.","C) Sangramento intenso do leito vesicular.","D) Duração da colecistectomia superior a 2 horas."],"correct":1},{"q":"[Nível 2: Profilaxia Antibiótica em Cirurgia] 11. Qual é o momento (timing) exato e padrão-ouro exigido pelos protocolos internacionais de segurança para a infusão venosa do antibiótico profilático antes de uma cirurgia?","a":["A) Nas 24 horas que antecedem a cirurgia, via oral.","C) Exatamente no momento do fechamento da aponeurose.","B) Entre 30 a 60 minutos ANTES da incisão cirúrgica na pele.","D) Na sala de recuperação pós-anestésica."],"correct":2},{"q":"12. A droga de escolha universal (primeira linha) para profilaxia cirúrgica na imensa maioria das cirurgias limpas e para cobertura de bactérias da pele (Staphylococcus sp.) é a:","a":["B) Cefepime (Cefalosporina de 4ª geração).","C) Ciprofloxacino (Fluoroquinolona).","D) Metronidazol.","A) Cefazolina (Cefalosporina de 1ª geração)."],"correct":3},{"q":"13. Em cirurgias colorretais ou apendicectomias, o espectro profilático precisa obrigatoriamente cobrir bacilos Gram-negativos e bactérias anaeróbias do cólon. Qual esquema profilático é classicamente utilizado nestes casos?","a":["B) Cefazolina associada ao Metronidazol (ou Cefoxitina isolada).","A) Penicilina G Cristalina pura.","C) Vancomicina associada a Clindamicina.","D) Eritromicina venosa isolada."],"correct":0},{"q":"14. Qual é a regra fundamental para o repique (dose intraoperatória adicional) do antibiótico profilático?","a":["A) Deve ser feito a cada hora, independentemente da droga.","C) Quando a cirurgia durar mais do que duas meias-vidas do fármaco (ex: > 4h para a cefazolina) ou se houver sangramento maciço (> 1.500 mL).","B) Apenas se o paciente apresentar febre no intraoperatório.","D) É estritamente proibido repicar antibióticos no intraoperatório pelo risco de nefrotoxicidade."],"correct":1},{"q":"15. Qual deve ser a duração máxima da antibioticoprofilaxia cirúrgica na maioria esmagadora das cirurgias eletivas, segundo os guidelines modernos (CDC/OMS)?","a":["A) Manter por 7 dias corridos.","B) Manter até a retirada de todos os drenos.","C) Apenas a dose única pré-operatória, ou no máximo estendida por 24 horas no pós-operatório.","D) Manter até a alta hospitalar do paciente."],"correct":2},{"q":"16. Em um paciente com histórico de anafilaxia grave (choque/edema de glote) à penicilina e cefalosporinas, qual é o antibiótico de escolha para substituir a cefazolina na profilaxia de cobertura de pele (Gram-positivos)?","a":["A) Ampicilina-Sulbactam.","B) Ceftriaxona.","D) Amoxicilina com Clavulanato.","C) Clindamicina ou Vancomicina."],"correct":3},{"q":"17. A Vancomicina é reservada na profilaxia cirúrgica como agente primário quando há:","a":["B) Surto ou alta prevalência hospitalar de Staphylococcus aureus resistente à meticilina (MRSA) ou paciente previamente colonizado.","A) Cirurgia cardíaca com CEC prolongada.","C) Perfuração gástrica recente.","D) Cirurgia urológica endoscópica."],"correct":0},{"q":"18. Caso a profilaxia escolhida seja a Vancomicina ou Fluoroquinolonas, a janela de tempo (timing) para a infusão pré-operatória é alterada para:","a":["A) 30 a 60 minutos antes do corte.","B) 60 a 120 minutos (1 a 2 horas) antes da incisão, devido ao tempo prolongado de infusão exigido para evitar reações colaterais (ex: Síndrome do Homem Vermelho).","C) 12 horas antes da cirurgia, na enfermaria.","D) Imediatamente após a intubação orotraqueal em bôlus rápido."],"correct":1},{"q":"19. A utilização de antibióticos por via oral associados ao preparo mecânico intestinal no dia anterior à cirurgia é uma prática validada especificamente para reduzir ISC em cirurgias:","a":["A) Hepáticas.","B) Esofágicas.","C) Colorretais eletivas (Neomicina + Eritromicina base).","D) Ortopédicas de coluna."],"correct":2},{"q":"20. Administrar antibióticos para um paciente com apendicite aguda fase IV (perfurada com abscesso/pus livre) obedece a qual finalidade médica?","a":["A) Profilática, devendo durar 24 horas.","B) Preemptiva, visando evitar endocardite.","D) Paliativa.","C) Terapêutica (tratamento de infecção estabelecida), geralmente mantida por 3 a 7 dias, dependendo do controle do foco."],"correct":3},{"q":"[Nível 3: Bundles de Prevenção e Preparo Pré-Operatório] 21. O conjunto de medidas baseadas em evidências agrupadas para reduzir infecção de sítio cirúrgico é chamado de \\\"Bundle\\\". Qual das seguintes práticas de preparo da pele AUMENTA o risco de infecção e foi proscrita pelas diretrizes modernas?","a":["A) Tricotomia (remoção de pelos) com lâmina de barbear (gilete) na véspera da cirurgia.","B) Banho pré-operatório com clorexidina degermante ou sabonete neutro.","C) Antissepsia da pele no centro cirúrgico utilizando soluções alcoólicas.","D) Tricotomia utilizando tricotomizador elétrico apenas na sala cirúrgica."],"correct":0},{"q":"22. Se for absolutamente necessário remover os pelos do sítio cirúrgico para não atrapalhar o procedimento, como e quando isso deve ser feito?","a":["A) Com cremes depilatórios na semana anterior.","C) Com tricotomizador elétrico (clippers) imediatamente antes da cirurgia, já no bloco cirúrgico.","B) Com lâmina de barbear 12 horas antes.","D) Com fita adesiva de depilação e cera quente."],"correct":1},{"q":"23. O antisséptico de escolha superior, com maior efeito residual na pele do paciente no centro cirúrgico (reduzindo significativamente a taxa de ISC quando comparado ao iodopovidona-PVPI), é a:","a":["B) Água oxigenada a 10 volumes.","C) Soro fisiológico morno.","A) Clorexidina degermante seguida de Clorexidina alcoólica.","D) Permanganato de potássio."],"correct":2},{"q":"24. Qual das seguintes variáveis fisiológicas, se não controlada rigorosamente no perioperatório, causa vasoconstrição periférica, diminui a tensão de oxigênio no tecido subcutâneo e paralisa a função dos neutrófilos, disparando o risco de ISC?","a":["A) Frequência cardíaca basal de 80 bpm.","C) Normoglicemia (Glicemia de 110 mg/dL).","D) Pressão arterial de 120/80 mmHg.","B) Hipotermia intraoperatória."],"correct":3},{"q":"25. O controle glicêmico estrito no paciente diabético ou sob estresse cirúrgico é um dos pilares do bundle de ISC. Qual é a faixa alvo de glicemia recomendada pelas diretrizes atuais para evitar ISC sem causar hipoglicemia severa?","a":["B) Entre 140 e 180 mg/dL (ou < 180 mg/dL, a depender do guideline ERAS).","A) < 80 mg/dL.","C) Entre 200 e 250 mg/dL.","D) A glicemia só deve ser tratada se ultrapassar 300 mg/dL."],"correct":0},{"q":"26. O processo de lavagem cirúrgica das mãos pela equipe médica (escovação) visa eliminar a flora transitória e reduzir a flora residente. Qual o tempo recomendado para a primeira escovação cirúrgica do dia?","a":["A) 30 segundos.","C) 3 a 5 minutos.","B) 1 minuto.","D) 15 minutos."],"correct":1},{"q":"27. Na antissepsia cirúrgica das mãos com preparação alcoólica (sem enxágue) em substituição à escovação tradicional com água e sabão degermante, o requisito essencial é que as mãos estejam:","a":["A) Contaminadas com sangue antes da aplicação.","B) Molhadas e úmidas ao receber o álcool.","C) Visivelmente limpas e completamente secas antes da aplicação da solução alcoólica.","D) Enluvadas antes da aplicação."],"correct":2},{"q":"28. Em relação ao fluxo e controle de ar no centro cirúrgico (fator de risco ambiental para ISC), as salas de cirurgia devem operar sob:","a":["A) Pressão de ar negativa, para puxar o ar do corredor para dentro.","C) Pressão neutra absoluta.","D) Fluxo laminar obrigatório para todas as cirurgias menores.","B) Pressão de ar positiva em relação aos corredores, expulsando o ar de dentro da sala para fora quando as portas são abertas."],"correct":3},{"q":"29. Oxigenação tecidual adequada previne infecções de sítio cirúrgico. A diretriz da OMS recomenda, para pacientes intubados recebendo anestesia geral em cirurgias com alto risco de ISC, o uso intraoperatório de:","a":["B) Fração inspirada de O2 (FiO2) elevada (cerca de 80%) durante a cirurgia e nas 2-6 horas imediatas de pós-operatório (desde que sem contraindicações).","A) Oxigenioterapia hiperbárica sistêmica.","C) CPAP profilático nasal a 100%.","D) Nebulização com broncodilatadores a cada hora."],"correct":0},{"q":"30. A manutenção da normovolemia previne a Infecção de Sítio Cirúrgico pois:","a":["A) Dilui o excesso de antibiótico no sangue.","B) Garante débito cardíaco adequado, perfusão tecidual, oxigenação da ferida e entrega de macrófagos e antibióticos ao sítio cirúrgico.","C) Reduz a diurese, preservando eletrólitos.","D) Causa edema de ferida, isolando bactérias mecanicamente."],"correct":1},{"q":"[Nível 4: Diagnóstico e Critérios da Infecção de Sítio Cirúrgico] 31. Segundo o CDC, a Infecção de Sítio Cirúrgico (ISC) é definida como aquela que ocorre no sítio operatório dentro de qual janela de tempo padrão pós-procedimento?","a":["A) Até 7 dias.","C) Exclusivamente durante a internação hospitalar.","B) Até 30 dias (ou até 90 dias / 1 ano se houver colocação de prótese ou implante).","D) Até 6 meses para qualquer cirurgia geral."],"correct":2},{"q":"32. A ISC classificada como Incisional Superficial envolve obrigatoriamente:","a":["A) O músculo e a aponeurose.","B) Qualquer órgão ou cavidade manuseada na cirurgia.","D) Espaços retroperitoneais ocultos.","C) Apenas a pele e o tecido celular subcutâneo do local da incisão."],"correct":3},{"q":"33. Qual dos seguintes achados clínicos confirma o diagnóstico de ISC Incisional Superficial?","a":["B) Drenagem de secreção purulenta da incisão superficial (mesmo sem resultado de cultura).","A) Dor localizada de leve intensidade sem rubor.","C) Saída de líquido serossanguinolento claro na primeira troca de curativo.","D) Presença de pontos de sutura levemente hiperemiados sem edema (micro-abscesso de ponto)."],"correct":0},{"q":"34. A ISC Incisional Profunda acomete fáscia e músculos. Qual situação fecha o critério diagnóstico para esse tipo de infecção?","a":["B) Presença de coleções purulentas apenas na epiderme.","A) A incisão profunda abrir espontaneamente, ou for aberta intencionalmente pelo cirurgião num paciente com febre e dor localizada.","C) Celulite difusa do membro contralateral.","D) Presença de pus saindo exclusivamente pelo dreno torácico."],"correct":1},{"q":"35. A ISC de Órgão/Espaço caracteriza-se por infecção em qualquer parte da anatomia diferente da incisão da parede que foi aberta/manipulada. Um exemplo clássico é o:","a":["A) Abscesso subcutâneo em cicatriz de cesárea.","C) Eritema nas bordas da ferida do trocater umbilical.","B) Abscesso intracavitário pélvico (saco de Douglas) 15 dias pós-apendicectomia.","D) Deiscência de aponeurose sem sinais flogísticos (hérnia incisional precoce)."],"correct":2},{"q":"36. No Brasil, qual microrganismo isolado é o agente etiológico mais comum nas Infecções de Sítio Cirúrgico globais?","a":["A) Escherichia coli.","C) Pseudomonas aeruginosa.","D) Streptococcus pyogenes.","B) Staphylococcus aureus (incluindo MRSA)."],"correct":3},{"q":"37. Uma infecção cirúrgica muito grave e fulminante que surge nas primeiras 24-48 horas de pós-operatório, cursando com dor desproporcional, toxemia sistêmica grave, bolhas e necrose da pele (crepitação) tem como principal diagnóstico de exclusão:","a":["B) Infecção necrosante de partes moles (Fasciíte Necrosante), frequentemente por Streptococcus do Grupo A ou polimicrobiana (Gangrena de Fournier/Meleney).","A) Celulite superficial por fungos.","C) Abscesso incisional profundo estéril.","D) Erisipela clássica leve."],"correct":0},{"q":"38. O Abscesso de Ponto (pequena inflamação contrita e restrita unicamente ao local de penetração do fio de sutura) deve ser notificado à CCIH como Infecção de Sítio Cirúrgico Superficial?","a":["A) Sim, sempre.","B) Não. É considerado inflamação local e não fecha critério CDC para ISC.","C) Apenas se houver febre > 40°C.","D) Apenas se o fio for absorvível."],"correct":1},{"q":"39. A principal medida terapêutica para o tratamento de uma ISC Incisional Superficial simples sem sinais de toxicidade sistêmica (sem febre, taquicardia ou celulite extensa) é:","a":["A) Antibioticoterapia venosa de amplo espectro por 14 dias.","B) Curativos compressivos e alta.","C) Abertura da ferida cirúrgica, drenagem do pus, lavagem e cuidados locais. Não há indicação de antibiótico sistêmico rotineiro.","D) Fechamento hermético imediato no centro cirúrgico."],"correct":2},{"q":"40. Qual dos escores abaixo é classicamente utilizado para estratificar o risco de um paciente desenvolver infecção do sítio cirúrgico, levando em conta o estado ASA, a classificação da ferida e o tempo cirúrgico (Escore NNIS/NHSN)?","a":["A) Índice de Goldman.","B) Escore de Alvarado.","D) Escore de Caprini.","C) Escore do CDC (SENIC/NNIS)."],"correct":3},{"q":"[Nível 5: Precauções, Isolamento e Casos Clínicos] 41. Paciente no 5º DPO de laparotomia desenvolve diarreia profusa, dor abdominal e leucocitose. O teste para Toxina de Clostridioides difficile vem positivo. Qual é a medida de precaução (isolamento) obrigatória e o método de higiene das mãos, respectivamente?","a":["C) Precaução de Contato (avental e luvas) / Lavagem das mãos rigorosamente com água e sabão (o álcool não destrói os esporos do C. diff).","A) Precaução Padrão / Álcool em gel.","B) Precaução para Gotículas / Álcool em gel.","D) Precaução por Aerossóis / Escovação cirúrgica."],"correct":0},{"q":"42. Um cirurgião será escalado para operar um paciente com Tuberculose Pulmonar bacilífera ativa (baciloscopia positiva). Além das precauções padrão, a equipe dentro de sala deve utilizar proteção para qual via de transmissão e usar qual EPI específico?","a":["A) Gotículas / Máscara cirúrgica simples.","C) Aerossóis / Máscara respiradora particulada tipo PFF2 ou N95 e sala idealmente com pressão negativa.","B) Contato / Luvas duplas apenas.","D) Vetorial / Repelentes e avental de chumbo."],"correct":1},{"q":"43. Durante um fechamento de aponeurose, a residente sofre acidente perfurocortante profundo com agulha suja de sangue do paciente (status sorológico desconhecido). A primeira conduta IMEDIATA no campo, segundo a biossegurança, é:","a":["A) Espremer vigorosamente o local para sangrar bastante e aplicar iodo puro.","C) Realizar sutura do dedo cortado e continuar a cirurgia para não atrasar o mapa.","B) Lavar exaustivamente a área exposta com água e sabão neutro, comunicar a chefia e se dirigir ao setor de saúde ocupacional para notificação/profilaxia (PEP).","D) Iniciar profilaxia antirretroviral tríplice imediatamente dentro de sala sem comunicar ninguem."],"correct":2},{"q":"44. Paciente no 12º DPO de gastrectomia por câncer evolui com picos febris. Abdome inocente, ferida operatória limpa e sem secreções. Nota-se hiperemia e saída de secreção purulenta exsudativa pelo óstio de inserção do Cateter Venoso Central (CVC) na veia jugular interna. A conduta mandatória inicial e o diagnóstico presuntivo são:","a":["A) Infecção primária da parede abdominal / Ultrassom da parede.","C) Sepse de foco pulmonar oculto / Iniciar macrolídeo oral.","D) Endocardite bacteriana subaguda aguda / Trocar o curativo apenas.","B) Infecção de Corrente Sanguínea Relacionada a Cateter (IPCS) / Coletar hemoculturas (periférica e do cateter) e remover o cateter imediatamente se houver pus no óstio."],"correct":3},{"q":"45. Um caso clínico: Paciente obeso, diabético, operado de hérnia umbilical (tela). No pré-op: raspou os pelos em casa com gilete, tomou cefazolina 2 horas ANTES da cirurgia e chegou com glicemia de 280 mg/dL. Fez ISC no 7º DPO. Quais falhas no \\\"Bundle\\\" de prevenção podem justificar essa complicação?","a":["B) Uso de gilete (tricotomia inadequada gera microabrasões e proliferação bacteriana), timing errado do ATB (deveria ser < 60 min) e hiperglicemia descontrolada (reduz função neutrofílica).","A) Uso da tela, que é contraindicado no diabetes.","C) O erro foi o momento de internação prolongado e falta de vancomicina sistêmica.","D) Falta de preparo colônico pré-operatório para uma hérnia de parede."],"correct":0},{"q":"46. Você prescreve antibiótico para uma cirurgia ortopédica (fratura de fêmur) que se inicia às 08h00. O anestesista administra a cefazolina às 07h15. A cirurgia atrasa e o corte só é feito às 10h30. Qual é a conduta farmacológica correta a ser adotada pelo anestesista às 10h15?","a":["A) Cancelar a cirurgia por quebra de protocolo.","C) Realizar uma nova dose profilática (repique), pois a meia-vida passou e o nível sérico na pele e subcutâneo no momento da incisão não é mais adequado.","B) Manter, pois a cefazolina dura 24 horas no sangue.","D) Trocar a cefazolina por gentamicina no intraoperatório."],"correct":1},{"q":"47. Paciente foi submetido a ressecção de tumor de cólon direito (colectomia direita). A ferida estava classificada como limpa-contaminada, e recebeu profilaxia de cefazolina + metronidazol (1 hora antes). A cirurgia durou 2 horas. Qual o prazo correto para a suspensão definitiva deste antibiótico no pós-operatório?","a":["B) No 3º dia de pós-operatório ou retorno do trânsito.","C) Após 7 dias completos, para evitar fístulas.","A) Nas primeiras 24 horas pós-operatórias (idealmente, até mesmo encerrar ao fechar a pele).","D) Quando a leucocitose pré-operatória normalizar."],"correct":2},{"q":"48. O manejo ambiental e do tráfego na sala de operações (SO) dita que o risco de ISC sobe proporcionalmente à quebra de barreiras. Qual é uma infração grave de biossegurança dentro da SO durante uma prótese total de quadril?","a":["A) A manutenção de temperatura da sala entre 20°C e 24°C.","C) Uso de duas luvas estéreis pelo cirurgião principal.","D) Posicionamento dos campos estéreis secos sobre o paciente após a clorexidina evaporar.","B) Manter as portas da sala cirúrgica constantemente abertas (quebrando a pressão positiva) e promover alto tráfego de pessoal conversando sobre a ferida exposta."],"correct":3},{"q":"49. Mulher jovem será submetida a tireoidectomia (ferida limpa). A enfermagem pergunta ao acadêmico se deve ou não remover o discreto vellus (penugem) da região cervical anterior antes de levar a paciente ao bloco cirúrgico. Resposta padrão-ouro baseada no CDC:","a":["B) Não se deve remover o pelo a menos que este venha interferir gravemente no procedimento cirúrgico. Pelos discretos devem ser deixados intactos.","A) Sim, sempre remover com creme químico 24h antes.","C) Sim, remover com fita adesiva para evitar uso de gilete.","D) Apenas se a paciente autorizar raspagem a seco."],"correct":0},{"q":"50. Cirurgião diagnostica um paciente no pós-operatório com Infecção de Sítio Cirúrgico Órgão/Espaço (abscesso de cúpula vaginal no 10º DPO de histerectomia) evidenciado por tomografia com pus drenado percutaneamente. Além da notificação obrigatória à CCIH, o manejo terapêutico desta complicação exige primariamente:","a":["A) Apenas abertura dos pontos na pele do abdome e limpeza com soro.","C) Drenagem da coleção infecciosa associada a antibioticoterapia terapêutica sistêmica dirigida ao foco ginecológico (cobrir gram-negativos e anaeróbios).","B) Suporte volêmico exclusivo sem punção.","D) Curativo a vácuo na incisão da pele superficial, ignorando a coleção profunda."],"correct":1},{"q":"[Nível 1: Classificação ASA e Conceitos Básicos] 1. O objetivo principal da avaliação pré-operatória é:","a":["A) Dar o \"visto/liberaÃ§Ã£o\" mÃ©dico para que o cirurgiÃ£o possa operar com seguranÃ§a legal.","C) Solicitar uma bateria completa de exames laboratoriais e de imagem para triagem populacional.","B) Avaliar o estado clínico do paciente, otimizar comorbidades e propor estratégias para reduzir a morbimortalidade perioperatória.","D) Garantir que o paciente não apresentará nenhuma complicação anestésica."],"correct":2},{"q":"2. Segundo a classificação da American Society of Anesthesiologists (ASA), um paciente hígido, sem doenças sistêmicas, não tabagista e que consome álcool apenas socialmente (mínimo) é classificado como:","a":["B) ASA II.","C) ASA III.","D) ASA IV.","A) ASA I."],"correct":3},{"q":"3. Um paciente de 45 anos, tabagista ativo, portador de Hipertensão Arterial Sistêmica bem controlada com medicação e obesidade leve (IMC 32), sem limitação funcional, é classificado como:","a":["B) ASA II.","A) ASA I.","C) ASA III.","D) ASA IV."],"correct":0},{"q":"4. A classificação ASA III é definida como:","a":["A) Paciente com doença sistêmica grave que representa constante ameaça à vida.","C) Paciente com doença sistêmica grave que resulta em limitação funcional substantiva, mas não é uma ameaça imediata à vida (ex: diabetes descompensado, IAM há > 3 meses).","B) Paciente com doença sistêmica leve, sem limitação funcional.","D) Paciente moribundo que não se espera que sobreviva 24 horas sem a cirurgia."],"correct":1},{"q":"5. Um paciente internado na UTI, em choque cardiogênico, intubado e utilizando altas doses de vasopressores, que necessita de uma laparotomia exploradora de urgência, seria classificado como:","a":["A) ASA III.","B) ASA IV.","C) ASA V.","D) ASA VI."],"correct":2},{"q":"6. O que significa o sufixo \\\"E\\\" (ex: ASA II-E ou ASA III-E) adicionado à classificação ASA?","a":["A) Estado terminal (End-stage).","C) Cirurgia Eletiva.","D) Uso de anestesia peridural (Epidural).","B) Procedimento de Emergência."],"correct":3},{"q":"7. A classificação ASA VI é reservada exclusivamente para:","a":["C) Pacientes com morte encefálica declarada, cujos órgãos estão sendo removidos para doação.","A) Pacientes idosos acima de 90 anos.","B) Gestantes em trabalho de parto complicado.","D) Cirurgias de revascularização miocárdica de emergência."],"correct":0},{"q":"8. De acordo com as diretrizes atuais de jejum pré-operatório (ERAS/ACERTO/ASA), qual é o tempo mínimo de jejum recomendado para líquidos claros sem resíduos (água, chás, sucos sem polpa)?","a":["B) 4 horas.","A) 2 horas.","C) 6 horas.","D) 8 horas."],"correct":1},{"q":"9. Para a ingestão de uma refeição leve (ex: torradas e chá) ou leite não-humano, o jejum pré-operatório deve ser de, no mínimo:","a":["A) 2 horas.","B) 4 horas.","C) 6 horas.","D) 8 horas."],"correct":2},{"q":"10. Em pacientes obesos submetidos a cirurgia bariátrica, as diretrizes modernas de jejum recomendam que a abreviação do jejum com líquidos claros enriquecidos com carboidratos (até 2 horas antes):","a":["A) É contraindicada pelo alto risco de broncoaspiração devido ao grande volume gástrico residual crônico.","B) Deve ser feita com solução hipertônica de sódio.","D) Só deve ser aplicada se o paciente for ASA I.","C) É segura, recomendada e ajuda a atenuar a resistência à insulina perioperatória."],"correct":3},{"q":"[Nível 2: Avaliação de Risco Cardiovascular e Capacidade Funcional] 11. A avaliação da Capacidade Funcional do paciente é expressa em Equivalentes Metabólicos (METs). Um paciente com excelente capacidade funcional, que pode praticar esportes extenuantes, possui capacidade superior a:","a":["B) 4 METs.","A) 1 MET.","C) 10 METs.","D) 20 METs."],"correct":0},{"q":"12. O ponto de corte clínico prático para definir uma baixa capacidade funcional (ou capacidade ruim), que acende um alerta na avaliação pré-operatória, é a incapacidade do paciente de atingir:","a":["B) 7 METs.","A) 4 METs (ex: subir dois lances de escada ou caminhar lances rápidos sem parar).","C) 10 METs.","D) 12 METs."],"correct":1},{"q":"13. O Índice de Risco Cardíaco Revisado de Lee (RCRI) é amplamente utilizado. Qual das alternativas abaixo NÃO faz parte dos 6 preditores clínicos independentes de Lee?","a":["A) Doença isquêmica do coração (história de IAM).","B) Insuficiência cardíaca congestiva.","D) Idade superior a 70 anos.","C) Diabetes Mellitus em uso de insulina."],"correct":2},{"q":"14. Além dos citados na questão anterior, quais são os outros 3 preditores do Índice de Risco de Lee (RCRI)?","a":["B) Cirurgia ortopédica, HAS descompensada e Tabagismo.","C) Obesidade mórbida, Creatinina > 1,5 mg/dL e Uso de anticoagulantes.","D) Doença valvar aórtica grave, DPOC severo e IAM recente.","A) Cirurgia de alto risco (intratorácica, intra-abdominal ou suprainguinal vascular), História de Doença Cerebrovascular (AVC/AIT) e Creatinina sérica > 2,0 mg/dL."],"correct":3},{"q":"15. Qual dos procedimentos cirúrgicos abaixo é classificado como de Alto Risco Cardiovascular (risco de IAM ou morte cardiovascular perioperatória > 5%) segundo a AHA/ACC?","a":["B) Cirurgia de revascularização arterial periférica ou cirurgia aberta de aorta.","A) Cirurgia endoscópica urológica.","C) Cirurgia de mama.","D) Herniorrafia inguinal eletiva."],"correct":0},{"q":"16. De acordo com o algoritmo da ACC/AHA para avaliação perioperatória, o passo inicial ao avaliar um paciente cirúrgico é perguntar:","a":["A) Qual é a creatinina do paciente?","B) A cirurgia é de emergência? (Se sim, prosseguir para o centro cirúrgico e estratificar o risco no pós-operatório).","C) O paciente toma aspirina?","D) O paciente tem capacidade > 10 METs?"],"correct":1},{"q":"17. Um paciente de 60 anos, com história de infarto agudo do miocárdio há 5 anos (sem angina atual), fará uma cirurgia de catarata (risco cardiovascular do procedimento < 1%). O paciente é sedentário (< 4 METs). Qual é a conduta quanto à investigação cardiovascular?","a":["A) Solicitar Teste Ergométrico antes da cirurgia.","B) Solicitar Cintilografia Miocárdica.","C) Proceder à cirurgia sem necessidade de exames adicionais, pois a cirurgia é de baixo risco.","D) Cancelar a cirurgia até que o paciente melhore o condicionamento físico."],"correct":2},{"q":"18. Qual das seguintes condições cardiológicas é considerada uma Condição Ativa (ou Grave) que exige adiamento de cirurgias eletivas para investigação e tratamento imediato?","a":["A) Bloqueio de Ramo Direito (BRD) assintomático.","C) Infarto Agudo do Miocárdio ocorrido há 2 anos, revascularizado.","D) Hipertensão arterial de 150/90 mmHg.","B) Estenose aórtica grave e sintomática."],"correct":3},{"q":"19. Se um paciente foi submetido a uma angioplastia com implante de Stent Farmacológico (DES) devido a uma síndrome coronariana aguda, qual é o tempo mínimo recomendado de espera para realizar uma cirurgia eletiva de grande porte, visando evitar a trombose do stent?","a":["C) 6 meses (idealmente 12 meses, mas pode ser em 3 a 6 meses se o risco cirúrgico de atraso for alto).","A) 14 dias.","B) 30 dias.","D) 5 anos."],"correct":0},{"q":"20. Paciente em uso crônico de Betabloqueador (Atenolol) para insuficiência cardíaca e hipertensão é internado para cirurgia de ressecção de cólon. Qual é a conduta perioperatória recomendada pelas diretrizes em relação ao Betabloqueador?","a":["A) Suspender no dia da cirurgia para evitar bradicardia refratária intraoperatória.","C) Manter o uso do betabloqueador, inclusive na manhã da cirurgia.","B) Suspender 48 horas antes.","D) Dobrar a dose na véspera para conter o estresse cirúrgico."],"correct":1},{"q":"[Nível 3: Exames Pré-Operatórios de Rotina] 21. A prática de solicitar exames pré-operatórios de \\\"rotina\\\" ou \\\"bateria completa\\\" para todos os pacientes é atualmente proscrita. Pacientes jovens e hígidos (ASA I), assintomáticos, submetidos a cirurgias de pequeno porte (ex: postectomia, ressecção de cisto sebáceo) necessitam de quais exames laboratoriais?","a":["A) Hemograma e Coagulograma.","B) Glicemia e ECG.","C) Nenhum exame laboratorial é obrigatoriamente indicado.","D) Raio-X de tórax e Ureia/Creatinina."],"correct":2},{"q":"22. Em relação ao Eletrocardiograma (ECG) de repouso, a maioria das sociedades médicas (como a SBC) recomenda sua solicitação rotineira pré-operatória (mesmo em assintomáticos sem história cardiovascular) a partir de qual idade?","a":["A) > 20 anos.","B) > 30 anos.","D) > 65 anos apenas se houverem sintomas.","C) > 40 anos para homens e > 50 anos para mulheres."],"correct":3},{"q":"23. Qual das alternativas abaixo apresenta uma indicação clássica e baseada em evidências para a solicitação de Coagulograma (TAP/TTPA) no pré-operatório?","a":["B) Pacientes com história clínica de sangramento excessivo, hepatopatia, desnutrição grave ou uso de anticoagulantes.","A) Para todas as cirurgias sob anestesia raquidiana.","C) Todos os pacientes acima de 60 anos.","D) Para cirurgias de catarata exclusivas."],"correct":0},{"q":"24. A radiografia de tórax pré-operatória (RX de Tórax) deve ser solicitada rotineiramente para pacientes assintomáticos a partir de qual idade (quando a cirurgia for de médio/grande porte)?","a":["A) > 40 anos.","C) > 60 anos (segundo parte das diretrizes, ou apenas se houver doença cardiopulmonar).","B) > 50 anos.","D) É obrigatória para todas as faixas etárias."],"correct":1},{"q":"25. Um exame laboratorial que deve ser solicitado ou no mínimo questionado no pré-operatório para todas as mulheres em idade fértil (menacme), antes de qualquer procedimento anestésico, é:","a":["A) Dosagem de TSH.","C) Ultrassom pélvico.","B) Beta-hCG (Teste de gravidez).","D) Papanicolau."],"correct":2},{"q":"26. Durante a avaliação de um paciente masculino de 55 anos, diabético e hipertenso para uma cirurgia de correção de aneurisma de aorta, você solicita ureia e creatinina séricas. A principal justificativa racional para pedir função renal neste caso é:","a":["A) Dosar a reserva de potássio.","B) Avaliar o risco do uso de antibióticos profiláticos macrolídeos.","D) Verificar se a próstata do paciente permite a passagem de sonda.","C) O diabetes e a HAS aumentam o risco de doença renal crônica oculta; além disso, a cirurgia vascular é de alto risco e uma Cr > 2.0 eleva o Índice de Lee."],"correct":3},{"q":"27. Qual é a indicação para solicitar espirometria (Prova de Função Pulmonar) no pré-operatório?","a":["B) Pacientes candidatos a cirurgias de ressecção pulmonar (ex: lobectomia) ou naqueles com dispneia progressiva de origem indeterminada.","A) Em todos os tabagistas ativos, independentemente da carga tabágica.","C) Para todos os obesos com IMC > 30.","D) Como exame de rotina em idosos."],"correct":0},{"q":"28. Para a prevenção de nefrotoxicidade perioperatória grave, o paciente em uso de Metformina deve ter seu medicamento suspenso geralmente 24 a 48 horas antes (ou no mínimo no dia do procedimento) em qual situação cirúrgica específica?","a":["B) Cirurgias oftalmológicas.","A) Cirurgias que utilizarão contraste iodado endovenoso.","C) Pequenas cirurgias dermatológicas com anestesia local.","D) Se a glicemia de jejum for > 150 mg/dL."],"correct":1},{"q":"29. Uma mulher de 28 anos, ASA I, hígida, será submetida a uma videolaparoscopia ginecológica. Na anamnese, nega qualquer queixa, prática esportes regularmente e não usa medicações. Qual é o painel ideal de exames segundo as diretrizes de escolha racional (Choosing Wisely)?","a":["A) Hemograma, TAP/KPTT, Glicemia, Ureia/Creatinina, ECG, RX Tórax e Beta-hCG.","C) ECG, Ecocardiograma e Beta-hCG.","B) Apenas Beta-hCG. Hemograma pode ser opcional devido à videolaparoscopia pélvica, mas os demais não têm indicação clínica.","D) Apenas Coagulograma para a punção do trocater."],"correct":2},{"q":"30. O risco de mortalidade operatória em cirurgias de grande porte está fortemente correlacionado à concentração sérica pré-operatória de qual proteína plasmática?","a":["A) Ferritina.","B) Globulina.","D) Proteína C Reativa.","C) Albumina (hipoalbuminemia é um forte preditor de morbimortalidade)."],"correct":3},{"q":"[Nível 4: Manejo de Medicações no Perioperatório] 31. Paciente em uso crônico de Ácido Acetilsalicílico (AAS) 100 mg/dia devido a história prévia de revascularização miocárdica e stent farmacológico antigo. Vai ser submetido a uma colecistectomia videolaparoscópica. A recomendação moderna para o AAS é:","a":["B) Manter o AAS no perioperatório, pois o risco trombótico da retirada supera o risco de sangramento não neurocirúrgico na laparoscopia.","A) Suspender 7 a 10 dias antes da cirurgia para todos os pacientes.","C) Trocar por heparina de baixo peso molecular 5 dias antes.","D) Dobrar a dose 48h antes da cirurgia."],"correct":0},{"q":"32. Em relação aos inibidores do receptor P2Y12 (ex: Clopidogrel, Ticagrelor), quando devem ser tipicamente suspensos antes de uma cirurgia eletiva não cardíaca (assumindo que o período crítico do stent já passou)?","a":["A) Não devem ser suspensos.","C) Suspender 5 a 7 dias antes do procedimento, devido ao bloqueio plaquetário irreversível.","B) Suspender 24 horas antes.","D) Suspender 14 dias antes."],"correct":1},{"q":"33. Paciente faz uso de Varfarina por Fibrilação Atrial crônica. Vai se submeter a uma colectomia. Quantos dias antes da cirurgia a Varfarina deve ser suspensa e qual o parâmetro laboratorial de segurança antes da cirurgia?","a":["A) Suspender 1 dia antes; TAP normal.","C) Suspender 10 dias antes da cirurgia; operar se INR = 2,5.","B) Suspender 5 dias antes da cirurgia; operar se o INR estiver ≤ 1,5.","D) Não suspender; operar com INR entre 2,0 e 3,0."],"correct":2},{"q":"34. O conceito de \\\"Terapia de Ponte\\\" (Bridging Therapy) consiste em substituir o anticoagulante oral (Varfarina) por Heparina nos dias que antecedem a cirurgia. Esta terapia está fortemente indicada para qual perfil de paciente?","a":["A) Pacientes com Fibrilação Atrial de baixo risco (CHADS2 = 0).","B) Pacientes com tromboembolismo venoso (TEP/TVP) ocorrido há 5 anos.","D) Pacientes que usam AAS.","C) Pacientes portadores de válvula cardíaca mecânica mitral ou evento tromboembólico muito recente (< 3 meses)."],"correct":3},{"q":"35. Os Novos Anticoagulantes Orais (NOACs/DOACs), como a Rivaroxabana e a Apixabana, possuem meia-vida curta. Como regra geral para pacientes com função renal preservada submetidos a cirurgias de risco padrão de sangramento, eles devem ser suspensos por:","a":["A) 24 a 48 horas antes da cirurgia (sem necessidade de terapia de ponte com heparina).","B) 7 dias antes da cirurgia (com terapia de ponte com heparina).","C) Nunca devem ser suspensos.","D) 12 horas antes da cirurgia em qualquer contexto."],"correct":0},{"q":"36. Paciente diabético em uso de Insulina NPH (duas vezes ao dia) e Insulina Regular conforme destros. Qual é a orientação clássica para a dose de Insulina NPH na manhã da cirurgia (paciente em jejum)?","a":["A) Suspender completamente todas as insulinas.","C) Administrar cerca de metade a dois terços (1/2 a 2/3) da dose habitual da NPH para evitar cetoacidose, e suspender a insulina regular de ação rápida.","B) Administrar a dose cheia habitual.","D) Dobrar a dose da NPH para combater a hiperglicemia do estresse."],"correct":1},{"q":"37. Paciente em uso crônico de anti-hipertensivos. Qual classe de medicações cardiológicas gera grande controvérsia, mas frequentemente orienta-se suspender 24 horas antes (ou na manhã da cirurgia) pelo alto risco de hipotensão refratária pós-indução anestésica?","a":["A) Bloqueadores de Canal de Cálcio (ex: Anlodipino).","C) Betabloqueadores (ex: Metoprolol).","B) Inibidores da ECA (ex: Enalapril) e BRAs (ex: Losartana).","D) Clonidina."],"correct":2},{"q":"38. O paciente usa Corticosteroide sistêmico (ex: Prednisona 20 mg/dia) de forma crônica (> 3 semanas) por doença reumatológica. A cirurgia é de grande porte (ressecção intestinal). A conduta pré e intraoperatória essencial é:","a":["A) Suspender o corticoide 1 semana antes para evitar deiscência de anastomose.","C) Trocar o corticoide oral por AINEs (anti-inflamatórios não esteroidais) venosos.","D) Manter apenas a dose oral matinal habitual.","B) Administrar dose de estresse com Hidrocortisona venosa (ex: 50 a 100 mg 8/8h) para prevenir crise de Insuficiência Adrenal (Choque refratário)."],"correct":3},{"q":"39. Medicações antidepressivas e ansiolíticas de uso crônico, como os Inibidores Seletivos de Recaptação da Serotonina (ISRS) e os Benzodiazepínicos, devem ser no perioperatório:","a":["B) Mantidos normalmente até o dia da cirurgia, pois a suspensão abrupta causa grave síndrome de abstinência.","A) Suspensos 1 semana antes pelo risco de interação anestésica letal.","C) Substituídos por antipsicóticos atípicos.","D) Suspensos no dia anterior e reiniciados na alta hospitalar."],"correct":0},{"q":"40. Para a profilaxia da Endocardite Bacteriana Infecciosa, recomenda-se a administração de Amoxicilina (ou Clindamicina) profilática em procedimentos odontológicos e oro-respiratórios cirúrgicos. Esta profilaxia é direcionada para qual grupo de alto risco?","a":["A) Todos os portadores de prolapso da valva mitral sem regurgitação.","C) Pacientes com história de endocardite prévia, válvulas cardíacas protéticas ou cardiopatias congênitas cianogênicas não corrigidas.","B) Portadores de marcapasso cardíaco isolado.","D) Todos os idosos > 65 anos."],"correct":1},{"q":"[Nível 5: Risco Pulmonar, Prevenção de TEV e Casos Integrados] 41. Para a estratificação de risco de Complicações Pulmonares Pós-operatórias (CPPs), uma ferramenta validada clinicamente e recomendada é o:","a":["A) Escore de Caprini.","B) Índice de Goldman.","C) Escore ARISCAT.","D) Escore de Alvarado."],"correct":2},{"q":"42. Um paciente tabagista crônico deseja saber com quanta antecedência deve parar de fumar para que haja uma redução significativa e real do risco de complicações respiratórias pós-operatórias (retorno da função ciliar e redução de secreção). A resposta correta é:","a":["A) Pelo menos 12 a 24 horas antes.","B) Pelo menos 2 a 3 dias antes.","D) Parar de fumar antes da cirurgia aumenta o risco de complicação devido ao excesso de secreção por broncorragia.","C) Pelo menos 4 a 8 semanas antes."],"correct":3},{"q":"43. Dos fatores a seguir, qual é considerado o preditor relacionado ao paciente mais forte e consistente para complicações pulmonares pós-operatórias?","a":["C) Doença Pulmonar Obstrutiva Crônica (DPOC) severa.","A) Obesidade (IMC > 30).","B) História de asma leve controlada.","D) Sexo masculino."],"correct":0},{"q":"44. Na avaliação do risco de Tromboembolismo Venoso (TEV) - que inclui a Trombose Venosa Profunda (TVP) e o Tromboembolismo Pulmonar (TEP) - o escore clássico utilizado na cirurgia geral para ditar a necessidade de heparina profilática é o:","a":["B) Critérios de Light.","A) Escore de Caprini.","C) Escore de MELD.","D) Índice de Child-Pugh."],"correct":1},{"q":"45. Um paciente com Escore de Caprini igual a 5 (Alto Risco para TEV) submetido a uma colectomia direita não tem contraindicações a anticoagulação. A profilaxia ideal, iniciada antes ou imediatamente após a cirurgia, consiste em:","a":["A) Apenas deambulação precoce.","B) Meias de compressão elástica exclusivamente.","C) Profilaxia farmacológica (ex: Heparina de Baixo Peso Molecular - Enoxaparina) associada ou não à compressão pneumática intermitente.","D) Implante de filtro de veia cava profilático."],"correct":2},{"q":"46. (Caso Clínico) Homem, 72 anos, hipertenso, diabético tipo II controlado (HbA1c 6,5%), relata cansaço ao caminhar rapidamente, mas caminha meia hora todos os dias sem dor no peito. Vai fazer uma cirurgia de hérnia umbilical (risco baixo). De acordo com as diretrizes da ACC/AHA, a conduta pré-operatória será:","a":["A) Encaminhar para cateterismo imediatamente pela idade e fatores de risco.","C) Pedir ecocardiograma de estresse com dobutamina obrigatório por ser diabético.","D) Solicitar espirometria pela idade.","B) Liberar o paciente para o procedimento, pois a cirurgia é de baixo risco (<1%) e ele é assintomático cardiovascular, dispensando testes funcionais adicionais cardíacos."],"correct":3},{"q":"47. (Caso Clínico) Mulher, 65 anos, história de Acidente Vascular Cerebral (AVC) transitório há 1 ano e Insuficiência Cardíaca Congestiva (fração de ejeção 40%). Ela é candidata a uma cirurgia de revascularização arterial do membro inferior (Risco Cirúrgico Elevado). Ela é acamada por artrose e tem capacidade funcional desconhecida (< 4 METs). Conduta:","a":["A) Risco clínico elevado (RCRI de pelo menos 2) e capacidade funcional baixa. Solicitar teste não-invasivo de isquemia (ex: Cintilografia miocárdica ou Ecocardiograma de estresse), se o resultado for alterar o manejo.","B) Liberar imediatamente para a cirurgia sem exames de isquemia, prescrevendo apenas betabloqueador e estatinas na véspera.","C) Operar com anestesia local apenas.","D) Realizar cirurgia de revascularização do miocárdio (ponte de safena) profilática antes da perna."],"correct":0},{"q":"48. O Delirium pós-operatório é uma complicação devastadora, especialmente em idosos. Qual das alternativas abaixo constitui a medida preventiva não farmacológica de maior impacto comprovado nas enfermarias cirúrgicas?","a":["A) Manter o paciente em sedação contínua nas primeiras 48h.","C) Reorientação cognitivo-temporal diária, mobilização precoce, controle adequado da dor e promoção do ciclo sono-vigília regular (iluminação adequada diurna e silêncio noturno).","B) Restrição no leito e uso prolongado de cateter vesical para não perturbar o sono.","D) Administração de Haloperidol endovenoso para todos os maiores de 70 anos logo após a cirurgia."],"correct":1},{"q":"49. (Caso Clínico) Paciente deu entrada na emergência após trauma automobilístico com ruptura de baço em choque hemorrágico Classe IV. Na sala de trauma, você nota que ele porta um colar e pulseira identificando uso crônico de Metadona e Oxicodona (opioides) por dor crônica raquimedular. No manejo anestésico e pós-operatório desse paciente:","a":["A) Os opioides crônicos devem ser imediatamente suspensos pelo risco de vício.","B) A anestesia raquidiana está formalmente contraindicada.","C) A tolerância aos opioides exigirá doses possivelmente maiores de analgésicos narcóticos para controle da dor aguda no pós-operatório, sem suspender a medicação de base.","D) A dor cirúrgica não será sentida pois a medula já está bloqueada pelo uso crônico."],"correct":2},{"q":"50. O uso de exames laboratoriais pré-operatórios de forma não baseada em evidências (\\\"pedir tudo só por precaução\\\") resulta frequentemente em:","a":["A) Proteção médica legal absoluta em caso de morte na mesa de cirurgia.","B) Detecção precoce de múltiplos cânceres assintomáticos.","D) Redução de 50% na taxa global de infecções pós-operatórias.","C) Alta taxa de resultados falso-positivos, estresse do paciente, atrasos cirúrgicos injustificados, intervenções iatrogênicas desnecessárias e aumento do custo em saúde."],"correct":3},{"q":"[Nível 1: A Regra dos W's e Febre Pós-operatória] 1. A febre no período pós-operatório é classicamente investigada através da \\\"Regra dos W's\\\", baseada no tempo de surgimento após a cirurgia. O que o primeiro \\\"W\\\" (Wind - Vento), que ocorre geralmente nas primeiras 24 a 48 horas, representa?","a":["B) Atelectasia pulmonar.","A) Infecção do trato urinário.","C) Trombose venosa profunda.","D) Infecção da ferida operatória."],"correct":0},{"q":"2. Paciente no 4º dia de pós-operatório (DPO) de laparotomia evolui com febre isolada e disúria. O cateter vesical de demora foi retirado no 2º DPO. De acordo com a Regra dos W's, qual é o \\\"W\\\" correspondente e o provável diagnóstico?","a":["A) Wind / Pneumonia.","B) Water / Infecção do Trato Urinário (ITU).","C) Wound / Celulite de parede.","D) Walking / Embolia pulmonar."],"correct":1},{"q":"3. Qual \\\"W\\\" costuma se manifestar ao redor do 5º ao 7º DPO (Wound) e exige inspeção imediata da incisão cirúrgica?","a":["A) Reação adversa a medicamentos.","C) Pneumonia associada à ventilação.","B) Infecção de Sítio Cirúrgico (ISC).","D) Flebite superficial no acesso venoso."],"correct":2},{"q":"4. A febre que surge tardiamente, geralmente após o 7º dia de pós-operatório, e está associada ao mnemônico \\\"Wonder Drugs\\\" (ou abscesso intracavitário oculto), sugere:","a":["B) Atelectasia de base direita.","C) Crise tireotóxica.","D) Hemorragia digestiva alta.","A) Febre medicamentosa ou abscesso profundo."],"correct":3},{"q":"5. A febre que surge de forma fulminante durante a cirurgia ou nas primeiras 6 horas após a indução anestésica, associada a taquicardia e rigidez muscular, deve levantar suspeita imediata de:","a":["B) Hipertermia Maligna induzida por anestésicos inalatórios ou succinilcolina.","A) Atelectasia maciça.","C) Infecção de corrente sanguínea por cateter.","D) Translocação bacteriana."],"correct":0},{"q":"6. A medida profilática não farmacológica mais barata e eficaz para prevenir a febre do 1º \\\"W\\\" (Atelectasia) na enfermaria é:","a":["A) Uso de antibióticos de amplo espectro na indução.","B) Fisioterapia respiratória, espirometria de incentivo e deambulação precoce.","C) Restrição hídrica severa.","D) Manter o paciente deitado em decúbito dorsal estrito por 48h."],"correct":1},{"q":"7. Em relação à febre precoce (1º a 2º DPO), é correto afirmar que, na grande maioria das vezes, ela é:","a":["A) Infecciosa e exige troca do esquema antibiótico.","B) Causada por abscessos intra-abdominais mal drenados.","C) Fisiológica/inflamatória (resposta metabólica ao trauma) ou relacionada à atelectasia, dispensando antibióticos terapêuticos de imediato.","D) Sinal de deiscência aponeurótica."],"correct":2},{"q":"8. Paciente no 6º DPO de artroplastia total de quadril relata dor na panturrilha direita, com empastamento e febre leve de 37,8°C. A qual \\\"W\\\" essa complicação pertence?","a":["A) Wind.","B) Water.","D) Wound.","C) Walking (Trombose Venosa Profunda)."],"correct":3},{"q":"9. O surgimento de febre no 3º DPO em um paciente que permanece com Sonda Vesical de Demora (SVD) exige, como conduta inicial ideal (além de colher urinocultura):","a":["C) Sacar a sonda vesical (se não houver contraindicação urológica) e guiar tratamento pelo antibiograma.","A) Trocar a sonda e iniciar antifúngicos sistêmicos.","B) Lavar a sonda com clorexidina.","D) Aumentar a hidratação venosa sem mexer na sonda."],"correct":0},{"q":"10. Um paciente internado desenvolve febre no 10º DPO em uso de múltiplos antibióticos, heparina e anticonvulsivantes. Hemoculturas, urina e ferida estão normais. Há eosinofilia no hemograma. O diagnóstico de febre medicamentosa exige:","
